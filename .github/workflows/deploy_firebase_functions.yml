name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches: [main, feature/video-v1]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy_firebase_functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install function dependencies
        run: npm install --prefix functions
      - name: Test business publication
        run: node --test functions/test/business_publication.test.js
      - name: Test reservations
        run: node --test functions/test/reservation*.test.js
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Setup Java for chat tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test chat collaboration against emulator
        run: firebase emulators:exec --only firestore --project demo-tbt "node tool/test_chat_collaboration.cjs" --non-interactive
      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT', '')
          if not raw:
              raise SystemExit('FIREBASE_SERVICE_ACCOUNT secret is missing.')
          service_account = json.loads(raw)
          target = Path(os.environ['RUNNER_TEMP']) / 'firebase-service-account.json'
          target.write_text(json.dumps(service_account), encoding='utf-8')
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'GOOGLE_APPLICATION_CREDENTIALS={target}\n')
          PY
      - name: Repair the reported Burak business listing
        if: contains(github.event.head_commit.message, '[repair-burak-publication]')
        run: node functions/scripts/repair_business_publication.js dining:user_4xFEQcn0tjLktR5Cq85n
      - name: Deploy Firebase Functions
        env:
          CHAT_UPDATE: ${{ contains(github.event.head_commit.message, '[chat-update]') }}
          PREPARATION_UPDATE: ${{ contains(github.event.head_commit.message, '[preparation-update]') }}
          RESERVATION_INDEX: ${{ contains(github.event.head_commit.message, '[reservation-index]') }}
          RESERVATION_UPDATE: ${{ contains(github.event.head_commit.message, '[reservation-update]') }}
          PUBLICATION_REPAIR: ${{ contains(github.event.head_commit.message, '[repair-burak-publication]') }}
        run: |
          if [ "$CHAT_UPDATE" = "true" ]; then
            firebase deploy --only functions:chatAction,functions:chatGroupMessageNotification,functions:pushOnNotificationCreated --project en-iyi-cekim-noktasi --non-interactive
          elif [ "$PREPARATION_UPDATE" = "true" ]; then
            firebase deploy --only functions:syncBusinessPreparationReminder,functions:sendBusinessPreparationReminders,functions:reservationPreparationAction,functions:getReservationDisputes,functions:resolveReservationDispute,functions:getBusinessDashboard,functions:getMyBusinessReservations --project en-iyi-cekim-noktasi --force --non-interactive
          elif [ "$RESERVATION_INDEX" = "true" ]; then
            node functions/scripts/ensure_reservation_index.js
          elif [ "$RESERVATION_UPDATE" = "true" ]; then
            firebase deploy --only functions:getBusinessDashboard,functions:getMyBusinessReservations,functions:requestBusinessReservation,functions:respondBusinessReservation --project en-iyi-cekim-noktasi --non-interactive
          elif [ "$PUBLICATION_REPAIR" = "true" ]; then
            firebase deploy --only functions:adminReviewBusinessClaim,functions:adminReviewBusinessClaimHttp,functions:publishVerifiedBusinessCandidate,functions:createBusinessCandidate --project en-iyi-cekim-noktasi --force --non-interactive
          else
            firebase deploy --only functions --project en-iyi-cekim-noktasi --force --non-interactive
          fi
      - name: Restore callable invoker access
        if: "!contains(github.event.head_commit.message, '[chat-update]') && !contains(github.event.head_commit.message, '[repair-burak-publication]') && !contains(github.event.head_commit.message, '[reservation-update]') && !contains(github.event.head_commit.message, '[reservation-index]') && !contains(github.event.head_commit.message, '[preparation-update]')"
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          functions=(
            addBusinessCampaign
            addBusinessMenuItem
            addBusinessProgramItem
            adminReviewBusinessClaim
            adminSetBusinessPremium
            createBusinessBoost
            createBusinessCandidate
            createBusinessCollaboration
            createBusinessCoupon
            deleteBusinessContentItem
            followBusiness
            getBusinessReviews
            getBusinessWebTools
            getAdminBusinessClaims
            getAdminInsights
            getBusinessClaim
            getBusinessDashboard
            getBusinessEntitlement
            getBusinessFollowStatus
            getBusinessPublicFeatures
            listPendingSpotSuggestions
            recordBusinessMetric
            removeBusinessStaff
            reportBusinessReview
            requestBusinessReservation
            respondBusinessReview
            respondBusinessReservation
            reviewSpotSuggestion
            setSocialEventCover
            startBusinessPremiumTrial
            submitBusinessClaim
            submitBusinessClaimV2
            submitBusinessBadgeApplication
            submitSpotSuggestion
            addBusinessStaff
            claimBusinessCoupon
            saveBusinessRouteSettings
            sendBusinessFollowerNotification
            updateBusinessContentItem
            updateBusinessProfile
            updateBusinessProfileMedia
            updateBusinessWeeklyHours
            validateBusinessCoupon
          )
          for function_name in "${functions[@]}"; do
            gcloud functions add-invoker-policy-binding "$function_name" \
              --gen2 \
              --region=europe-west1 \
              --project=en-iyi-cekim-noktasi \
              --member=allUsers \
              --quiet
          done

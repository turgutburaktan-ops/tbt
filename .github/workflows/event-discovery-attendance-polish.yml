name: Event Discovery Attendance Polish

on:
  push:
    branches: [feature/video-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-v1
      - name: Patch event discovery and attendance UX
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ----- social_events_screen.dart -----
          p = Path('lib/screens/social_events_screen.dart')
          s = p.read_text()

          if "../services/event_attendance_service.dart" not in s:
              s = s.replace("import '../services/event_privacy_service.dart';", "import '../services/event_attendance_service.dart';\nimport '../services/event_privacy_service.dart';")

          s = s.replace(
              "class SocialEventsScreen extends StatefulWidget {\n  const SocialEventsScreen({super.key});",
              "class SocialEventsScreen extends StatefulWidget {\n  final bool autoOpenCreate;\n  const SocialEventsScreen({super.key, this.autoOpenCreate = false});"
          )

          marker = "class _SocialEventsScreenState extends State<SocialEventsScreen> {\n  SocialEventType? _selectedType;"
          if marker in s and "widget.autoOpenCreate" not in s:
              s = s.replace(marker, marker + "\n\n  @override\n  void initState() {\n    super.initState();\n    if (widget.autoOpenCreate) {\n      WidgetsBinding.instance.addPostFrameCallback((_) {\n        if (mounted) _openCreate();\n      });\n    }\n  }")

          old_toggle_start = "  Future<void> _toggleJoin(SocialEvent event) async {"
          old_toggle_end = "\n\n  Future<void> _openCreate() async {"
          if old_toggle_start in s:
              a = s.index(old_toggle_start)
              b = s.index(old_toggle_end, a)
              new_method = '''  Future<void> _openAttendanceChoices(SocialEvent event) async {
    final uid = FirebaseAuth.instance.currentUser?.uid;
    if (uid == null) {
      _showMessage('Katılmak için giriş yapmalısın.');
      return;
    }
    if (event.hostId == uid) {
      try {
        await SocialEventService.instance.leave(event.id);
        _showMessage('Etkinlik iptal edildi.');
      } catch (e) {
        _showMessage(_friendlyError(e));
      }
      return;
    }

    final choice = await showModalBottomSheet<EventAttendanceChoice>(
      context: context,
      useSafeArea: true,
      backgroundColor: const Color(0xFF101214),
      shape: const RoundedRectangleBorder(
        borderRadius: BorderRadius.vertical(top: Radius.circular(24)),
      ),
      builder: (sheetContext) => Padding(
        padding: const EdgeInsets.fromLTRB(18, 14, 18, 24),
        child: Column(
          mainAxisSize: MainAxisSize.min,
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            const Text('Etkinlik tercihin', style: TextStyle(fontSize: 20, fontWeight: FontWeight.w900)),
            const SizedBox(height: 5),
            const Text('Nasıl katılmak istediğini seç.', style: TextStyle(color: Colors.white54)),
            const SizedBox(height: 14),
            _AttendanceChoiceTile(
              icon: Icons.check_circle_outline_rounded,
              title: 'Katılıyorum',
              subtitle: 'Katılımcı listesinde görünürsün.',
              onTap: () => Navigator.pop(sheetContext, EventAttendanceChoice.attending),
            ),
            _AttendanceChoiceTile(
              icon: Icons.star_border_rounded,
              title: 'İlgileniyorum',
              subtitle: 'Yer ayırmaz; etkinliği takip edersin.',
              onTap: () => Navigator.pop(sheetContext, EventAttendanceChoice.interested),
            ),
            _AttendanceChoiceTile(
              icon: Icons.visibility_off_outlined,
              title: 'Gizli katıl',
              subtitle: 'Yer ayrılır ama diğer kullanıcılara görünmezsin.',
              onTap: () => Navigator.pop(sheetContext, EventAttendanceChoice.hidden),
            ),
            if (event.isAttending(uid) || event.isInterested(uid)) ...[
              const Divider(height: 24),
              ListTile(
                contentPadding: EdgeInsets.zero,
                leading: const Icon(Icons.close_rounded),
                title: const Text('Tercihimi kaldır'),
                onTap: () async {
                  Navigator.pop(sheetContext);
                  try {
                    await EventAttendanceService.instance.clearChoice(event.id);
                    _showMessage('Etkinlik tercihin kaldırıldı.');
                  } catch (e) {
                    _showMessage(_friendlyError(e));
                  }
                },
              ),
            ],
          ],
        ),
      ),
    );
    if (choice == null) return;
    try {
      await EventAttendanceService.instance.setChoice(event.id, choice);
      _showMessage(switch (choice) {
        EventAttendanceChoice.attending => 'Etkinliğe katılıyorsun.',
        EventAttendanceChoice.interested => 'Etkinlikle ilgileniyorsun.',
        EventAttendanceChoice.hidden => 'Etkinliğe gizli katıldın.',
      });
    } catch (e) {
      _showMessage(_friendlyError(e));
    }
  }'''
              s = s[:a] + new_method + s[b:]

          # Make create CTA more discoverable by wording/placement, not neon.
          s = s.replace(
              "FilledButton.icon(onPressed: _openCreate, icon: const Icon(Icons.add, size: 19), label: const Text('Oluştur'))",
              "FilledButton.icon(onPressed: _openCreate, icon: const Icon(Icons.add_rounded, size: 19), label: const Text('Etkinlik Oluştur'))"
          )

          # Empty state
          s = s.replace(
              "if (events.isEmpty) return const Center(child: Text('Yaklaşan etkinlik yok.'));",
              "if (events.isEmpty) return _EventEmptyState(onCreate: _openCreate);"
          )

          # joined state and button
          s = s.replace(
              "final joined = uid != null && event.participantIds.contains(uid);",
              "final joined = uid != null && event.isAttending(uid);\n                final interested = uid != null && event.isInterested(uid);\n                final hidden = uid != null && event.isHidden(uid);"
          )
          s = s.replace(
              "child: Text(isHost ? 'İptal Et' : joined ? 'Ayrıl' : event.isFull ? 'Dolu' : event.isPaid ? 'Bilet Al' : 'Katıl'),",
              "child: Text(isHost ? 'İptal Et' : hidden ? 'Gizli katılıyorsun' : joined ? 'Katılıyorsun' : interested ? 'İlgileniyorsun' : event.isFull ? 'Dolu' : event.isPaid ? 'Bilet / Katılım' : 'Katıl'),"
          )
          s = s.replace(
              "onPressed: event.isFull && !joined && !isHost ? null : () => _toggleJoin(event),",
              "onPressed: event.isFull && !joined && !interested && !isHost ? null : () => _openAttendanceChoices(event),"
          )
          s = s.replace(
              "Text('${event.participantCount}/${event.capacity}', style: const TextStyle(fontWeight: FontWeight.w800)),",
              "Column(crossAxisAlignment: CrossAxisAlignment.end, children: [Text('${event.participantCount}/${event.capacity}', style: const TextStyle(fontWeight: FontWeight.w800)), if (event.interestedCount > 0) Text('${event.interestedCount} ilgili', style: const TextStyle(color: Colors.white54, fontSize: 10))]),"
          )

          # Append helper widgets before _Meta.
          if "class _AttendanceChoiceTile" not in s:
              helper = r'''

class _AttendanceChoiceTile extends StatelessWidget {
  final IconData icon;
  final String title;
  final String subtitle;
  final VoidCallback onTap;
  const _AttendanceChoiceTile({required this.icon, required this.title, required this.subtitle, required this.onTap});
  @override
  Widget build(BuildContext context) => Card(
    margin: const EdgeInsets.only(bottom: 8),
    color: const Color(0xFF171A1D),
    child: ListTile(
      onTap: onTap,
      leading: Icon(icon),
      title: Text(title, style: const TextStyle(fontWeight: FontWeight.w900)),
      subtitle: Text(subtitle),
      trailing: const Icon(Icons.chevron_right_rounded),
    ),
  );
}

class _EventEmptyState extends StatelessWidget {
  final VoidCallback onCreate;
  const _EventEmptyState({required this.onCreate});
  @override
  Widget build(BuildContext context) => Center(
    child: Padding(
      padding: const EdgeInsets.all(24),
      child: Column(
        mainAxisSize: MainAxisSize.min,
        children: [
          const Icon(Icons.celebration_outlined, size: 48, color: Colors.white38),
          const SizedBox(height: 12),
          const Text('Çevrende henüz etkinlik yok', style: TextStyle(fontSize: 18, fontWeight: FontWeight.w900)),
          const SizedBox(height: 7),
          const Text('Fotoğraf yürüyüşü, kahve buluşması, gezi veya kamp etkinliği oluşturabilirsin.', textAlign: TextAlign.center, style: TextStyle(color: Colors.white54, height: 1.4)),
          const SizedBox(height: 16),
          FilledButton.icon(onPressed: onCreate, icon: const Icon(Icons.add_rounded), label: const Text('İlk Etkinliği Oluştur')),
        ],
      ),
    ),
  );
}
'''
              s = s.replace("\nclass _Meta extends StatelessWidget {", helper + "\nclass _Meta extends StatelessWidget {")

          p.write_text(s)

          # ----- feed_screen.dart -----
          p = Path('lib/screens/feed_screen.dart')
          s = p.read_text()

          # Event discovery prompt right below stories on For You, even when there are no events.
          target = "final feedItems = <Widget>[\n                        StoryStrip(visibleUserIds: visibleStoryUsers),\n                      ];"
          replacement = "final feedItems = <Widget>[\n                        StoryStrip(visibleUserIds: visibleStoryUsers),\n                      ];\n                      if (mode == FeedMode.forYou && includeEvents) {\n                        feedItems.add(_EventDiscoveryPrompt(eventCount: events.length));\n                      }"
          if target in s:
              s = s.replace(target, replacement)

          if "class _EventDiscoveryPrompt" not in s:
              helper = r'''

class _EventDiscoveryPrompt extends StatelessWidget {
  final int eventCount;
  const _EventDiscoveryPrompt({required this.eventCount});

  @override
  Widget build(BuildContext context) {
    return Container(
      margin: const EdgeInsets.fromLTRB(10, 4, 10, 12),
      padding: const EdgeInsets.all(14),
      decoration: BoxDecoration(
        color: const Color(0xFF121416),
        borderRadius: BorderRadius.circular(18),
        border: Border.all(color: const Color(0xFF2A2E33)),
      ),
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          Row(
            children: [
              const Icon(Icons.celebration_outlined, size: 22),
              const SizedBox(width: 8),
              Expanded(
                child: Text(
                  eventCount > 0 ? '$eventCount yaklaşan etkinlik var' : 'Birlikte bir şey yap',
                  style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w900),
                ),
              ),
            ],
          ),
          const SizedBox(height: 6),
          Text(
            eventCount > 0
                ? 'Yakındaki buluşmaları keşfet veya kendi etkinliğini oluştur.'
                : 'Fotoğraf yürüyüşü, kahve buluşması, gezi veya kamp etkinliği başlatabilirsin.',
            style: const TextStyle(color: Colors.white54, height: 1.35),
          ),
          const SizedBox(height: 12),
          Row(
            children: [
              Expanded(
                child: OutlinedButton.icon(
                  onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const SocialEventsScreen())),
                  icon: const Icon(Icons.explore_outlined, size: 18),
                  label: const Text('Etkinlikleri Gör'),
                ),
              ),
              const SizedBox(width: 8),
              Expanded(
                child: FilledButton.icon(
                  onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const SocialEventsScreen(autoOpenCreate: true))),
                  icon: const Icon(Icons.add_rounded, size: 18),
                  label: const Text('Etkinlik Oluştur'),
                ),
              ),
            ],
          ),
        ],
      ),
    );
  }
}
'''
              s = s.replace("\nclass _TonightStrip extends StatelessWidget {", helper + "\nclass _TonightStrip extends StatelessWidget {")

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/social_events_screen.dart lib/screens/feed_screen.dart
          git commit -m "feat(events): surface discovery and attendance choices" || exit 0
          git push origin feature/video-v1

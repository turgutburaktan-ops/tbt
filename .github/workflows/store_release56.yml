name: Publish TBT 1.0.28 (56) to both stores
on:
  push:
    branches: [codex/store-release56-20260916]
permissions:
  contents: read
concurrency:
  group: tbt-store-release56
  cancel-in-progress: false
jobs:
  android:
    uses: ./.github/workflows/android_play_release.yml
    secrets: inherit
  ios:
    uses: ./.github/workflows/ios_testflight_release.yml
    secrets: inherit
  submit-ios:
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit iOS 1.0.28 (56) to App Review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: node tool/submit_ios_build56.cjs

name: Event Attendance UI Refactor (manual check)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-v1
      - name: Verify current event attendance UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('lib/screens/social_events_screen.dart').read_text()
          service = Path('lib/services/social_event_service.dart').read_text()

          required_screen = [
              "Future<void> _openCreate() async",
              "Etkinlik Oluştur",
              "Future<void> _showAttendanceChoices(SocialEvent event) async",
              "EventAttendanceChoice.attending",
              "EventAttendanceChoice.interested",
              "EventAttendanceChoice.hidden",
          ]
          required_service = [
              "participantIds",
          ]

          missing = [item for item in required_screen if item not in screen]
          missing += [item for item in required_service if item not in service]
          if missing:
              raise SystemExit('Current event attendance UI is missing: ' + ', '.join(missing))

          print('Current event attendance UI and create flow are present. No legacy refactor is required.')
          PY

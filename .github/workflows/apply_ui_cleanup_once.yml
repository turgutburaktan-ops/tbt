name: Apply UI Cleanup Once

on:
  push:
    branches: [feature/video-v1]
    paths:
      - .github/workflows/apply_ui_cleanup_once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-v1

      - name: Apply navigation, event and map cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing target: {label}')
              return text.replace(old, new, 1)

          # 1) Reels belongs to Home; Radar + Events become one Nearby section.
          p = Path('lib/screens/home_shell_screen.dart')
          s = p.read_text()
          if "import 'reels_screen.dart';\n" not in s:
              s = replace_once(
                  s,
                  "import 'radar_screen.dart';\n",
                  "import 'radar_screen.dart';\nimport 'reels_screen.dart';\n",
                  'reels import',
              )

          old = """    final labels = campusEligible
        ? const ['Radar', 'Etkinlikler', 'Kampüs']
        : const ['Radar', 'Etkinlikler'];
    final effectiveSection = _section >= labels.length ? 0 : _section;
    final pages = <Widget>[
      const RadarScreen(embedded: true),
      const EventsHubScreen(),
      if (campusEligible) const CampusHomeScreen(),
    ];
"""
          new = """    final labels = campusEligible
        ? const ['Çevrende', 'Kampüs']
        : const ['Çevrende'];
    final effectiveSection = _section >= labels.length ? 0 : _section;
    final pages = <Widget>[
      const EventsHubScreen(),
      if (campusEligible) const CampusHomeScreen(),
    ];
"""
          s = replace_once(s, old, new, 'nearby sections')
          s = s.replace(
              "'Radar, etkinlikler ve öğrencilere özel kampüs.'",
              "'Yakınındaki etkinlikleri tek akışta keşfet.'",
              1,
          )

          old = """            Padding(
              padding: const EdgeInsets.fromLTRB(14, 2, 14, 8),
              child: _CompactTabs(
                firstLabel: 'Sana Özel',
                secondLabel: 'Takip',
                selected: _section,
                onChanged: (value) => setState(() => _section = value),
              ),
            ),
            Expanded(
              child: IndexedStack(
                index: _section,
                children: const [
                  _AuthAwareFeed(mode: FeedMode.forYou),
                  _AuthAwareFeed(mode: FeedMode.following),
                ],
              ),
            ),
"""
          new = """            Padding(
              padding: const EdgeInsets.fromLTRB(14, 2, 14, 8),
              child: _CompactTabs(
                firstLabel: 'Sana Özel',
                secondLabel: 'Takip',
                thirdLabel: 'Reels',
                selected: _section,
                onChanged: (value) => setState(() => _section = value),
              ),
            ),
            Expanded(
              child: IndexedStack(
                index: _section,
                children: const [
                  _AuthAwareFeed(mode: FeedMode.forYou),
                  _AuthAwareFeed(mode: FeedMode.following),
                  ReelsScreen(),
                ],
              ),
            ),
"""
          s = replace_once(s, old, new, 'home reels tab')

          old = """class _CompactTabs extends StatelessWidget {
  final String firstLabel;
  final String secondLabel;
  final int selected;
  final ValueChanged<int> onChanged;

  const _CompactTabs({
    required this.firstLabel,
    required this.secondLabel,
    required this.selected,
    required this.onChanged,
  });

  @override
  Widget build(BuildContext context) => Container(
        padding: const EdgeInsets.all(3),
        decoration: BoxDecoration(
          color: AppColors.surface,
          borderRadius: BorderRadius.circular(13),
          border: Border.all(color: AppColors.border),
        ),
        child: Row(
          children: [
            Expanded(
              child: _FeedTab(
                label: firstLabel,
                selected: selected == 0,
                onTap: () => onChanged(0),
              ),
            ),
            Expanded(
              child: _FeedTab(
                label: secondLabel,
                selected: selected == 1,
                onTap: () => onChanged(1),
              ),
            ),
          ],
        ),
      );
}
"""
          new = """class _CompactTabs extends StatelessWidget {
  final String firstLabel;
  final String secondLabel;
  final String? thirdLabel;
  final int selected;
  final ValueChanged<int> onChanged;

  const _CompactTabs({
    required this.firstLabel,
    required this.secondLabel,
    this.thirdLabel,
    required this.selected,
    required this.onChanged,
  });

  @override
  Widget build(BuildContext context) => Container(
        padding: const EdgeInsets.all(3),
        decoration: BoxDecoration(
          color: AppColors.surface,
          borderRadius: BorderRadius.circular(13),
          border: Border.all(color: AppColors.border),
        ),
        child: Row(
          children: [
            Expanded(
              child: _FeedTab(
                label: firstLabel,
                selected: selected == 0,
                onTap: () => onChanged(0),
              ),
            ),
            Expanded(
              child: _FeedTab(
                label: secondLabel,
                selected: selected == 1,
                onTap: () => onChanged(1),
              ),
            ),
            if (thirdLabel != null)
              Expanded(
                child: _FeedTab(
                  label: thirdLabel!,
                  selected: selected == 2,
                  onTap: () => onChanged(2),
                ),
              ),
          ],
        ),
      );
}
"""
          s = replace_once(s, old, new, 'compact tabs')
          p.write_text(s)

          # 2) Simplify events hub: no Reels and no misplaced photo camera button.
          p = Path('lib/screens/events_hub_screen.dart')
          p.write_text("""import 'package:flutter/material.dart';

import '../theme/app_theme.dart';
import 'past_events_screen.dart';
import 'social_events_screen.dart';

class EventsHubScreen extends StatefulWidget {
  const EventsHubScreen({super.key});

  @override
  State<EventsHubScreen> createState() => _EventsHubScreenState();
}

class _EventsHubScreenState extends State<EventsHubScreen> {
  int _tab = 0;

  @override
  Widget build(BuildContext context) {
    return ColoredBox(
      color: AppColors.background,
      child: Column(
        children: [
          Padding(
            padding: const EdgeInsets.fromLTRB(14, 4, 14, 6),
            child: Container(
              padding: const EdgeInsets.all(3),
              decoration: BoxDecoration(
                color: AppColors.surface,
                borderRadius: BorderRadius.circular(13),
                border: Border.all(color: AppColors.border),
              ),
              child: Row(
                children: [
                  Expanded(
                    child: _EventTab(
                      icon: Icons.near_me_outlined,
                      label: 'Keşfet',
                      selected: _tab == 0,
                      onTap: () => setState(() => _tab = 0),
                    ),
                  ),
                  Expanded(
                    child: _EventTab(
                      icon: Icons.photo_album_outlined,
                      label: 'Anılarım',
                      selected: _tab == 1,
                      onTap: () => setState(() => _tab = 1),
                    ),
                  ),
                ],
              ),
            ),
          ),
          Expanded(
            child: IndexedStack(
              index: _tab,
              children: const [
                SocialEventsScreen(),
                PastEventsScreen(embedded: true),
              ],
            ),
          ),
        ],
      ),
    );
  }
}

class _EventTab extends StatelessWidget {
  final IconData icon;
  final String label;
  final bool selected;
  final VoidCallback onTap;

  const _EventTab({required this.icon, required this.label, required this.selected, required this.onTap});

  @override
  Widget build(BuildContext context) => Material(
        color: selected ? AppColors.surfaceStrong : Colors.transparent,
        borderRadius: BorderRadius.circular(10),
        child: InkWell(
          onTap: onTap,
          borderRadius: BorderRadius.circular(10),
          child: Padding(
            padding: const EdgeInsets.symmetric(vertical: 9, horizontal: 7),
            child: Row(
              mainAxisAlignment: MainAxisAlignment.center,
              children: [
                Icon(icon, size: 16, color: selected ? AppColors.cyan : Colors.white54),
                const SizedBox(width: 5),
                Text(label, style: TextStyle(color: selected ? Colors.white : Colors.white54, fontSize: 11.5, fontWeight: selected ? FontWeight.w900 : FontWeight.w700)),
              ],
            ),
          ),
        ),
      );
}
""")

          # 3) Add optional event cover photo to the existing full-featured event creator.
          p = Path('lib/screens/social_events_screen.dart')
          s = p.read_text()
          if "import 'dart:io';\n" not in s:
              s = "import 'dart:io';\n\n" + s
          if "package:firebase_storage/firebase_storage.dart" not in s:
              s = replace_once(s, "import 'package:firebase_auth/firebase_auth.dart';\n", "import 'package:firebase_auth/firebase_auth.dart';\nimport 'package:firebase_storage/firebase_storage.dart';\n", 'storage import')
          if "package:image_picker/image_picker.dart" not in s:
              s = replace_once(s, "import 'package:flutter/services.dart';\n", "import 'package:flutter/services.dart';\nimport 'package:image_picker/image_picker.dart';\n", 'image picker import')

          s = replace_once(
              s,
              "    String? formError;\n",
              "    String? formError;\n    final imagePicker = ImagePicker();\n    File? coverImage;\n",
              'cover state',
          )

          s = replace_once(
              s,
              "          Future<void> chooseLocation() async {\n",
              "          Future<void> chooseImage() async {\n            final source = await showModalBottomSheet<ImageSource>(\n              context: context,\n              backgroundColor: const Color(0xFF121416),\n              builder: (context) => SafeArea(\n                child: Column(\n                  mainAxisSize: MainAxisSize.min,\n                  children: [\n                    ListTile(leading: const Icon(Icons.camera_alt_outlined), title: const Text('Fotoğraf çek'), onTap: () => Navigator.pop(context, ImageSource.camera)),\n                    ListTile(leading: const Icon(Icons.photo_library_outlined), title: const Text('Galeriden seç'), onTap: () => Navigator.pop(context, ImageSource.gallery)),\n                  ],\n                ),\n              ),\n            );\n            if (source == null) return;\n            final picked = await imagePicker.pickImage(source: source, imageQuality: 88, maxWidth: 1800);\n            if (picked == null || !context.mounted) return;\n            setSheetState(() {\n              coverImage = File(picked.path);\n              formError = null;\n            });\n          }\n\n          Future<void> chooseLocation() async {\n",
              'choose image',
          )

          s = replace_once(
              s,
              "                  const SizedBox(height: 16),\n                  TextField(controller: titleController,",
              "                  const SizedBox(height: 16),\n                  GestureDetector(\n                    onTap: saving ? null : chooseImage,\n                    child: Container(\n                      width: double.infinity,\n                      height: 160,\n                      clipBehavior: Clip.antiAlias,\n                      decoration: BoxDecoration(\n                        color: const Color(0xFF121416),\n                        borderRadius: BorderRadius.circular(18),\n                        border: Border.all(color: Colors.white12),\n                      ),\n                      child: coverImage == null\n                          ? const Column(\n                              mainAxisAlignment: MainAxisAlignment.center,\n                              children: [\n                                Icon(Icons.add_photo_alternate_outlined, size: 38, color: Colors.white60),\n                                SizedBox(height: 8),\n                                Text('Etkinlik kapak fotoğrafı ekle', style: TextStyle(fontWeight: FontWeight.w900)),\n                                SizedBox(height: 3),\n                                Text('Kameradan çek veya galeriden seç', style: TextStyle(color: Colors.white54, fontSize: 12)),\n                              ],\n                            )\n                          : Stack(\n                              fit: StackFit.expand,\n                              children: [\n                                Image.file(coverImage!, fit: BoxFit.cover),\n                                Positioned(\n                                  right: 8,\n                                  bottom: 8,\n                                  child: FilledButton.tonalIcon(onPressed: saving ? null : chooseImage, icon: const Icon(Icons.edit_outlined), label: const Text('Değiştir')),\n                                ),\n                              ],\n                            ),\n                    ),\n                  ),\n                  const SizedBox(height: 12),\n                  TextField(controller: titleController,",
              'cover UI',
          )

          old = """                                await SocialEventService.instance.create(
                                  title: titleController.text,
                                  type: type,
                                  startsAt: startsAt,
                                  capacity: typedCapacity,
                                  city: cityController.text,
                                  locationLabel: locationController.text,
                                  description: descriptionController.text,
                                  customTypeLabel: customTypeController.text,
                                  accessType: accessType,
                                  ticketPriceMinor: (price * 100).round(),
                                  latitude: selectedLocation!.latitude,
                                  longitude: selectedLocation!.longitude,
                                  visibility: visibility,
                                  allowedUserIds: allowed,
                                );
"""
          new = """                                final eventId = await SocialEventService.instance.create(
                                  title: titleController.text,
                                  type: type,
                                  startsAt: startsAt,
                                  capacity: typedCapacity,
                                  city: cityController.text,
                                  locationLabel: locationController.text,
                                  description: descriptionController.text,
                                  customTypeLabel: customTypeController.text,
                                  accessType: accessType,
                                  ticketPriceMinor: (price * 100).round(),
                                  latitude: selectedLocation!.latitude,
                                  longitude: selectedLocation!.longitude,
                                  visibility: visibility,
                                  allowedUserIds: allowed,
                                );
                                if (coverImage != null) {
                                  final user = FirebaseAuth.instance.currentUser!;
                                  final ref = FirebaseStorage.instance.ref().child('users/${user.uid}/events/$eventId/cover.jpg');
                                  await ref.putFile(coverImage!, SettableMetadata(contentType: 'image/jpeg'));
                                  final url = await ref.getDownloadURL();
                                  await FirebaseFirestore.instance.collection(SocialEventService.collection).doc(eventId).set({
                                    'coverImageUrl': url,
                                    'coverImageUpdatedAt': FieldValue.serverTimestamp(),
                                  }, SetOptions(merge: true));
                                }
"""
          s = replace_once(s, old, new, 'event cover upload')
          p.write_text(s)

          # 4) Build APKs with the real Google Maps key instead of the dummy CI key.
          p = Path('.github/workflows/tbt_full_build.yml')
          s = p.read_text()
          old = """          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest.write_text(manifest.read_text().replace('${MAPS_API_KEY}', 'CI_DUMMY_MAPS_KEY'))
"""
          new = """          manifest = Path('android/app/src/main/AndroidManifest.xml')
          import os
          maps_key = os.environ.get('MAPS_API_KEY', '').strip()
          if not maps_key:
              raise SystemExit('MAPS_API_KEY GitHub secret is missing; refusing to build an APK with broken maps.')
          manifest.write_text(manifest.read_text().replace('${MAPS_API_KEY}', maps_key))
"""
          s = replace_once(s, old, new, 'maps key injection')
          s = s.replace(
              "      - name: 3 · Prepare Android host\n        shell: bash\n",
              "      - name: 3 · Prepare Android host\n        shell: bash\n        env:\n          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}\n",
              1,
          )
          p.write_text(s)
          PY

      - name: Format changed Dart files
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dart format and analyze touched files
        run: |
          dart format lib/screens/home_shell_screen.dart lib/screens/events_hub_screen.dart lib/screens/social_events_screen.dart
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos lib/screens/home_shell_screen.dart lib/screens/events_hub_screen.dart lib/screens/social_events_screen.dart

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_shell_screen.dart lib/screens/events_hub_screen.dart lib/screens/social_events_screen.dart .github/workflows/tbt_full_build.yml
          git commit -m "Unify nearby events, move Reels home, restore event cover photos and real maps key" || exit 0
          git push origin feature/video-v1

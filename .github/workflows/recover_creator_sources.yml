name: Recover Creator deployment sources
on:
  push:
    branches: [codex/recover-creator-sources]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read previous Creator sources
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,urllib.request,urllib.parse
          from pathlib import Path
          key=Path(os.environ['RUNNER_TEMP'])/'recovery-account.json'
          key.write_text(os.environ['FIREBASE_SERVICE_ACCOUNT']);key.chmod(0o600)
          subprocess.run(['gcloud','auth','activate-service-account','--key-file='+str(key),'--quiet'],check=True,stdout=subprocess.DEVNULL)
          token=subprocess.check_output(['gcloud','auth','print-access-token'],text=True).strip()
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+token}))
          buckets=json.load(get('https://storage.googleapis.com/storage/v1/b?project=en-iyi-cekim-noktasi')).get('items',[])
          out=Path('creator-recovery');out.mkdir()
          found=[]
          for bucket in buckets:
              name=bucket['name']
              if not name.startswith('gcf-'):continue
              page=''
              while True:
                  data=json.load(get('https://storage.googleapis.com/storage/v1/b/'+name+'/o?'+urllib.parse.urlencode({'pageToken':page})))
                  for obj in data.get('items',[]):
                      objname=obj['name']
                      if 'creator' not in objname.lower():continue
                      print(name,objname,obj.get('updated'),obj.get('size'))
                      if objname.endswith('.zip'):
                          filename=str(len(found))+'.zip'
                          url='https://storage.googleapis.com/storage/v1/b/'+name+'/o/'+urllib.parse.quote(objname,safe='')+'?alt=media&generation='+obj['generation']
                          with get(url) as source,open(out/filename,'wb') as dest:
                              import shutil
                              shutil.copyfileobj(source,dest)
                          found.append({'bucket':name,'object':objname,'updated':obj.get('updated'),'generation':obj['generation'],'file':filename})
                  page=data.get('nextPageToken')
                  if not page:break
          (out/'manifest.json').write_text(json.dumps(found,indent=2))
          if not found:raise SystemExit('No Creator source archives found')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: creator-previous-sources
          path: creator-recovery
          retention-days: 7

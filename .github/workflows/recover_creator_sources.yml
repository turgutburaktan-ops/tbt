name: Recover Creator deployment sources
on:
  push:
    branches: [codex/recover-creator-sources]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read previous Creator sources
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,urllib.request,urllib.parse
          from pathlib import Path
          key=Path(os.environ['RUNNER_TEMP'])/'recovery-account.json'
          key.write_text(os.environ['FIREBASE_SERVICE_ACCOUNT']);key.chmod(0o600)
          subprocess.run(['gcloud','auth','activate-service-account','--key-file='+str(key),'--quiet'],check=True,stdout=subprocess.DEVNULL)
          token=subprocess.check_output(['gcloud','auth','print-access-token'],text=True).strip()
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+token}))
          out=Path('creator-recovery');out.mkdir()
          builds=[]
          for region in ['europe-west1','global']:
              page=''
              for _ in range(15):
                  url='https://cloudbuild.googleapis.com/v1/projects/en-iyi-cekim-noktasi/locations/'+region+'/builds?'+urllib.parse.urlencode({'pageSize':100,'pageToken':page})
                  data=json.load(get(url))
                  batch=data.get('builds',[])
                  builds.extend(batch)
                  page=data.get('nextPageToken')
                  if not page or any('creator' in json.dumps(b).lower() for b in batch):break
              print('Build records inspected',region,len(builds))
          print('Creator build matches',sum('creator' in json.dumps(b).lower() for b in builds))
          print(json.dumps([{'id':b.get('id'),'status':b.get('status'),'source':b.get('source'),'sourceProvenance':b.get('sourceProvenance'),'target':b.get('substitutions',{}).get('_FUNCTION_TARGET'),'keys':list(b.keys())} for b in builds[:5]],indent=2))
          found=[]
          seen=set()
          for build in builds:
              if 'creator' not in json.dumps(build).lower() or build.get('status')!='SUCCESS':continue
              source=build.get('source',{}).get('storageSource',{}) or build.get('sourceProvenance',{}).get('resolvedStorageSource',{})
              if not source:continue
              identity=(source['bucket'],source['object'])
              if identity in seen:continue
              seen.add(identity)
              print('Recovery source',build['id'],build.get('createTime'),source['bucket'],source['object'])
              filename=str(len(found))+'.zip'
              url='https://storage.googleapis.com/storage/v1/b/'+source['bucket']+'/o/'+urllib.parse.quote(source['object'],safe='')+'?alt=media'
              if source.get('generation'):url+='&generation='+source['generation']
              with get(url) as src,open(out/filename,'wb') as dest:
                  import shutil
                  shutil.copyfileobj(src,dest)
              found.append({'build':build['id'],'time':build.get('createTime'),'source':source,'file':filename})
          (out/'manifest.json').write_text(json.dumps(found,indent=2))
          if not found:raise SystemExit('No Creator build sources found')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: creator-previous-sources
          path: creator-recovery
          retention-days: 7

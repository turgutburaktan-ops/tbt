name: Verify restored Creator functions
on:
  push:
    branches: [codex/recover-creator-sources]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public callable routes without changing data
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          base='https://europe-west1-en-iyi-cekim-noktasi.cloudfunctions.net/'
          for name in ['createCreatorInvite','getCreatorInvitePreview','redeemCreatorInvite']:
              req=urllib.request.Request(base+name,data=json.dumps({'data':{'code':'INVALID'}}).encode(),headers={'Content-Type':'application/json'})
              try:
                  response=urllib.request.urlopen(req,timeout=60)
                  status=response.status
                  body=json.load(response)
              except urllib.error.HTTPError as e:
                  status=e.code
                  body=json.loads(e.read())
              if name=='getCreatorInvitePreview':
                  assert status==200 and body.get('result',{}).get('reason')=='invalid',(name,status,body)
              else:
                  assert status==401 and body.get('error',{}).get('status')=='UNAUTHENTICATED',(name,status,body)
              print(name,'PASS',status)
          PY

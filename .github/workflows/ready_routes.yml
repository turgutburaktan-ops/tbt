name: Verify and publish ready routes
on:
  push:
    branches: [codex/ready-routes-20260922]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/travel_plan_service.dart lib/models/travel_plan.dart lib/screens/routes_hub_screen.dart lib/widgets/use_ready_route_button.dart
      - run: flutter test test/profile_interaction_fixes_test.dart test/profile_content_navigation_test.dart
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          npm install --prefix functions
          npm install --prefix /tmp/access-tests @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.12.0 firebase-admin@13.0.0
      - name: Backend regression tests
        run: node --test functions/test/*.test.js
      - name: Verify route and community access
        env:
          NODE_PATH: /tmp/access-tests/node_modules
        run: /tmp/access-tests/node_modules/.bin/firebase emulators:exec --project demo-tbt-access --only firestore "node --test test/route_access_rules.cjs && node --test test/route_community_backend.cjs"
      - name: Authenticate deployment
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          account=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          assert account['project_id']=='en-iyi-cekim-noktasi'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'firebase-release-credentials.json'
          target.write_text(json.dumps(account));target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'GOOGLE_APPLICATION_CREDENTIALS={target}\n')
          PY
      - name: Deploy verified route access rules
        run: >-
          /tmp/access-tests/node_modules/.bin/firebase deploy --project en-iyi-cekim-noktasi --non-interactive
          --only firestore:rules

      - name: Repair editorial routes in personal plans
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node functions/scripts/repair_ready_route_membership.cjs
      - name: Publish routes with verified stops and geometry
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUBLISH_READY_ROUTES: 'true'
        run: node functions/scripts/seed_ready_routes.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ready-route-report
          path: ready-route-report.json

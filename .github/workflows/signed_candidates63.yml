name: Signed release candidates 1.0.35 (63)
# Artifact preparation only. Store submission remains subject to security_release_gate.cjs.
on:
  workflow_dispatch:
  push:
    branches: [codex/release-readiness-20260929]
    paths:
      - '.github/workflows/signed_candidates63.yml'
      - 'tool/verify_ios_branding63.py'
permissions:
  contents: read
concurrency:
  group: signed-candidates63
  cancel-in-progress: false
jobs:
  appbundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Play release secrets
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_NATIVE_ANDROID: ${{ secrets.ADMOB_NATIVE_ANDROID }}
        run: |
          set -euo pipefail
          for name in PLAY_KEYSTORE_BASE64 PLAY_KEYSTORE_PASSWORD PLAY_KEY_ALIAS PLAY_KEY_PASSWORD MAPS_API_KEY ADMOB_ANDROID_APP_ID ADMOB_NATIVE_ANDROID; do
            test -n "${!name:-}" || { echo "$name secret is missing"; exit 1; }
          done
          case "$ADMOB_ANDROID_APP_ID" in ca-app-pub-*~*) ;; *) exit 1 ;; esac
          case "$ADMOB_NATIVE_ANDROID" in ca-app-pub-*/*) ;; *) exit 1 ;; esac
      - name: Prepare signed Android host
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          cp android/app/src/main/AndroidManifest.xml /tmp/tbt-manifest.xml
          rm -rf android
          flutter create --platforms=android --org com.tbt --project-name best_photo_spot .
          # `flutter create` adds the stock counter-app test when this repository
          # has no test directory. It references a non-existent MyApp class and
          # must not participate in release analysis.
          rm -f test/widget_test.dart
          cp /tmp/tbt-manifest.xml android/app/src/main/AndroidManifest.xml
          echo '7d90b462ca3510c8fd1aec7bc4d650353e0755a75220ee9d6ee34ed03373349b  assets/spot_thumbnails/tbt_app_icon_1024.png' | sha256sum --check
          printf '%s\n' 'flutter_launcher_icons:' '  android: true' '  ios: false' '  image_path: assets/spot_thumbnails/tbt_app_icon_1024.png' '  min_sdk_android: 26' > /tmp/tbt-android-icons.yaml
          dart run flutter_launcher_icons -f /tmp/tbt-android-icons.yaml
          printf '%s' "$PLAY_KEYSTORE_BASE64" | base64 --decode > android/app/tbt-upload.p12
          keytool -importkeystore -noprompt \
            -srckeystore android/app/tbt-upload.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass "$PLAY_KEYSTORE_PASSWORD" \
            -srcalias "$PLAY_KEY_ALIAS" \
            -srckeypass "$PLAY_KEY_PASSWORD" \
            -destkeystore android/app/tbt-release.jks \
            -deststoretype JKS \
            -deststorepass "$PLAY_KEYSTORE_PASSWORD" \
            -destalias "$PLAY_KEY_ALIAS" \
            -destkeypass "$PLAY_KEY_PASSWORD"
          keytool -list -v \
            -keystore android/app/tbt-release.jks \
            -storepass "$PLAY_KEYSTORE_PASSWORD" \
            -alias "$PLAY_KEY_ALIAS" | tee /tmp/tbt-release-key.txt
          tr '[:lower:]' '[:upper:]' < /tmp/tbt-release-key.txt | tr -d ':' > /tmp/tbt-release-key-normalized.txt
          # GitHub signs the bundle with the Play upload certificate. Google Play
          # re-signs distributed APKs with the app-signing certificate registered
          # in Firebase, so validate the upload key here (not the runtime key).
          grep -Eq '73557719D69700739FCA874F7D5EC84AB6C760E4' /tmp/tbt-release-key-normalized.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 26').replace('com.tbt.best_photo_spot','com.tbt.social')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("release") {\n            storeFile = file("tbt-release.jks")\n            storeType = "JKS"\n            storePassword = System.getenv("PLAY_KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("PLAY_KEY_ALIAS")\n            keyPassword = System.getenv("PLAY_KEY_PASSWORD")\n        }\n    }\n\n'''
          s=s.replace(marker, signing+marker, 1)
          s=s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              '''signingConfig = signingConfigs.getByName("release")
            // AGP 9/R8 can remove Room's generated no-argument constructor.
            // That makes WorkManager crash before Flutter draws its first frame.
            isMinifyEnabled = false
            isShrinkResources = false''',
          )
          p.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml')
          text=m.read_text().replace('${MAPS_API_KEY}',os.environ['MAPS_API_KEY']).replace('ca-app-pub-3940256099942544~3347511713',os.environ['ADMOB_ANDROID_APP_ID'])
          m.write_text(text)
          for activity in Path('android/app/src/main/kotlin').rglob('MainActivity.kt'):
            a=activity.read_text().replace('package com.tbt.best_photo_spot','package com.tbt.social').replace('import io.flutter.embedding.android.FlutterActivity','import io.flutter.embedding.android.FlutterFragmentActivity').replace('FlutterActivity()','FlutterFragmentActivity()')
            activity.write_text(a)
          PY
      - name: Align share plugin JVM targets
        run: python3 tool/patch_receive_sharing_intent.py
      - name: Configure notification replies
        run: |
          python3 tool/configure_notifications.py android
          python3 tool/configure_android_crashlytics.py
          python3 tool/configure_route_album.py android
          python3 tool/configure_reels_ads.py android
      - name: Build Play app bundle
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          ADMOB_NATIVE_ANDROID: ${{ secrets.ADMOB_NATIVE_ANDROID }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/password_policy_test.dart test/app_update_policy_test.dart test/profile_interaction_fixes_test.dart test/ready_route_city_test.dart test/route_selection_modes_test.dart test/business_campaign_editor_test.dart test/chat_layout_test.dart test/chat_appearance_test.dart test/profile_identity_test.dart test/profile_content_navigation_test.dart test/restored_flows_test.dart test/categorized_search_test.dart test/route_itinerary_test.dart test/route_create_test.dart test/camera_share_controls_test.dart test/place_catalog_test.dart test/nearby_venue_loading_test.dart test/places_hub_test.dart test/route_map_candidates_test.dart test/route_access_test.dart test/route_community_test.dart test/route_terrain_test.dart test/ad_consent_service_test.dart test/reels_ad_pager_test.dart test/ready_route_event_test.dart test/saved_route_edit_test.dart test/private_photo_test.dart test/chat_access_test.dart
          flutter build appbundle --release --no-pub \
            --build-name=1.0.35 \
            --build-number=63 \
            --dart-define=ADMOB_NATIVE_ANDROID="$ADMOB_NATIVE_ANDROID"
      - name: Verify Play bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB"
          python3 tool/verify_android_branding.py
          {
            echo 'applicationId=com.tbt.social'
            echo 'versionName=1.0.35'
            echo 'versionCode=63'
            sha256sum "$AAB"
          } > build/app/outputs/bundle/release/release-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tbt-play-release-1.0.35-code63
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/release-info.txt
          if-no-files-found: error
          retention-days: 14


  ios-candidate:
    name: Build signed iOS candidate
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.tbt.social
      DEVELOPMENT_TEAM: 58UGDRSLU3
      PROFILE_NAME: TBT App Store 2026

    steps:
      - name: Verify Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          case "$SDK_VERSION" in
            26.*) ;;
            *) echo "Expected iOS 26 SDK, found $SDK_VERSION"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify chat and route regressions
        run: flutter test test/password_policy_test.dart test/app_update_policy_test.dart test/profile_interaction_fixes_test.dart test/ready_route_city_test.dart test/route_selection_modes_test.dart test/route_access_test.dart test/route_community_test.dart test/route_terrain_test.dart test/business_campaign_editor_test.dart test/chat_layout_test.dart test/chat_appearance_test.dart test/route_itinerary_test.dart test/profile_identity_test.dart test/profile_content_navigation_test.dart test/restored_flows_test.dart test/categorized_search_test.dart test/place_catalog_test.dart test/nearby_venue_loading_test.dart test/places_hub_test.dart test/route_map_candidates_test.dart test/ad_consent_service_test.dart test/reels_ad_pager_test.dart test/ready_route_event_test.dart test/saved_route_edit_test.dart test/private_photo_test.dart test/chat_access_test.dart

      - name: Generate clean iOS host
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          flutter create --platforms=ios --org com.tbt --project-name best_photo_spot .
          echo '7d90b462ca3510c8fd1aec7bc4d650353e0755a75220ee9d6ee34ed03373349b  assets/spot_thumbnails/tbt_app_icon_1024.png' | shasum -a 256 --check
          dart run flutter_launcher_icons
          ICON_PATH='ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png'
          test -s "$ICON_PATH"
          test "$(sips -g pixelWidth "$ICON_PATH" | awk '/pixelWidth/{print $2}')" = '1024'
          test "$(sips -g pixelHeight "$ICON_PATH" | awk '/pixelHeight/{print $2}')" = '1024'

      - name: Configure iOS application
        shell: bash
        env:
          FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ADMOB_IOS_APP_ID: ca-app-pub-3462343788063276~3452529921
        run: |
          set -euo pipefail
          test -n "$FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64"
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          info_path = Path('ios/Runner/Info.plist')
          with info_path.open('rb') as f:
              info = plistlib.load(f)

          info['NSCameraUsageDescription'] = 'TBT, gönderi ve hikayelerinde paylaşacağın fotoğraf ve videoları çekmek için kameranı kullanır. Örneğin gezdiğin bir mekanın videosunu çekip TBT profilinde paylaşabilirsin.'
          info['NSMicrophoneUsageDescription'] = 'TBT, çektiğin videolara ses eklemek ve sohbetlerde sesli mesaj kaydetmek için mikrofonunu kullanır. Örneğin bir mekan videosunu anlatımlı kaydedebilirsin.'
          info['NSLocationWhenInUseUsageDescription'] = 'Yakındaki mekanları, etkinlikleri ve rota mesafelerini göstermek için konum kullanılır.'
          info['NSLocationAlwaysAndWhenInUseUsageDescription'] = 'Rota ve çevrendeki içerikleri doğru şekilde göstermek için konum erişimi gerekir.'
          info['NSLocationAlwaysUsageDescription'] = 'Rota ve çevrendeki içerikleri doğru şekilde göstermek için konum erişimi gerekir.'
          info['NSPhotoLibraryUsageDescription'] = 'Story ve paylaşım için galerinden fotoğraf veya video seçebilmek için erişim gerekir.'
          info['NSPhotoLibraryAddUsageDescription'] = 'Düzenlediğin içerikleri fotoğraf arşivine kaydedebilmek için izin gerekir.'
          info['NSUserTrackingUsageDescription'] = 'İzninle, sana daha alakalı reklamlar göstermek ve reklam performansını ölçmek için cihaz tanımlayıcısı kullanılır.'
          # Export compliance must be reviewed before submission with E2EE.
          info.pop('ITSAppUsesNonExemptEncryption', None)
          info['CFBundleDisplayName'] = 'TBT'
          info['CFBundleName'] = 'TBT'
          info['UIBackgroundModes'] = ['fetch', 'remote-notification']
          info['GADApplicationIdentifier'] = os.environ['ADMOB_IOS_APP_ID']

          schemes = info.get('CFBundleURLTypes', [])
          for name, scheme in (
              ('com.tbt.social', 'tbt'),
              ('Google Sign-In', 'com.googleusercontent.apps.330578532415-vq9ighb74m02f36pfdf6mq369t6utjj0'),
          ):
              if not any(scheme in item.get('CFBundleURLSchemes', []) for item in schemes):
                  schemes.append({
                      'CFBundleTypeRole': 'Editor',
                      'CFBundleURLName': name,
                      'CFBundleURLSchemes': [scheme],
                  })
          info['CFBundleURLTypes'] = schemes

          with info_path.open('wb') as f:
              plistlib.dump(info, f, sort_keys=False)

          entitlements = {
              'aps-environment': 'production',
              'com.apple.developer.applesignin': ['Default'],
              'com.apple.developer.associated-domains': [
                  'applinks:trtbt.com',
                  'applinks:www.trtbt.com',
              ],
          }
          with Path('ios/Runner/Runner.entitlements').open('wb') as f:
              plistlib.dump(entitlements, f, sort_keys=False)
          PY

          printf '%s' "$FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" \
            | base64 --decode > ios/Runner/GoogleService-Info.plist

          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path('ios/Podfile')
          text = podfile.read_text()
          if re.search(r"^\s*#?\s*platform :ios,\s*'[^']+'", text, flags=re.M):
              text = re.sub(
                  r"^\s*#?\s*platform :ios,\s*'[^']+'",
                  "platform :ios, '15.0'",
                  text,
                  count=1,
                  flags=re.M,
              )
          else:
              text = "platform :ios, '15.0'\n" + text
          podfile.write_text(text)
          PY

          sudo gem install xcodeproj -N
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |item| item.name == 'Runner' }
          abort('Runner target missing') unless target

          runner_group = project.main_group.find_subpath('Runner', false)
          abort('Runner group missing') unless runner_group
          config_file = runner_group.files.find do |file|
            file.path == 'GoogleService-Info.plist'
          end
          config_file ||= runner_group.new_file('GoogleService-Info.plist')
          unless target.resources_build_phase.files_references.include?(config_file)
            target.resources_build_phase.add_file_reference(config_file)
          end

          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('DEVELOPMENT_TEAM')
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE_ID')
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
          end
          project.save
          RUBY

      - name: Configure iOS share extension
        run: python3 tool/configure_ios_share.py

      - name: Install signing certificate and provisioning profiles
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/tbt-distribution.p12"
          MAIN_PROFILE_PATH="$RUNNER_TEMP/tbt-app-store.mobileprovision"
          SHARE_PROFILE_PATH="$RUNNER_TEMP/tbt-share.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/tbt-signing.keychain-db"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          API_KEY_JSON="$RUNNER_TEMP/app-store-connect-api-key.json"
          SHARE_PROFILE_REQUESTED_NAME="TBT Share App Store 2026"

          test -n "$IOS_DISTRIBUTION_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$ASC_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          python3 - <<'PYKEY'
          import json
          import os
          from pathlib import Path

          payload = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": os.environ["ASC_PRIVATE_KEY"],
              "in_house": False,
          }
          Path(os.environ["RUNNER_TEMP"], "app-store-connect-api-key.json").write_text(
              json.dumps(payload)
          )
          PYKEY
          chmod 600 "$API_KEY_JSON"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          sudo gem install fastlane -N
          fastlane run sigh \
            api_key_path:"$API_KEY_JSON" \
            app_identifier:"$BUNDLE_ID" \
            team_id:"$DEVELOPMENT_TEAM" \
            provisioning_name:"$PROFILE_NAME" \
            output_path:"$RUNNER_TEMP" \
            filename:"$(basename "$MAIN_PROFILE_PATH")" \
            force:true \
            skip_install:true
          fastlane run sigh \
            api_key_path:"$API_KEY_JSON" \
            app_identifier:"com.tbt.social.TBTShare" \
            team_id:"$DEVELOPMENT_TEAM" \
            provisioning_name:"$SHARE_PROFILE_REQUESTED_NAME" \
            output_path:"$RUNNER_TEMP" \
            filename:"$(basename "$SHARE_PROFILE_PATH")" \
            force:true \
            skip_install:true

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$MAIN_PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          security cms -D -i "$SHARE_PROFILE_PATH" > "$RUNNER_TEMP/share-profile.plist"

          python3 - <<'PYPROFILE'
          import os
          import plistlib
          from pathlib import Path

          group = "group.com.tbt.social.share"
          expected = [
              ("profile.plist", "com.tbt.social"),
              ("share-profile.plist", "com.tbt.social.TBTShare"),
          ]
          for filename, suffix in expected:
              data = plistlib.loads((Path(os.environ["RUNNER_TEMP"]) / filename).read_bytes())
              rights = data.get("Entitlements", {})
              assert rights.get("application-identifier", "").endswith(
                  "." + suffix
              ), "Profile bundle identifier mismatch"
              assert group in rights.get(
                  "com.apple.security.application-groups", []
              ), "App Group missing from signing profile"
          PYPROFILE

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          test "$PROFILE_DISPLAY_NAME" = "$PROFILE_NAME"
          cp "$MAIN_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          SHARE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/share-profile.plist")
          SHARE_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/share-profile.plist")
          cp "$SHARE_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$SHARE_UUID.mobileprovision"
          echo "SHARE_PROFILE_NAME=$SHARE_PROFILE_NAME" >> "$GITHUB_ENV"
          export SHARE_PROFILE_NAME

          ruby <<'RUBYSHARE'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          share = project.targets.find { |item| item.name == 'TBTShare' }
          abort('TBTShare target missing') unless share
          share.build_configurations.each do |config|
            config.build_settings.merge!({
              'CODE_SIGN_STYLE' => 'Manual',
              'DEVELOPMENT_TEAM' => ENV.fetch('DEVELOPMENT_TEAM'),
              'CODE_SIGN_IDENTITY' => 'Apple Distribution',
              'PROVISIONING_PROFILE_SPECIFIER' => ENV.fetch('SHARE_PROFILE_NAME'),
            })
          end
          project.save
          RUBYSHARE

      - name: Create export configuration
        shell: bash
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
              <key>com.tbt.social.TBTShare</key>
              <string>${SHARE_PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>

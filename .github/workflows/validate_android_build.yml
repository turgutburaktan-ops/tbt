name: Validate Android Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/app/src/main/AndroidManifest.xml'
      - '.github/workflows/validate_android_build.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/app/src/main/AndroidManifest.xml'
      - '.github/workflows/validate_android_build.yml'

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare temporary Android scaffold
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/src/main/AndroidManifest.xml /tmp/tbt-AndroidManifest.xml
          rm -rf android
          flutter create --platforms=android --project-name best_photo_spot .
          cp /tmp/tbt-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('${MAPS_API_KEY}', 'ci-placeholder-maps-key')
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          gradle_text = gradle.read_text()
          gradle_text = gradle_text.replace(
              'minSdk = flutter.minSdkVersion',
              'minSdk = 26',
          )
          gradle.write_text(gradle_text)
          PY

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: tbt-android-debug-validation-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3

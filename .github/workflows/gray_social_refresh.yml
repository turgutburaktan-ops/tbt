name: Apply Graphite Gray Social Refresh

on:
  push:
    paths:
      - 'tools/gray_social_refresh.py'
      - '.github/workflows/gray_social_refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Apply graphite gray refresh
        run: python3 tools/gray_social_refresh.py
      - name: Format changed Dart files without camera or Iris
        run: |
          files=$(git diff --name-only -- 'lib/**/*.dart' | grep -Ev '(camera|iris)' || true)
          if [ -n "$files" ]; then
            dart format $files
          fi
      - name: Analyze
        run: flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Apply graphite gray UI and restore social access'
            git push
          fi

name: Iris Fixed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Audit photo spot coordinates
        run: python3 tool/audit_spot_coordinates.py

      - name: Upload coordinate audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-spot-coordinate-audit
          path: build/spot_quality/coordinate_audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Recreate Android project
        run: rm -rf android && flutter create --platforms=android .

      - name: Prepare Android build
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: python3 tool/prepare_android_build.py

      - name: Guard exposure during tap focus
        run: python3 tool/patch_focus_exposure_guard.py

      - name: Install dependencies
        run: flutter pub get

      - name: Patch Iris Android capture
        run: python3 tool/patch_iris_camera.py

      - name: Enable physical 0.5x and tele lenses
        run: python3 tool/patch_iris_physical_lenses.py

      - name: Add exact lens ID switching
        run: python3 tool/patch_iris_direct_lens_id.py

      - name: Route camera buttons to exact lens IDs
        run: python3 tool/patch_camera_direct_lens_switch.py

      - name: Optimize GPU editor preview
        run: python3 tool/patch_gpu_editor_runtime.py

      - name: Analyze
        run: |
          rm -rf test
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: en-iyi-cekim-noktasi-pro-camera-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

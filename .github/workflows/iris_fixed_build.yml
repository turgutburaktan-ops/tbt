name: Iris Fixed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Recreate Android project
        run: rm -rf android && flutter create --platforms=android .

      - name: Prepare Android build
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: python3 tool/prepare_android_build.py

      - name: Install dependencies
        run: flutter pub get

      - name: Patch Iris Android capture
        run: python3 tool/patch_iris_camera.py

      - name: Analyze
        run: |
          rm -rf test
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: en-iyi-cekim-noktasi-ai-camera-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

name: Iris Fixed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: iris-fixed-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Configure Android Firebase and Maps
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          gradle = Path('android/app/build.gradle')
          gradle_kts = Path('android/app/build.gradle.kts')
          app_gradle = gradle if gradle.exists() else gradle_kts
          if not app_gradle.exists():
              raise SystemExit('Android app Gradle file not found')

          text = app_gradle.read_text()
          text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
          text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 26')
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
          app_gradle.write_text(text)

          settings = Path('android/settings.gradle')
          settings_kts = Path('android/settings.gradle.kts')
          settings_file = settings if settings.exists() else settings_kts
          st = settings_file.read_text()
          st = re.sub(
              r'(org\.jetbrains\.kotlin\.android[^\n]*version\s+[\"\'])[0-9.]+',
              r'\g<1>1.9.24',
              st,
          )

          if 'com.google.gms.google-services' not in st:
              if settings_file.suffix == '.kts':
                  st = st.replace(
                      'plugins {',
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1,
                  )
              else:
                  st = st.replace(
                      'plugins {',
                      'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                      1,
                  )
          settings_file.write_text(st)

          text = app_gradle.read_text()
          if 'com.google.gms.google-services' not in text:
              if app_gradle.suffix == '.kts':
                  text = text.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
              else:
                  text = text.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"', 1)
              app_gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          mt = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
          ]
          missing = [p for p in permissions if p not in mt]
          if missing:
              mt = mt.replace('<application', '\n'.join(missing) + '\n\n    <application', 1)

          maps_key = os.environ.get('MAPS_API_KEY', '').strip()
          if not maps_key:
              raise SystemExit('MAPS_API_KEY secret is missing')

          if 'com.google.android.geo.API_KEY' not in mt:
              app_start = mt.find('<application')
              app_end = mt.find('>', app_start)
              meta = (
                  '\n        <meta-data\n'
                  '            android:name="com.google.android.geo.API_KEY"\n'
                  f'            android:value="{maps_key}" />\n'
              )
              mt = mt[:app_end + 1] + meta + mt[app_end + 1:]
          manifest.write_text(mt)

          firebase_candidates = [
              p for p in Path('.').rglob('*google*services*.json')
              if str(p) != 'android/app/google-services.json'
          ]
          if not firebase_candidates:
              raise SystemExit('google-services.json not found')

          target = Path('android/app/google-services.json')
          target.write_bytes(firebase_candidates[0].read_bytes())
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Patch Iris Android still capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob

          matches = glob.glob(str(Path.home() / '.pub-cache/hosted/pub.dev/iris_camera-*'))
          if not matches:
              raise SystemExit('iris_camera package cache not found')

          root = Path(sorted(matches)[-1])
          image_util = root / 'android/src/main/kotlin/com/anies1212/iris_camera/ImageUtil.kt'
          controller = root / 'android/src/main/kotlin/com/anies1212/iris_camera/CameraController.kt'

          image_text = image_util.read_text()
          if 'image.format == ImageFormat.JPEG' not in image_text:
              marker = '    fun imageProxyToJpeg(image: ImageProxy): ByteArray {\n'
              replacement = marker + '''        if (image.format == ImageFormat.JPEG && image.planes.isNotEmpty()) {
            val buffer = image.planes[0].buffer.apply { rewind() }
            val bytes = ByteArray(buffer.remaining())
            buffer.get(bytes)
            return bytes
        }

        if (image.planes.size < 3) {
            throw IllegalStateException(
                "Unsupported ImageProxy format=${image.format}, planes=${image.planes.size}"
            )
        }
'''
              if marker not in image_text:
                  raise SystemExit('ImageUtil capture method not found')
              image_text = image_text.replace(marker, replacement, 1)
              image_util.write_text(image_text)

          controller_text = controller.read_text()
          manual_marker = '            val options = CaptureRequestOptions.Builder()\n'
          if 'CaptureRequest.CONTROL_AE_MODE_OFF' not in controller_text:
              manual_replacement = manual_marker + '''            options.setCaptureRequestOption(
                CaptureRequest.CONTROL_AE_MODE,
                CaptureRequest.CONTROL_AE_MODE_OFF
            )
'''
              if manual_marker not in controller_text:
                  raise SystemExit('CameraController manual capture block not found')
              controller_text = controller_text.replace(manual_marker, manual_replacement, 1)

          old_apply = '            camera2?.setCaptureRequestOptions(options.build())\n'
          new_apply = '            camera2?.setCaptureRequestOptions(options.build())?.await()\n'
          if old_apply in controller_text:
              controller_text = controller_text.replace(old_apply, new_apply, 1)

          controller.write_text(controller_text)
          print(f'Patched Iris package: {root.name}')
          PY

      - name: Flutter analyze
        run: |
          rm -rf test
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: en-iyi-cekim-noktasi-ai-camera-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

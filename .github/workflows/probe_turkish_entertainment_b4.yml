name: Probe Turkish Entertainment B4
on:
  push:
    branches: [codex/publish-sound-videos]
    paths: [.github/workflows/probe_turkish_entertainment_b4.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Probe candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          urls=(
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Adhan_in_Istanbul.webm"
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Gaziantep_Patl%C4%B1can_Kebab%C4%B1_-_Kaynak_Ki%C5%9Fi-_Nuray_%C3%96ZO%C4%9ELU_(Dursun_%C5%9EAH%C4%B0N_2021).webm"
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Samsunspor-Ankara_Ke%C3%A7i%C3%B6reng%C3%BCc%C3%BC_ma%C3%A7%C4%B1_(23.4.23)_saha_i%C5%9Fgali.webm"
          )
          names=(adhan kebab sahaisgali)
          for i in 0 1 2; do
            f="/tmp/probe/${names[$i]}.webm"
            curl -fL --retry 3 --max-time 360 -sS -o "$f" "${urls[$i]}"
            echo "NAME=${names[$i]}"
            sha256sum "$f"
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height -of json "$f"
          done

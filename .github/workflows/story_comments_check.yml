name: Story playback and comment permissions
on:
  push:
    branches: [codex/story-comments-fix-20260920]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/widgets/story_strip.dart lib/widgets/app_video_player.dart lib/widgets/shared_story_video.dart lib/widgets/shared_post_card.dart lib/widgets/content_engagement_bar.dart test/video_playback_test.dart
      - run: flutter test test/video_playback_test.dart test/profile_ios_interaction_test.dart
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --only firestore --project demo-tbt "node tool/test_comment_permissions.cjs" --non-interactive

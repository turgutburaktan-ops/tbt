name: Complete cafe expansion with bounded workers
on:
  push:
    branches: [codex/cafe-expansion-parallel-20260915]
permissions:
  contents: read
  actions: write
concurrency:
  group: cafe-catalog-expansion-parallel
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix functions
      - run: npm install --prefix functions --no-save @firebase/rules-unit-testing firebase
      - run: npm install -g firebase-tools
      - run: node --test functions/catalog/cafe_expansion.test.js functions/catalog/schema.test.js
      - run: python3 -m unittest discover -s functions/scripts -p test_overture_cafes.py
      - run: firebase emulators:exec --only firestore --project demo-tbt "node --test functions/catalog/seed.test.js functions/catalog/store.test.js" --non-interactive
      - name: Stop the superseded serial import and reuse its validated manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          url='https://api.github.com/repos/turgutburaktan-ops/tbt/actions/runs/34972077344'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def status():
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
                  return json.load(r)['status']
          if status() != 'completed':
              try:
                  urllib.request.urlopen(urllib.request.Request(url+'/cancel',headers=headers,method='POST'),timeout=30).close()
              except urllib.error.HTTPError as e:
                  if e.code != 409: raise
          for attempt in range(60):
              if status() == 'completed': break
              time.sleep(2)
          else: raise RuntimeError('Previous writer has not stopped; refusing concurrent import')
          PY
          mkdir -p build/cafe-expansion
          gh run download 34972077344 --repo turgutburaktan-ops/tbt -n cafe-expansion-report -D build/cafe-expansion
          test -s build/cafe-expansion/candidates.jsonl
      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          target=Path(os.environ['RUNNER_TEMP'])/'cafe-service-account.json'
          target.write_text(json.dumps(value)); target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'GOOGLE_APPLICATION_CREDENTIALS={target}\n')
              f.write('GCLOUD_PROJECT=en-iyi-cekim-noktasi\n')
          PY
      - name: Preview additions against existing and removed businesses
        run: node functions/scripts/expand_cafe_catalog.js build/cafe-expansion/candidates.jsonl
      - name: Add missing cafes and verify per-province counts
        run: node functions/scripts/expand_cafe_catalog.js build/cafe-expansion/candidates.jsonl --apply
      - name: Verify complete shared catalog
        run: node functions/scripts/verify_place_catalog.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cafe-expansion-report
          path: |
            build/cafe-expansion/*.json
            build/cafe-expansion/*.jsonl
            build/cafe-expansion/python-packages.txt
          retention-days: 30

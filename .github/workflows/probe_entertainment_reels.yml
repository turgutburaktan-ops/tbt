name: Probe TBT Entertainment Reels
on:
  push:
    branches: [codex/publish-sound-videos]
    paths: [.github/workflows/probe_entertainment_reels.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download and inspect candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tbt-ent
          curl -fL --retry 3 --max-time 240 -sS -o /tmp/tbt-ent/skate.webm 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Skateboarding-Street-World-Championship-Tokyo-Japan-2023-12-17_04183-04229_video.webm'
          curl -fL --retry 3 --max-time 240 -sS -o /tmp/tbt-ent/pottery.webm 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pottery_making_in_Northern_Ghana.webm'
          curl -fL --retry 3 --max-time 240 -sS -o /tmp/tbt-ent/swing.webm 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Swing_dancing_at_CCX_2022.webm'
          echo SHA256_START
          sha256sum /tmp/tbt-ent/*.webm
          echo SHA256_END
          for f in skate pottery swing; do
            echo "${f^^}_PROBE_START"
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height -of json "/tmp/tbt-ent/$f.webm"
            echo "${f^^}_PROBE_END"
          done
          ffmpeg -y -v error -ss 20 -i /tmp/tbt-ent/skate.webm -frames:v 1 /tmp/tbt-ent/skate-20.jpg
          ffmpeg -y -v error -ss 6 -i /tmp/tbt-ent/pottery.webm -frames:v 1 /tmp/tbt-ent/pottery-6.jpg
          ffmpeg -y -v error -ss 10 -i /tmp/tbt-ent/swing.webm -frames:v 1 /tmp/tbt-ent/swing-10.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: tbt-entertainment-frames-v2
          path: /tmp/tbt-ent/*.jpg

name: Probe TBT Entertainment Reels
on:
  push:
    branches: [codex/publish-sound-videos]
    paths: [.github/workflows/probe_entertainment_reels.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download and inspect candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tbt-ent
          curl -fL --retry 3 --max-time 240 -sS -o /tmp/tbt-ent/samsunpenalti.webm 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Samsunspor-G%C3%B6ztepe_ma%C3%A7%C4%B1_(17.8.26)_ikinci_penalt%C4%B1.webm'
          echo SHA256_START
          sha256sum /tmp/tbt-ent/samsunpenalti.webm
          echo SHA256_END
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height -of json /tmp/tbt-ent/samsunpenalti.webm
          ffmpeg -y -v error -ss 7 -i /tmp/tbt-ent/samsunpenalti.webm -frames:v 1 /tmp/tbt-ent/samsunpenalti-7.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: tbt-entertainment-samsun-penalty
          path: /tmp/tbt-ent/*.jpg

name: Complete iOS 64 submission with verified documentation exemption
on:
  push:
    branches: [codex/release-readiness-20260929]
    paths: ['.github/workflows/submit_ios64.yml']
permissions:
  contents: read
  actions: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require successful original upload before retrying submission
        uses: actions/github-script@v7
        with:
          script: |
            const deadline=Date.now()+45*60*1000;
            while(Date.now()<deadline){
              const {data:j}=await github.rest.actions.getJobForWorkflowRun({...context.repo,job_id:109828811559});
              if(j.status==='completed'){
                const upload=j.steps.find(s=>s.name==='Upload signed version 64 to Apple');
                if(upload?.conclusion!=='success')throw new Error('Apple upload has not succeeded');
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,20000));
            }
            throw new Error('Original upload/submission did not finish');
      - name: Submit verified build 64 to App Review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: node tool/submit_ios_build64.cjs

name: Post photo and brand checks
on:
  push:
    branches: [codex/post-photo-brand]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/theme/app_theme.dart lib/screens/create_post_screen.dart lib/screens/feed_screen.dart lib/widgets/post_media_carousel.dart
      - run: flutter test test/camera_share_controls_test.dart test/route_create_test.dart test/restored_flows_test.dart
      - run: python3 -m unittest discover -s tool/tests -p test_ios_camera_mirroring.py
      - run: flutter build bundle --debug

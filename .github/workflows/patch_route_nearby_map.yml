name: Patch Route Nearby Map

on:
  push:
    paths:
      - 'tools/patch_route_nearby_map.py'
      - '.github/workflows/patch_route_nearby_map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Apply nearby-first route map patch
        run: python3 tools/patch_route_nearby_map.py
      - name: Format route planner
        run: dart format lib/screens/route_planner_screen.dart
      - name: Analyze
        run: flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit route changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/route_planner_screen.dart pubspec.lock
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: show nearby photo spots on route map'
            git push
          fi

name: Build 1000+ Verified Photo Spots

on:
  workflow_dispatch:
    inputs:
      target_total:
        description: 'Minimum verified spot count'
        required: true
        default: '1100'
  push:
    branches:
      - feature/verified-travel-batch-11
    paths:
      - 'tool/generate_verified_spot_catalog.py'
      - 'tool/audit_verified_spot_catalog.py'
      - 'tool/upgrade_verified_spot_images.py'
      - '.github/workflows/build_1000_verified_spots.yml'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: verified-photo-spots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate direct-source verified catalog
        env:
          TARGET_TOTAL: ${{ inputs.target_total || '1100' }}
        run: python3 tool/generate_verified_spot_catalog.py --target-total "$TARGET_TOTAL"

      - name: Upgrade hand-verified local photos
        run: python3 tool/upgrade_verified_spot_images.py --long-edge 1600 --short-edge 900 --request-width 1920

      - name: Coordinate and evidence audit
        run: python3 tool/audit_spot_coordinates.py

      - name: 1000+ catalog and image quality audit
        env:
          MIN_VERIFIED_SPOTS: ${{ inputs.target_total || '1100' }}
          MIN_IMAGE_LONG_EDGE: '1600'
          MIN_IMAGE_SHORT_EDGE: '900'
        run: python3 tool/audit_verified_spot_catalog.py

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-photo-spot-quality
          path: |
            build/spot_import/wikidata_verified_catalog_report.json
            build/spot_quality/coordinate_audit.json
            build/spot_quality/verified_catalog_audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit verified catalog
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/data/verified_travel_places_generated.dart \
            lib/data/spot_coordinate_verification_registry_generated.dart \
            lib/data/verified_travel_image_registry_generated.dart \
            lib/data/verified_travel_image_quality_generated.json \
            assets/spots
          if git diff --cached --quiet; then
            echo 'No verified catalog changes.'
            exit 0
          fi
          git commit -m 'data: refresh 1000+ verified photo spot catalog'
          git push origin HEAD:${GITHUB_REF_NAME}

name: Verify and repair private media token revocation
on:
  push:
    branches: [codex/security-verification-20260928]
    paths:
      - functions/chat_media_security.js
      - functions/test/private_media*.test.js
      - tool/revoke_private_media.cjs
      - test/chat_media_security.cjs
      - .github/workflows/private_media_security_repair.yml
permissions:
  contents: read
concurrency:
  group: tbt-security-hardening
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix functions
      - run: node --test test/private_route_media_security.cjs test/trusted_notifications.cjs functions/test/*.test.js
      - run: npm install --prefix /tmp/security-tests @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.12.0
      - name: Verify new and legacy chat access and lifecycle rules
        env:
          NODE_PATH: /tmp/security-tests/node_modules
        run: /tmp/security-tests/node_modules/.bin/firebase emulators:exec --only firestore,storage --project demo-tbt-general-audit "node --test --test-concurrency=1 test/chat_media_security.cjs test/general_security_audit.cjs test/content_lifecycle_rules.cjs test/route_access_rules.cjs" --non-interactive
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --prefix functions
          npm install --prefix /tmp/security-deploy firebase-tools@14.12.0
      - name: Authenticate existing scoped deployment identity
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          account=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          assert account['project_id']=='en-iyi-cekim-noktasi'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-media-security.json'
          path.write_text(json.dumps(account));path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'GOOGLE_APPLICATION_CREDENTIALS={path}\n')
          PY
      - name: Deploy corrected private media sweeper
        run: /tmp/security-deploy/node_modules/.bin/firebase deploy --only functions:sealPendingChatMedia --project en-iyi-cekim-noktasi --non-interactive
      - name: Revoke and verify existing private media links
        run: node tool/revoke_private_media.cjs

name: Deploy approved build 29 backend fixes

on:
  push:
    branches: [codex/store29-backend-fixes]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install function dependencies
        run: npm install --prefix functions
      - name: Test restored authentication and broadcasts
        run: node --test functions/test/auth_helpers.test.js functions/test/broadcast_worker.test.js functions/test/account_lifecycle.test.js functions/test/verification_email.test.js
      - name: Test business publication
        run: node --test functions/test/business_publication.test.js
      - name: Test music
        run: node --test functions/test/music*.test.js
      - name: Test Creator and photo notification policies
        run: node --test functions/test/social_publishing.test.js functions/test/reputation_system.test.js functions/test/role_invites.test.js functions/test/push_payload.test.js functions/test/broadcast_photo.test.js functions/test/notification_policy.test.js functions/test/event_reminders.test.js functions/test/retention.test.js
      - name: Test verified venue quality
        run: node --test functions/test/venue_quality.test.js
      - name: Test reservations
        run: node --test functions/test/reservation*.test.js
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Setup Java for chat tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test chat collaboration against emulator
        run: firebase emulators:exec --only firestore --project demo-tbt "node tool/test_chat_collaboration.cjs && node tool/test_social_publishing.cjs && node tool/test_usability_creator_admin.cjs" --non-interactive
      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT', '')
          if not raw:
              raise SystemExit('FIREBASE_SERVICE_ACCOUNT secret is missing.')
          service_account = json.loads(raw)
          target = Path(os.environ['RUNNER_TEMP']) / 'firebase-service-account.json'
          target.write_text(json.dumps(service_account), encoding='utf-8')
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'GOOGLE_APPLICATION_CREDENTIALS={target}\n')
          PY
      - name: Deploy message and story fixes
        run: firebase deploy --only functions:chatAction,functions:replyToNotification,functions:socialPublishing,functions:pushOnNotificationCreated --project en-iyi-cekim-noktasi --non-interactive

name: TBT route editor device preview

on:
  push:
    branches: [codex/route-editor-preview]

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze route editor
        run: flutter analyze lib/screens/route_create_screen.dart lib/widgets/route_editor_map.dart tool/route_preview_main.dart --no-fatal-infos
      - name: Check route flows
        run: flutter test test/route_create_test.dart test/route_itinerary_test.dart test/restored_flows_test.dart
      - name: Verify runtime secrets
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${MAPS_API_KEY:-}" || { echo 'MAPS_API_KEY GitHub secret is missing.'; exit 1; }
      - name: Install stable CI debug signing certificate
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/ci/android-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E 'SHA1:|SHA256:'
      - name: Preserve app manifest
        run: cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
      - name: Generate disposable Android host project
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --platforms=android --org com.tbt --project-name best_photo_spot .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import os
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          maps_key = os.environ['MAPS_API_KEY']
          text = manifest.read_text()
          placeholder = '${MAPS_API_KEY}'
          if placeholder not in text:
              raise SystemExit('MAPS_API_KEY placeholder is missing from AndroidManifest.xml')
          manifest.write_text(text.replace(placeholder, maps_key))
          PY
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          sed -i 's/com.tbt.best_photo_spot/com.tbt.social/g' android/app/build.gradle.kts
          main_activity=$(find android/app/src/main/kotlin -name MainActivity.kt -print -quit)
          sed -i 's/package com.tbt.best_photo_spot/package com.tbt.social/' "$main_activity"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = '    buildTypes {\n'
          signing = '''    signingConfigs {\n        getByName("debug") {\n            storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n\n'''
          if signing not in s:
              s = s.replace(marker, signing + marker, 1)
          debug_block = '''    buildTypes {\n        getByName("debug") {\n            signingConfig = signingConfigs.getByName("debug")\n        }\n'''
          s = s.replace(marker, debug_block, 1)
          p.write_text(s)
          PY
      - name: Verify package identity and maps wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.tbt.social"' android/app/build.gradle.kts
          grep -q 'namespace = "com.tbt.social"' android/app/build.gradle.kts
          grep -q 'storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")' android/app/build.gradle.kts
          ! grep -q '\${MAPS_API_KEY}' android/app/src/main/AndroidManifest.xml
          ! grep -q 'CI_DUMMY_MAPS_KEY' android/app/src/main/AndroidManifest.xml
          main_activity=$(find android/app/src/main/kotlin -name MainActivity.kt -print -quit)
          grep -q '^package com.tbt.social$' "$main_activity"
      - name: Restore TBT icon and native integrations
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/spot_thumbnails/tbt_app_icon.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          python3 tool/patch_native_photo_pipeline.py
          python3 tool/configure_notifications.py android
          python3 tool/configure_route_album.py android
          python3 tool/patch_receive_sharing_intent.py
      - name: Build debug APK
        run: flutter build apk --debug --no-pub --build-number=36
      - name: Verify APK signing identity
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-signing.txt
          tr '[:lower:]' '[:upper:]' < /tmp/apk-signing.txt | tr -d ':' > /tmp/apk-signing-normalized.txt
          grep -q '758FF21389033ED26375415FAD30E11F9AD1F364' /tmp/apk-signing-normalized.txt
          grep -q '3F9AA496CAF137EAC148CD942923956D3D6A2ADAFF9CDB1051DE024062819625' /tmp/apk-signing-normalized.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tbt-route-editor-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build isolated visual review entry point
        run: flutter build apk --debug --no-pub --build-number=36 -t tool/route_preview_main.dart
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual Android screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/capture_route_preview.sh
      - name: Upload device captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbt-route-editor-device-review
          path: /tmp/route-review/
          if-no-files-found: warn
          retention-days: 7

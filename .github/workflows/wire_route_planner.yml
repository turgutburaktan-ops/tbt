name: Wire Route Planner

on:
  push:
    paths:
      - 'tools/wire_route_planner.py'
      - '.github/workflows/wire_route_planner.yml'
      - 'pubspec.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Apply route planner wiring
        run: python3 tools/wire_route_planner.py
      - name: Format
        run: dart format lib/screens/map_screen.dart lib/screens/route_planner_screen.dart
      - name: Analyze
        run: flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/map_screen.dart lib/screens/route_planner_screen.dart pubspec.lock
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Wire route planner into map'
            git push
          fi

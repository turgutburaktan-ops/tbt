name: Apply Teal UI Refresh

on:
  push:
    paths:
      - 'tools/app_refresh_teal.py'
      - '.github/workflows/app_refresh_teal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Apply refresh
        run: python3 tools/app_refresh_teal.py
      - name: Format changed Dart files
        run: dart format lib
      - name: Analyze
        run: flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Refresh UI with teal theme and fix social/login UX'
            git push
          fi

name: Mobile campaigns and coupons
on:
  push:
    branches: [codex/mobile-campaigns]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/business_campaigns_screen.dart lib/screens/business_management_screen.dart lib/services/business_service.dart
      - run: flutter test test/business_campaign_editor_test.dart test/route_create_test.dart test/restored_flows_test.dart
      - run: flutter build bundle --debug

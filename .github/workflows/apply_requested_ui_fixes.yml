name: Apply requested UI fixes

on:
  workflow_dispatch:
  push:
    branches: [feature/video-v1]
    paths:
      - '.github/workflows/apply_requested_ui_fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-v1
      - name: Apply requested fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Missing target in {path}: {old[:120]!r}')
              s = s.replace(old, new, count)
              p.write_text(s)

          # 1) Çevrende: remove separate Events tab; Radar is already the unified events/radar experience.
          p = Path('lib/screens/home_shell_screen.dart')
          s = p.read_text()
          s = s.replace("import 'events_hub_screen.dart';\n", '')
          if "import 'reels_screen.dart';" not in s:
              s = s.replace("import 'radar_screen.dart';\n", "import 'radar_screen.dart';\nimport 'reels_screen.dart';\n")
          old = """    final labels = campusEligible
        ? const ['Radar', 'Etkinlikler', 'Kampüs']
        : const ['Radar', 'Etkinlikler'];
    final effectiveSection = _section >= labels.length ? 0 : _section;
    final pages = <Widget>[
      const RadarScreen(embedded: true),
      const EventsHubScreen(),
      if (campusEligible) const CampusHomeScreen(),
    ];"""
          new = """    final labels = campusEligible
        ? const ['Çevrende', 'Kampüs']
        : const ['Çevrende'];
    final effectiveSection = _section >= labels.length ? 0 : _section;
    final pages = <Widget>[
      const RadarScreen(embedded: true),
      if (campusEligible) const CampusHomeScreen(),
    ];"""
          if old not in s:
              raise SystemExit('Nearby tab target missing')
          s = s.replace(old, new, 1)
          s = s.replace("'Radar, etkinlikler ve öğrencilere özel kampüs.'", "'Yakındaki planlar, etkinlikler ve öğrencilere özel kampüs.'", 1)

          # 3) Reels becomes a first-class Home tab.
          old = """              child: _CompactTabs(
                firstLabel: 'Sana Özel',
                secondLabel: 'Takip',
                selected: _section,
                onChanged: (value) => setState(() => _section = value),
              ),"""
          new = """              child: _NearbyTabs(
                labels: const ['Sana Özel', 'Takip', 'Reels'],
                selected: _section,
                onChanged: (value) => setState(() => _section = value),
              ),"""
          if old not in s:
              raise SystemExit('Home tabs target missing')
          s = s.replace(old, new, 1)
          old = """                children: const [
                  _AuthAwareFeed(mode: FeedMode.forYou),
                  _AuthAwareFeed(mode: FeedMode.following),
                ],"""
          new = """                children: const [
                  _AuthAwareFeed(mode: FeedMode.forYou),
                  _AuthAwareFeed(mode: FeedMode.following),
                  ReelsScreen(),
                ],"""
          if old not in s:
              raise SystemExit('Home IndexedStack target missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Radar header: direct photo-capable event creation entry.
          p = Path('lib/screens/radar_screen.dart')
          s = p.read_text()
          if "import 'event_photo_create_screen.dart';" not in s:
              s = s.replace("import 'event_deep_link_screen.dart';\n", "import 'event_deep_link_screen.dart';\nimport 'event_photo_create_screen.dart';\n")
          marker = """        SearchableSelectionField(
          controller: _cityController,"""
          insert = """        SizedBox(
          width: double.infinity,
          child: FilledButton.icon(
            onPressed: () async {
              if (FirebaseAuth.instance.currentUser == null) {
                _message('Etkinlik oluşturmak için giriş yapmalısın.');
                return;
              }
              await Navigator.push<bool>(
                context,
                MaterialPageRoute(builder: (_) => const EventPhotoCreateScreen()),
              );
            },
            icon: const Icon(Icons.add_a_photo_outlined),
            label: const Text('Etkinlik Oluştur'),
          ),
        ),
        const SizedBox(height: 10),
        SearchableSelectionField(
          controller: _cityController,"""
          if marker not in s:
              raise SystemExit('Radar header target missing')
          s = s.replace(marker, insert, 1)
          p.write_text(s)

          # 4) Main video/Reels capture limit = 60 seconds; Story stays 15 seconds.
          p = Path('lib/screens/camera_screen.dart')
          s = p.read_text()
          old = "int get _videoLimitSeconds => widget.storyMode ? 15 : 30;"
          if old not in s:
              raise SystemExit('Video limit target missing')
          s = s.replace(old, "int get _videoLimitSeconds => widget.storyMode ? 15 : 60;", 1)
          p.write_text(s)

          # 2) Existing Event Create bottom sheet gets a cover photo picker and stores cover atomically at creation.
          p = Path('lib/screens/social_events_screen.dart')
          s = p.read_text()
          if "import 'dart:io';" not in s:
              s = "import 'dart:io';\n\n" + s
          if "package:firebase_storage/firebase_storage.dart" not in s:
              s = s.replace("import 'package:firebase_auth/firebase_auth.dart';\n", "import 'package:firebase_auth/firebase_auth.dart';\nimport 'package:firebase_storage/firebase_storage.dart';\n")
          if "package:image_picker/image_picker.dart" not in s:
              s = s.replace("import 'package:flutter/services.dart';\n", "import 'package:flutter/services.dart';\nimport 'package:image_picker/image_picker.dart';\n")
          old = """    EventLocationSelection? selectedLocation;
    bool saving = false;
    String? formError;"""
          new = """    EventLocationSelection? selectedLocation;
    final coverPicker = ImagePicker();
    File? coverImage;
    bool saving = false;
    String? formError;"""
          if old not in s:
              raise SystemExit('Event state target missing')
          s = s.replace(old, new, 1)
          old = """          Future<void> chooseDateTime() async {"""
          new = """          Future<void> chooseCoverImage() async {
            final source = await showModalBottomSheet<ImageSource>(
              context: context,
              useSafeArea: true,
              backgroundColor: const Color(0xFF121416),
              builder: (sheet) => Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  ListTile(
                    leading: const Icon(Icons.camera_alt_outlined),
                    title: const Text('Fotoğraf çek'),
                    onTap: () => Navigator.pop(sheet, ImageSource.camera),
                  ),
                  ListTile(
                    leading: const Icon(Icons.photo_library_outlined),
                    title: const Text('Galeriden seç'),
                    onTap: () => Navigator.pop(sheet, ImageSource.gallery),
                  ),
                ],
              ),
            );
            if (source == null) return;
            final picked = await coverPicker.pickImage(
              source: source,
              imageQuality: 88,
              maxWidth: 1800,
              requestFullMetadata: false,
            );
            if (picked == null || !context.mounted) return;
            setSheetState(() {
              coverImage = File(picked.path);
              formError = null;
            });
          }

          Future<void> chooseDateTime() async {"""
          if old not in s:
              raise SystemExit('Cover function insertion target missing')
          s = s.replace(old, new, 1)
          marker = """                  const SizedBox(height: 16),
                  TextField(controller: titleController,"""
          block = """                  const SizedBox(height: 16),
                  GestureDetector(
                    onTap: saving ? null : chooseCoverImage,
                    child: Container(
                      height: 180,
                      width: double.infinity,
                      clipBehavior: Clip.antiAlias,
                      decoration: BoxDecoration(
                        color: const Color(0xFF121416),
                        borderRadius: BorderRadius.circular(18),
                        border: Border.all(color: Colors.white12),
                      ),
                      child: coverImage == null
                          ? const Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Icon(Icons.add_a_photo_outlined, size: 42, color: Colors.white54),
                                SizedBox(height: 9),
                                Text('Etkinlik kapak fotoğrafı ekle', style: TextStyle(fontWeight: FontWeight.w900)),
                                SizedBox(height: 4),
                                Text('Kameradan çek veya galeriden seç', style: TextStyle(color: Colors.white54)),
                              ],
                            )
                          : Stack(
                              fit: StackFit.expand,
                              children: [
                                Image.file(coverImage!, fit: BoxFit.cover),
                                Positioned(
                                  right: 8,
                                  bottom: 8,
                                  child: FilledButton.tonalIcon(
                                    onPressed: saving ? null : chooseCoverImage,
                                    icon: const Icon(Icons.edit_outlined),
                                    label: const Text('Değiştir'),
                                  ),
                                ),
                              ],
                            ),
                    ),
                  ),
                  const SizedBox(height: 16),
                  TextField(controller: titleController,"""
          if marker not in s:
              raise SystemExit('Cover UI target missing')
          s = s.replace(marker, block, 1)
          old = """                              if (typedCapacity < 1) {
                                setSheetState(() => formError = 'Katılımcı sayısı en az 1 olmalı.');
                                return;
                              }
                              if (selectedLocation == null) {"""
          new = """                              if (typedCapacity < 1) {
                                setSheetState(() => formError = 'Katılımcı sayısı en az 1 olmalı.');
                                return;
                              }
                              if (coverImage == null) {
                                setSheetState(() => formError = 'Etkinlik için bir kapak fotoğrafı ekle.');
                                return;
                              }
                              if (selectedLocation == null) {"""
          if old not in s:
              raise SystemExit('Cover validation target missing')
          s = s.replace(old, new, 1)
          old = """                                final allowed = await EventPrivacyService.instance.resolveAudience(
                                  visibility,
                                  selectedUserIds: selectedPeople.keys.toList(),
                                );
                                await SocialEventService.instance.create(
                                  title: titleController.text,"""
          new = """                                final allowed = await EventPrivacyService.instance.resolveAudience(
                                  visibility,
                                  selectedUserIds: selectedPeople.keys.toList(),
                                );
                                final user = FirebaseAuth.instance.currentUser!;
                                final eventId = FirebaseFirestore.instance
                                    .collection(SocialEventService.collection)
                                    .doc()
                                    .id;
                                final coverRef = FirebaseStorage.instance
                                    .ref()
                                    .child('users/${user.uid}/events/$eventId/cover.jpg');
                                await coverRef.putFile(
                                  coverImage!,
                                  SettableMetadata(contentType: 'image/jpeg'),
                                );
                                final coverUrl = await coverRef.getDownloadURL();
                                await SocialEventService.instance.create(
                                  eventId: eventId,
                                  coverImageUrl: coverUrl,
                                  coverStoragePath: coverRef.fullPath,
                                  title: titleController.text,"""
          if old not in s:
              raise SystemExit('Event create upload target missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Social event service accepts pre-generated id + cover fields so no forbidden post-create update is needed.
          p = Path('lib/services/social_event_service.dart')
          s = p.read_text()
          old = """    List<String> allowedUserIds = const [],
    String? communityId,
    String? communityName,
  }) async {"""
          new = """    List<String> allowedUserIds = const [],
    String? communityId,
    String? communityName,
    String? eventId,
    String coverImageUrl = '',
    String coverStoragePath = '',
  }) async {"""
          if old not in s:
              raise SystemExit('Service params target missing')
          s = s.replace(old, new, 1)
          old = "final ref = _firestore.collection(collection).doc();"
          if old not in s:
              raise SystemExit('Service ref target missing')
          s = s.replace(old, "final ref = _firestore.collection(collection).doc((eventId ?? '').trim().isEmpty ? null : eventId!.trim());", 1)
          old = """      'hostName': hostName,
      'communityId': safeCommunityId,"""
          new = """      'hostName': hostName,
      'coverImageUrl': coverImageUrl.trim(),
      'coverStoragePath': coverStoragePath.trim(),
      'communityId': safeCommunityId,"""
          if old not in s:
              raise SystemExit('Service cover fields target missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Fix the dedicated photo-event creator to use the same atomic cover creation path.
          p = Path('lib/screens/event_photo_create_screen.dart')
          s = p.read_text()
          old = """      final eventId = await SocialEventService.instance.create(
        title: _title.text,"""
          new = """      final eventId = FirebaseFirestore.instance
          .collection(SocialEventService.collection)
          .doc()
          .id;
      final ref = FirebaseStorage.instance
          .ref()
          .child('users/${user.uid}/events/$eventId/cover.jpg');
      await ref.putFile(
        _image!,
        SettableMetadata(contentType: 'image/jpeg'),
      );
      final url = await ref.getDownloadURL();
      await SocialEventService.instance.create(
        eventId: eventId,
        coverImageUrl: url,
        coverStoragePath: ref.fullPath,
        title: _title.text,"""
          if old not in s:
              raise SystemExit('Photo event creation target missing')
          s = s.replace(old, new, 1)
          old = """
      final ref = FirebaseStorage.instance
          .ref()
          .child('users/${user.uid}/events/$eventId/cover.jpg');
      await ref.putFile(
        _image!,
        SettableMetadata(contentType: 'image/jpeg'),
      );
      final url = await ref.getDownloadURL();
      await FirebaseFirestore.instance
          .collection(SocialEventService.collection)
          .doc(eventId)
          .set({
        'coverImageUrl': url,
        'coverImageUpdatedAt': FieldValue.serverTimestamp(),
      }, SetOptions(merge: true));
"""
          if old not in s:
              raise SystemExit('Old post-create cover update target missing')
          s = s.replace(old, '\n', 1)
          p.write_text(s)

          # 5) No OpenStreetMap dependency remains after selected_route_map_screen migrated to Google Maps.
          p = Path('pubspec.yaml')
          s = p.read_text()
          s = s.replace('  flutter_map: ^8.2.2\n', '')
          s = s.replace('  latlong2: ^0.9.1\n', '')
          p.write_text(s)

          # Ensure no OSM implementation is left in app code.
          offenders = []
          for f in Path('lib').rglob('*.dart'):
              t = f.read_text()
              if 'flutter_map' in t or 'openstreetmap.org' in t or 'package:latlong2' in t:
                  offenders.append(str(f))
          if offenders:
              raise SystemExit('OpenStreetMap references remain: ' + ', '.join(offenders))
          PY

          dart format lib/screens/home_shell_screen.dart lib/screens/radar_screen.dart lib/screens/camera_screen.dart lib/screens/social_events_screen.dart lib/screens/event_photo_create_screen.dart lib/services/social_event_service.dart lib/screens/selected_route_map_screen.dart || true

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'tbt-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib pubspec.yaml
          git commit -m 'fix: unify nearby events reels media and maps'
          git push origin HEAD:feature/video-v1

name: Publish TBT Eğlence relaxing Reels 20260913
on:
  workflow_dispatch:
  push:
    branches: [codex/publish-tbt-travel-20260913]
    paths:
      - '.github/workflows/publish_travel_20260913.yml'
      - 'tool/publish_travel_20260913.cjs'
      - 'tool/editorial/relaxing-videos-20260913.json'
permissions:
  contents: read
concurrency:
  group: tbt-travel-20260913
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Publish licensed relaxing aquarium videos
        run: node tool/publish_travel_20260913.cjs --publish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

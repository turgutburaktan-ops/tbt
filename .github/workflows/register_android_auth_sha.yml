name: Register Android Auth SHA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/video-v1
    paths:
      - '.github/ci/android-debug.keystore.b64'
      - '.github/workflows/register_android_auth_sha.yml'

permissions:
  contents: read

jobs:
  register:
    name: Register Firebase Android SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: en-iyi-cekim-noktasi
      FIREBASE_ANDROID_APP_ID: '1:330568532415:android:bf2ffa0b4d9210ed41a10a'
      # These must remain identical to the certificate used by every QA APK.
      TBT_SHA1: '75:8F:F2:13:89:03:3E:D2:63:75:41:5F:AD:30:E1:1F:9A:D1:F3:64'
      TBT_SHA256: '3F:9A:A4:96:CA:F1:37:EA:C1:48:CD:94:29:23:95:6D:3D:6A:2A:DA:FF:9C:DB:10:51:DE:02:40:62:81:96:25'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT', '')
          if not raw:
              raise SystemExit('FIREBASE_SERVICE_ACCOUNT secret is missing.')
          service_account = json.loads(raw)
          target = Path(os.environ['RUNNER_TEMP']) / 'firebase-service-account.json'
          target.write_text(json.dumps(service_account), encoding='utf-8')
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'GOOGLE_APPLICATION_CREDENTIALS={target}\n')
          PY

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Register stable debug SHA fingerprints
        shell: bash
        run: |
          set -euo pipefail

          firebase apps:android:sha:list "$FIREBASE_ANDROID_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" --non-interactive | tee /tmp/firebase-sha.txt

          normalize() { printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | tr -d ':'; }
          normalize_file() { tr '[:lower:]' '[:upper:]' < "$1" | tr -d ':'; }

          ensure_sha() {
            local sha="$1"
            local normalized
            normalized="$(normalize "$sha")"
            if normalize_file /tmp/firebase-sha.txt | grep -Fq "$normalized"; then
              echo "Firebase already contains $sha"
            else
              firebase apps:android:sha:create "$FIREBASE_ANDROID_APP_ID" "$sha" \
                --project "$FIREBASE_PROJECT_ID" --non-interactive
            fi
          }

          ensure_sha "$TBT_SHA1"
          ensure_sha "$TBT_SHA256"

          firebase apps:android:sha:list "$FIREBASE_ANDROID_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" --non-interactive | tee /tmp/firebase-sha-final.txt
          normalize_file /tmp/firebase-sha-final.txt | grep -Fq "$(normalize "$TBT_SHA1")"
          normalize_file /tmp/firebase-sha-final.txt | grep -Fq "$(normalize "$TBT_SHA256")"

      - name: Verify certificate bundled in CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .github/ci/android-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -v -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android | tee /tmp/keytool.txt
          grep -Fq "$TBT_SHA1" /tmp/keytool.txt
          grep -Fq "$TBT_SHA256" /tmp/keytool.txt

name: Probe Turkan Soray Video
on:
  push:
    branches: [codex/publish-sound-videos]
    paths: [.github/workflows/probe_turkan_soray.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          curl -sS --get 'https://commons.wikimedia.org/w/api.php' --data-urlencode 'action=query' --data-urlencode 'prop=imageinfo' --data-urlencode 'iiprop=extmetadata' --data-urlencode 'titles=File:Türkan Şoray & Ediz Hun, 2014.webm' --data-urlencode 'format=json'

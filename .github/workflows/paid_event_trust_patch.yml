name: Apply Paid Event Trust Safeguards

on:
  push:
    paths:
      - 'tools/paid_event_trust_patch.py'
      - '.github/workflows/paid_event_trust_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Apply paid event trust patch
        run: python3 tools/paid_event_trust_patch.py
      - name: Format changed files
        run: dart format lib/models/social_event.dart lib/services/social_event_service.dart lib/services/event_trust_service.dart lib/screens/social_events_screen.dart
      - name: Analyze changed app
        run: flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit safeguards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/models/social_event.dart lib/services/social_event_service.dart lib/services/event_trust_service.dart lib/screens/social_events_screen.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add paid event anti-fraud safeguards'
            git push
          fi

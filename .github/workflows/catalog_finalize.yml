name: Finalize shared catalog migration
on:
  push:
    branches: [codex/catalog-finalize]
permissions:
  contents: read
  actions: write
concurrency:
  group: catalog-finalize-batch
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix functions
      - run: npm install --prefix functions --no-save @firebase/rules-unit-testing firebase
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --only firestore --project demo-tbt "node --test functions/catalog/schema.test.js functions/catalog/seed.test.js functions/catalog/spot_batch.test.js" --non-interactive
      - name: Stop superseded sequential migration after successful function deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 34952853309 34954860501 34954918039 34954044820; do
            code=$(curl --silent --show-error -o /tmp/catalog-cancel-response -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/turgutburaktan-ops/tbt/actions/runs/$run/cancel)
            case "$code" in 202|409) echo 'Superseded migration stopped or already finished.' ;; *) echo "Cancellation failed: $code"; exit 1 ;; esac
          done
      - name: Reuse verified country extract from superseded import
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/catalog-country
          for attempt in $(seq 1 20); do
            if gh run download 34954044820 --repo turgutburaktan-ops/tbt -n catalog-country-report -D build/catalog-country; then break; fi
            sleep 10
          done
          test -s build/catalog-country/venues.jsonl
      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PYAUTH'
          import json, os
          from pathlib import Path
          value=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          target=Path(os.environ['RUNNER_TEMP'])/'catalog-service-account.json'
          target.write_text(json.dumps(value)); target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'GOOGLE_APPLICATION_CREDENTIALS={target}\n')
              f.write('GCLOUD_PROJECT=en-iyi-cekim-noktasi\n')
          PYAUTH
      - name: Reconcile originals and finalize all province partitions
        run: node functions/scripts/backfill_place_catalog.js --apply
      - name: Complete country import using indexed duplicate lookup
        run: node functions/scripts/seed_country_catalog.js build/catalog-country/venues.jsonl
      - name: Publish catalog-only addition to live read rules
        run: node functions/scripts/catalog_rules.js --apply
      - name: Verify ready catalog
        run: node functions/scripts/verify_place_catalog.js
      - name: Save completed catalog counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completed-catalog-report
          path: build/catalog-country/*.json
          retention-days: 7

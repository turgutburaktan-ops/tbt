name: TBT Full Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/video-v1

permissions:
  contents: write

concurrency:
  group: tbt-full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product_fixes:
    name: Apply Product Fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit_sha: ${{ steps.final_ref.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply requested UI fixes
        if: github.ref == 'refs/heads/feature/video-v1'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_requested_ui_fixes.py
          dart format lib
          if ! git diff --quiet; then
            git config user.name 'tbt-build-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add lib pubspec.yaml
            git commit -m 'fix: apply requested product UI fixes'
            git push origin HEAD:feature/video-v1
          fi
      - name: Resolve build commit
        id: final_ref
        shell: bash
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze
    needs: product_fixes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.product_fixes.outputs.commit_sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then flutter test; else echo 'No Flutter tests found.'; fi

  android:
    name: Android
    needs: product_fixes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.product_fixes.outputs.commit_sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Java 24 for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
      - run: flutter pub get
      - name: Prepare Android host
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          cp android/app/src/main/AndroidManifest.xml /tmp/tbt-AndroidManifest.xml
          rm -rf android
          flutter create --platforms=android --org com.tbt --project-name best_photo_spot .
          printf '\nandroid.builtInKotlin=false\nandroid.newDsl=false\n' >> android/gradle.properties
          cp /tmp/tbt-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 26').replace('com.tbt.best_photo_spot', 'com.tbt.social')
          gradle.write_text(text)
          for activity in Path('android/app/src/main/kotlin').rglob('MainActivity.kt'):
              source = activity.read_text().replace('package com.tbt.best_photo_spot', 'package com.tbt.social').replace('import io.flutter.embedding.android.FlutterActivity', 'import io.flutter.embedding.android.FlutterFragmentActivity').replace('FlutterActivity()', 'FlutterFragmentActivity()')
              activity.write_text(source)
          PY
          if grep -q '\${MAPS_API_KEY}' android/app/src/main/AndroidManifest.xml; then
            test -n "${MAPS_API_KEY:-}" || { echo 'MAPS_API_KEY GitHub secret is missing.'; exit 1; }
            python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml'); p.write_text(p.read_text().replace('${MAPS_API_KEY}',os.environ['MAPS_API_KEY']))
          PY
          fi
      - name: Android APK Build
        run: flutter build apk --debug --no-pub
      - name: Verify Android APK
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tbt-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS
    needs: product_fixes
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.product_fixes.outputs.commit_sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare clean iOS host
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          flutter create --platforms=ios --org com.tbt --project-name best_photo_spot .
          test -f ios/Podfile
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ios/Podfile'); s=p.read_text()
          if re.search(r"^\s*#?\s*platform :ios,\s*'[^']+'",s,flags=re.M): s=re.sub(r"^\s*#?\s*platform :ios,\s*'[^']+'","platform :ios, '15.0'",s,count=1,flags=re.M)
          else: s="platform :ios, '15.0'\n"+s
          p.write_text(s)
          PY
          rm -rf ios/Pods ios/Podfile.lock
      - name: iOS Build
        run: >-
          flutter build ios --debug --no-codesign --no-pub
          --dart-define=FIREBASE_IOS_API_KEY=ci-placeholder
          --dart-define=FIREBASE_IOS_APP_ID=1:330568532415:ios:ci-placeholder
          --dart-define=IOS_BUNDLE_ID=com.tbt.bestPhotoSpot
      - name: Verify iOS App
        run: test -d build/ios/iphoneos/Runner.app
      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: tbt-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security
    needs: product_fixes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.product_fixes.outputs.commit_sha }}
      - name: Setup Java 21 for Security
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Security gate
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|private_key_id[[:space:]]*[:=]|service_account.*\.json' -- ':!pubspec.lock' ':!.github/workflows/security_regression_check.yml' ':!.github/workflows/tbt_full_build.yml'; then exit 1; fi
          grep -q 'match /{allPaths=\*\*}' storage.rules
          grep -A2 'match /{allPaths=\*\*}' storage.rules | grep -q 'allow read, write: if false'
          grep -q 'function isAdmin()' firestore.rules
      - name: Firebase rules emulator
        run: npm install -g firebase-tools && firebase emulators:exec --only firestore --project demo-tbt "echo Firestore-rules-ok" --non-interactive
      - name: Cloud Functions audit
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts && npm audit --omit=dev --audit-level=high

  result:
    name: TBT Full Build Result
    runs-on: ubuntu-latest
    if: always()
    needs: [product_fixes, analyze, android, ios, security]
    steps:
      - name: Collect result
        shell: bash
        run: |
          echo "Analyze: ${{ needs.analyze.result }} | Android: ${{ needs.android.result }} | iOS: ${{ needs.ios.result }} | Security: ${{ needs.security.result }}"
          test "${{ needs.product_fixes.result }}" = success
          test "${{ needs.analyze.result }}" = success
          test "${{ needs.android.result }}" = success
          test "${{ needs.ios.result }}" = success
          test "${{ needs.security.result }}" = success

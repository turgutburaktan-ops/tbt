name: Buildler

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/video-v1

permissions:
  contents: read

concurrency:
  group: tbt-buildler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildler:
    name: Buildler
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: 1 · Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: 2 · Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests found.'
          fi

      - name: Setup Java 24 for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'

      - name: 3 · Prepare Android host
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/src/main/AndroidManifest.xml /tmp/tbt-AndroidManifest.xml
          rm -rf android
          flutter create --platforms=android --org com.tbt --project-name best_photo_spot .
          cp /tmp/tbt-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest.write_text(manifest.read_text().replace('${MAPS_API_KEY}', 'CI_DUMMY_MAPS_KEY'))
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
          text = text.replace('com.tbt.best_photo_spot', 'com.tbt.social')
          gradle.write_text(text)
          for activity in Path('android/app/src/main/kotlin').rglob('MainActivity.kt'):
              activity.write_text(activity.read_text().replace('package com.tbt.best_photo_spot', 'package com.tbt.social'))
          PY
          grep -q 'applicationId = "com.tbt.social"' android/app/build.gradle.kts
          grep -q 'namespace = "com.tbt.social"' android/app/build.gradle.kts

      - name: 4 · Android APK Build
        run: flutter build apk --debug --no-pub

      - name: 5 · Verify Android APK
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tbt-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: 6 · Prepare clean iOS host
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          flutter create --platforms=ios --org com.tbt --project-name best_photo_spot .
          test -f ios/Podfile
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ios/Podfile')
          s = p.read_text()
          if re.search(r"^\s*#?\s*platform :ios,\s*'[^']+'", s, flags=re.M):
              s = re.sub(r"^\s*#?\s*platform :ios,\s*'[^']+'", "platform :ios, '15.0'", s, count=1, flags=re.M)
          else:
              s = "platform :ios, '15.0'\n" + s
          p.write_text(s)
          PY
          grep -q "platform :ios, '15.0'" ios/Podfile
          rm -rf ios/Pods ios/Podfile.lock

      - name: 7 · iOS Build
        run: >-
          flutter build ios --debug --no-codesign --no-pub
          --dart-define=FIREBASE_IOS_API_KEY=ci-placeholder
          --dart-define=FIREBASE_IOS_APP_ID=1:330568532415:ios:ci-placeholder
          --dart-define=IOS_BUNDLE_ID=com.tbt.bestPhotoSpot

      - name: 8 · Verify iOS App
        run: test -d build/ios/iphoneos/Runner.app

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: tbt-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7

      - name: Setup Java 21 for Security
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 9 · Security checks
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|private_key_id[[:space:]]*[:=]|service_account.*\.json' -- ':!pubspec.lock' ':!.github/workflows/security_regression_check.yml' ':!.github/workflows/tbt_full_build.yml'; then
            echo 'Potential private key/service-account material found in tracked files.'
            exit 1
          fi
          if grep -nE 'match /\{collection\}/\{document\}.*' firestore.rules >/dev/null; then
            if grep -nE 'allow write: if signedIn\(\).*!\(collection in' firestore.rules; then
              echo 'Permissive authenticated wildcard write remains.'
              exit 1
            fi
          fi

      - name: 10 · Firebase rules emulator
        shell: bash
        run: |
          set -euo pipefail
          npm install -g firebase-tools
          firebase emulators:exec --only firestore --project demo-tbt "echo Firestore-rules-ok" --non-interactive

      - name: 11 · Cloud Functions audit
        shell: bash
        working-directory: functions
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Buildler completed
        shell: bash
        run: |
          {
            echo '## TBT Buildler ✅'
            echo ''
            echo 'Analyze + Android APK + iOS + Security tek build içinde başarıyla tamamlandı.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'TBT BUILDLER PASSED.'

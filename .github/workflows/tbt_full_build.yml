name: TBT Full Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tbt-full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        shell: bash
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: |
          set -euo pipefail
          dart pub token remove https://pub.dev >/dev/null 2>&1 || true
          rm -f "$HOME/.config/dart/pub-credentials.json" "$HOME/.pub-cache/credentials.json"
          for attempt in 1 2 3; do
            flutter pub get && exit 0
            echo "pub get attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests found.'
          fi

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Java 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
      - name: Install dependencies
        shell: bash
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: |
          set -euo pipefail
          dart pub token remove https://pub.dev >/dev/null 2>&1 || true
          rm -f "$HOME/.config/dart/pub-credentials.json" "$HOME/.pub-cache/credentials.json"
          for attempt in 1 2 3; do
            flutter pub get && exit 0
            echo "pub get attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Verify runtime secrets
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${MAPS_API_KEY:-}" || { echo 'MAPS_API_KEY GitHub secret is missing.'; exit 1; }
      - name: Install stable Android debug signing certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .github/ci/android-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | tee /tmp/tbt-debug-key.txt
          grep -Fq '75:8F:F2:13:89:03:3E:D2:63:75:41:5F:AD:30:E1:1F:9A:D1:F3:64' /tmp/tbt-debug-key.txt
          grep -Fq '3F:9A:A4:96:CA:F1:37:EA:C1:48:CD:94:29:23:95:6D:3D:6A:2A:DA:FF:9C:DB:10:51:DE:02:40:62:81:96:25' /tmp/tbt-debug-key.txt
      - name: Prepare Android host
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          cp android/app/src/main/AndroidManifest.xml /tmp/tbt-AndroidManifest.xml
          rm -rf android
          flutter create --platforms=android --org com.tbt --project-name best_photo_spot .
          printf '\nandroid.builtInKotlin=false\nandroid.newDsl=false\n' >> android/gradle.properties
          cp /tmp/tbt-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import os
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 26').replace('com.tbt.best_photo_spot', 'com.tbt.social')
          marker = '    buildTypes {\n'
          signing = '''    signingConfigs {\n        getByName("debug") {\n            storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n\n'''
          if signing not in text:
              text = text.replace(marker, signing + marker, 1)
          debug_block = '''    buildTypes {\n        getByName("debug") {\n            signingConfig = signingConfigs.getByName("debug")\n        }\n'''
          text = text.replace(marker, debug_block, 1)
          gradle.write_text(text)
          for activity in Path('android/app/src/main/kotlin').rglob('MainActivity.kt'):
              source = activity.read_text().replace('package com.tbt.best_photo_spot', 'package com.tbt.social').replace('import io.flutter.embedding.android.FlutterActivity', 'import io.flutter.embedding.android.FlutterFragmentActivity').replace('FlutterActivity()', 'FlutterFragmentActivity()')
              activity.write_text(source)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest.write_text(manifest.read_text().replace('${MAPS_API_KEY}', os.environ['MAPS_API_KEY']))
          PY
          ! grep -q '\${MAPS_API_KEY}' android/app/src/main/AndroidManifest.xml
          ! grep -q 'CI_DUMMY_MAPS_KEY' android/app/src/main/AndroidManifest.xml
      - name: Build Android APK
        run: flutter build apk --debug --no-pub
      - name: Verify APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-signing.txt
          tr '[:lower:]' '[:upper:]' < /tmp/apk-signing.txt | tr -d ':' > /tmp/apk-signing-normalized.txt
          grep -q '758FF21389033ED26375415FAD30E11F9AD1F364' /tmp/apk-signing-normalized.txt
          grep -q '3F9AA496CAF137EAC148CD942923956D3D6A2ADAFF9CDB1051DE024062819625' /tmp/apk-signing-normalized.txt
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tbt-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS Build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        shell: bash
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: |
          set -euo pipefail
          dart pub token remove https://pub.dev >/dev/null 2>&1 || true
          rm -f "$HOME/.config/dart/pub-credentials.json" "$HOME/.pub-cache/credentials.json"
          for attempt in 1 2 3; do
            flutter pub get && exit 0
            echo "pub get attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Prepare clean iOS host
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          flutter create --platforms=ios --org com.tbt --project-name best_photo_spot .
          sed -i '' 's/com\.tbt\.bestPhotoSpot/com.tbt.social/g' ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Podfile
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ios/Podfile'); s=p.read_text()
          if re.search(r"^\s*#?\s*platform :ios,\s*'[^']+'",s,flags=re.M):
              s=re.sub(r"^\s*#?\s*platform :ios,\s*'[^']+'","platform :ios, '15.0'",s,count=1,flags=re.M)
          else:
              s="platform :ios, '15.0'\n"+s
          p.write_text(s)
          info = Path('ios/Runner/Info.plist')
          plist = info.read_text()
          if 'GADApplicationIdentifier' not in plist:
              plist = plist.replace('</dict>', '  <key>GADApplicationIdentifier</key>\n  <string>ca-app-pub-3940256099942544~1458002511</string>\n</dict>')
              info.write_text(plist)
          PY
          rm -rf ios/Pods ios/Podfile.lock
      - name: Build iOS
        run: >-
          flutter build ios --debug --no-codesign --no-pub
          --dart-define=FIREBASE_IOS_API_KEY=ci-placeholder
          --dart-define=FIREBASE_IOS_APP_ID=1:330568532415:ios:ci-placeholder
          --dart-define=IOS_BUNDLE_ID=com.tbt.social
      - name: Verify iOS App
        run: test -d build/ios/iphoneos/Runner.app
      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: tbt-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security & Rules
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repository security gate
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|private_key_id[[:space:]]*[:=]|service_account.*\.json' -- ':!pubspec.lock' ':!.github/workflows/security_regression_check.yml' ':!.github/workflows/tbt_full_build.yml'; then exit 1; fi
          grep -q 'match /{allPaths=\*\*}' storage.rules
          grep -A2 'match /{allPaths=\*\*}' storage.rules | grep -q 'allow read, write: if false'
          grep -q 'function isAdmin()' firestore.rules
      - name: Firebase rules emulator
        run: npm install -g firebase-tools && firebase emulators:exec --only firestore --project demo-tbt "echo Firestore-rules-ok" --non-interactive
      - name: Cloud Functions audit
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts && npm audit --omit=dev --audit-level=high

  result:
    name: TBT Full Build Result
    runs-on: ubuntu-latest
    if: always()
    needs: [analyze, android, ios, security]
    steps:
      - name: Collect result
        shell: bash
        run: |
          echo "Analyze: ${{ needs.analyze.result }} | Android: ${{ needs.android.result }} | iOS: ${{ needs.ios.result }} | Security: ${{ needs.security.result }}"
          test "${{ needs.analyze.result }}" = success
          test "${{ needs.android.result }}" = success
          test "${{ needs.ios.result }}" = success
          test "${{ needs.security.result }}" = success

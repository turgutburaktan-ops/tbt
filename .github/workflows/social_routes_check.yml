name: Social route redesign checks
on:
  push:
    branches: [codex/social-routes-redesign]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: social-routes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 -m unittest tool.tests.test_route_album_host
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/routes_hub_screen.dart lib/screens/route_create_screen.dart lib/screens/travel_plan_detail_screen.dart lib/screens/route_album_screen.dart lib/screens/route_sharing_screen.dart lib/screens/home_shell_v3.dart lib/screens/radar_screen.dart lib/services/travel_plan_service.dart lib/models/travel_plan.dart lib/widgets/route_map_preview.dart lib/widgets/route_polls.dart
      - run: flutter test test/route_create_test.dart test/route_itinerary_test.dart test/restored_flows_test.dart
      - run: flutter build bundle --debug
      - uses: actions/upload-artifact@v4
        with:
          name: route-redesign-preview
          path: /tmp/route-create-review.png
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/route-tests @firebase/rules-unit-testing firebase firebase-tools
      - run: NODE_PATH=/tmp/route-tests/node_modules /tmp/route-tests/node_modules/.bin/firebase emulators:exec --only firestore,storage --project demo-tbt "node tool/test_social_routes.cjs" --non-interactive
  native:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.tbt --project-name best_photo_spot .
      - run: python3 tool/configure_notifications.py ios && python3 tool/configure_route_album.py ios
      - run: xcrun swiftc -frontend -parse ios/Runner/AppDelegate.swift
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.tbt --project-name best_photo_spot .
      - run: python3 tool/patch_native_photo_pipeline.py && python3 tool/configure_route_album.py android && python3 tool/configure_notifications.py android
      - run: python3 tool/patch_receive_sharing_intent.py
      - run: flutter build apk --debug

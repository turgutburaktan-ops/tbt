name: Restored app flows check
on:
  push:
    branches: [codex/restore-requested-flows]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: restored-flows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart tool/checks/restored_data_check.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/models/route_place.dart lib/services/spot_browsing.dart lib/services/profile_details_patch.dart lib/widgets/nearby_places_view.dart lib/services/profile_service.dart lib/services/user_facing_error.dart lib/screens/follow_list_screen.dart lib/screens/home_discover_screen.dart lib/screens/profile_page.dart lib/screens/profile_page_v2.dart lib/screens/user_profile_screen.dart lib/screens/chat_screen.dart lib/screens/spot_explore_screen_v2.dart lib/screens/smart_plan_screen.dart lib/widgets/categorized_search.dart lib/widgets/profile_content_navigation.dart lib/widgets/route_selection_button.dart lib/widgets/route_stop_picker.dart test/restored_flows_test.dart
      - run: flutter test test/restored_flows_test.dart test/categorized_search_test.dart test/profile_content_navigation_test.dart test/profile_name_navigation_test.dart test/discover_content_grid_test.dart
      - name: Compile complete Flutter application
        run: flutter build bundle --debug

name: Friend Device Fixes

on:
  workflow_dispatch:
  push:
    branches:
      - feature/video-v1

permissions:
  contents: write

concurrency:
  group: friend-device-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Google login and places fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_friend_device_fixes.py
          if git diff --quiet; then
            echo 'Friend-device fixes already applied.'
            exit 0
          fi
          git config user.name 'tbt-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/services/auth_service.dart lib/screens/spot_explore_screen_v2.dart
          git commit -m 'fix: make Google login robust and polish places page'
          git push origin HEAD:feature/video-v1

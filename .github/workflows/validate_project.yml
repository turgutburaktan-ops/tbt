name: Validate Project

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'stabilize/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests found yet.'
          fi

      - name: Ensure no source-rewrite workflows remain
        shell: bash
        run: |
          if grep -R -nE 'git push|contents:[[:space:]]*write' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'A workflow can still mutate repository source. Remove or isolate it.'
            exit 1
          fi

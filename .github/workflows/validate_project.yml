name: Validate Project

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/video-v1
      - 'stabilize/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Dart compatibility
        shell: bash
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests found yet.'
          fi

      - name: Block retired UI patch workflows
        shell: bash
        run: |
          retired=(
            .github/workflows/app_refresh_teal.yml
            .github/workflows/apply_purple_ui.yml
            .github/workflows/gray_social_refresh.yml
            .github/workflows/fix_profile_photo_interaction.yml
            .github/workflows/add_post_event_engagement.yml
            .github/workflows/patch_tappable_mentions.yml
            .github/workflows/patch_event_location_flow.yml
            .github/workflows/patch_instagram_profile_layout.yml
            .github/workflows/patch_route_nearby_map.yml
            .github/workflows/paid_event_trust_patch.yml
            .github/workflows/restore_nonzoom_profile_preview.yml
            .github/workflows/wire_route_planner.yml
          )
          for path in "${retired[@]}"; do
            if [ -e "$path" ]; then
              echo "Retired source-rewrite workflow returned: $path"
              exit 1
            fi
          done

name: Read-only general security audit
on:
  push:
    branches: [codex/general-security-audit-20260927]
    paths: [.github/workflows/general_security_audit.yml, tool/general_security_audit.cjs, test/general_security_audit.cjs]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          npm install --prefix functions --ignore-scripts
          npm install --prefix /tmp/audit-tests @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.12.0
      - name: Read production configuration only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          account=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          assert account['project_id']=='en-iyi-cekim-noktasi'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'audit.json'
          path.write_text(json.dumps(account));path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'GOOGLE_APPLICATION_CREDENTIALS={path}\n')
          PY
      - run: node tool/general_security_audit.cjs
      - name: Reproduce suspected flaws with synthetic emulator data only
        env:
          NODE_PATH: /tmp/audit-tests/node_modules
        run: /tmp/audit-tests/node_modules/.bin/firebase emulators:exec --only firestore,storage --project demo-tbt-general-audit "node --test test/general_security_audit.cjs" --non-interactive
      - name: Dependency risk inventory
        run: |
          npm audit --prefix functions --omit=dev --json > dependency-audit.json || true
          node -e "const d=require('./dependency-audit.json');if(d.error)throw Error('Dependency audit unavailable');console.log('DEPENDENCY_SUMMARY '+JSON.stringify({metadata:d.metadata,vulnerabilities:Object.values(d.vulnerabilities||{}).map(v=>({name:v.name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.filter(x=>typeof x==='object').map(x=>({title:x.title,url:x.url}))}))}));"
      - name: Scan tracked files for actual private-key and token material without printing secrets
        run: |
          python3 - <<'PY'
          import subprocess,re,json,pathlib
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0'); hits=[]
          patterns=[r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',r'"private_key"\s*:\s*"-----BEGIN',r'gh[pousr]_[A-Za-z0-9]{30,}',r'github_pat_[A-Za-z0-9_]{60,}']
          for name in filter(None,paths):
              p=pathlib.Path(name)
              if p.stat().st_size>5000000:continue
              try:s=p.read_text()
              except (UnicodeError,OSError):continue
              for i,line in enumerate(s.splitlines(),1):
                  if any(re.search(pattern,line) for pattern in patterns):hits.append({'file':name,'line':i})
          print('SECRET_SCAN '+json.dumps({'scannedTrackedPaths':len(paths)-1,'candidateLocations':hits}))
          PY

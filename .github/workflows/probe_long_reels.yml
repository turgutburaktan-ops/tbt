name: Probe Long Reels Candidates
on:
  push:
    branches: [codex/publish-sound-videos]
    paths: [.github/workflows/probe_long_reels.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download and inspect candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tbt-long
          curl -fL --retry 3 --max-time 180 -sS -o /tmp/tbt-long/olympos.webm 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Olympos_Antique_City_-_Antalya_-_TURKEY.webm'
          curl -fL --retry 3 --max-time 180 -sS -o /tmp/tbt-long/bozcaada.webm 'https://commons.wikimedia.org/wiki/Special:Redirect/file/BOZCAADA_TURKEY.webm'
          echo SHA256_START
          sha256sum /tmp/tbt-long/*.webm
          echo SHA256_END
          for f in olympos bozcaada; do
            echo "${f^^}_PROBE_START"
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height -of json "/tmp/tbt-long/$f.webm"
            echo "${f^^}_PROBE_END"
          done
          ffmpeg -y -v error -ss 20 -i /tmp/tbt-long/olympos.webm -frames:v 1 /tmp/tbt-long/olympos-20.jpg
          ffmpeg -y -v error -ss 55 -i /tmp/tbt-long/olympos.webm -frames:v 1 /tmp/tbt-long/olympos-55.jpg
          ffmpeg -y -v error -ss 30 -i /tmp/tbt-long/bozcaada.webm -frames:v 1 /tmp/tbt-long/bozcaada-30.jpg
          ffmpeg -y -v error -ss 80 -i /tmp/tbt-long/bozcaada.webm -frames:v 1 /tmp/tbt-long/bozcaada-80.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: tbt-long-reels-frames-v2
          path: /tmp/tbt-long/*.jpg

name: Probe Long Reels Candidates
on:
  push:
    branches: [codex/publish-sound-videos]
    paths: [.github/workflows/probe_long_reels.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download and inspect candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tbt-long
          curl -fL --retry 3 --max-time 240 -sS -o /tmp/tbt-long/yedigoller.webm 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Yedig%C3%B6ller_-_Bolu_-_TURKEY.webm'
          curl -fL --retry 3 --max-time 240 -sS -o /tmp/tbt-long/mardin.webm 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Deyrulzafaran_Monastery_-_Mardin_-_Turkey.webm'
          echo SHA256_START
          sha256sum /tmp/tbt-long/*.webm
          echo SHA256_END
          for f in yedigoller mardin; do
            echo "${f^^}_PROBE_START"
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height -of json "/tmp/tbt-long/$f.webm"
            echo "${f^^}_PROBE_END"
          done
          ffmpeg -y -v error -ss 35 -i /tmp/tbt-long/yedigoller.webm -frames:v 1 /tmp/tbt-long/yedigoller-35.jpg
          ffmpeg -y -v error -ss 90 -i /tmp/tbt-long/yedigoller.webm -frames:v 1 /tmp/tbt-long/yedigoller-90.jpg
          ffmpeg -y -v error -ss 20 -i /tmp/tbt-long/mardin.webm -frames:v 1 /tmp/tbt-long/mardin-20.jpg
          ffmpeg -y -v error -ss 70 -i /tmp/tbt-long/mardin.webm -frames:v 1 /tmp/tbt-long/mardin-70.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: tbt-long-reels-frames-v4
          path: /tmp/tbt-long/*.jpg

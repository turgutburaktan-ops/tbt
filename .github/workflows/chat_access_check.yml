name: Direct messaging and chat deletion check
on:
  push:
    branches: [codex/chat-access-and-delete]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: npm ci --prefix functions
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --only firestore --project demo-tbt "node tool/test_chat_collaboration.cjs" --non-interactive
      - run: node --check functions/index.js && node --check functions/notification_reply.js
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/chat_service.dart lib/services/chat_history_filter.dart lib/widgets/chat_delete_action.dart lib/screens/chat_inbox_screen.dart lib/screens/chat_screen.dart lib/screens/user_profile_screen.dart test/chat_access_test.dart
      - run: flutter test test/chat_access_test.dart test/chat_layout_test.dart test/profile_ios_interaction_test.dart

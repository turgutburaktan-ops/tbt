name: Upload approved Play build 29
on:
  push:
    branches: [codex/upload-play-build29]
permissions:
  contents: read
  actions: read
concurrency:
  group: play-upload-build29
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: tbt-play-release-1.0.18-code29
          run-id: 34716311591
          github-token: ${{ github.token }}
          path: play-artifact
      - name: Upload verified bundle to existing Alpha track
        env:
          PLAY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tool/upload_play_build29.cjs

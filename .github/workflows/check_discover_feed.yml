name: Check Discover Feed
on:
  workflow_dispatch:
  push:
    branches: [codex/discover-continuous-feed]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/home_discover_screen.dart lib/screens/post_detail_screen.dart lib/widgets/discover_post_feed.dart test/discover_post_feed_test.dart
      - run: flutter test test/discover_post_feed_test.dart test/discover_content_grid_test.dart

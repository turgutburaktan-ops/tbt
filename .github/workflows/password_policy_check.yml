name: Verify consistent password requirements
on:
  push:
    branches: [codex/ready-routes-20260922]
    paths:
      - lib/services/password_policy.dart
      - lib/services/auth_service.dart
      - lib/screens/register_screen.dart
      - lib/screens/password_change_screen.dart
      - lib/widgets/change_password_sheet.dart
      - test/password_policy_test.dart
      - .github/workflows/password_policy_check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/password_policy.dart lib/services/auth_service.dart lib/screens/register_screen.dart lib/screens/password_change_screen.dart lib/widgets/change_password_sheet.dart test/password_policy_test.dart
      - run: flutter test test/password_policy_test.dart

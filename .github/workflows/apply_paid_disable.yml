name: Apply Paid Event Disable

on:
  workflow_dispatch:
  push:
    branches:
      - feature/video-v1

permissions:
  contents: write

concurrency:
  group: apply-paid-disable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply free-only event mode
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/disable_paid_events.py
          if git diff --quiet; then
            echo 'Paid events already disabled.'
            exit 0
          fi
          git config user.name 'tbt-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/screens/event_create_screen_v2.dart lib/services/social_event_service.dart
          git commit -m 'fix: keep social events free-only for now'
          git push origin HEAD:feature/video-v1

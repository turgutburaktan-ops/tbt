name: Fix Profile Photo Interaction

on:
  push:
    paths:
      - '.github/workflows/fix_profile_photo_interaction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch profile grid and post detail
        shell: python
        run: |
          from pathlib import Path

          profile = Path('lib/screens/profile_page_v2.dart')
          text = profile.read_text(encoding='utf-8')

          text = text.replace("  OverlayEntry? _preview;\n\n", "")
          text = text.replace("  @override\n  void dispose() {\n    _closePreview();\n    super.dispose();\n  }\n\n", "")

          start = text.find("  void _showPreview(String url) {")
          end = text.find("  @override\n  Widget build(BuildContext context) {", start)
          if start != -1 and end != -1:
              text = text[:start] + text[end:]

          text = text.replace("                              onLongPress: () => _showPreview(imageUrl),\n", "")
          text = text.replace("  final VoidCallback onLongPress;\n", "")
          text = text.replace("    required this.onLongPress,\n", "")
          text = text.replace("        onLongPress: onLongPress,\n", "")

          old_material = """    return Material(\n      color: const Color(0xFF151A22),\n      borderRadius: BorderRadius.circular(10),\n      clipBehavior: Clip.antiAlias,\n"""
          new_material = """    return Material(\n      color: const Color(0xFF151A22),\n      shape: RoundedRectangleBorder(\n        borderRadius: BorderRadius.circular(12),\n        side: const BorderSide(\n          color: Color(0x88FFC107),\n          width: 1.4,\n        ),\n      ),\n      clipBehavior: Clip.antiAlias,\n"""
          if old_material in text:
              text = text.replace(old_material, new_material, 1)
          else:
              raise SystemExit('Profile tile material block not found')

          profile.write_text(text, encoding='utf-8')

          detail = Path('lib/screens/post_detail_screen.dart')
          text = detail.read_text(encoding='utf-8')
          old_detail = """                child: Container(\n                  color: Colors.black,\n                  child: imageUrl.isEmpty\n"""
          new_detail = """                child: Container(\n                  margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),\n                  decoration: BoxDecoration(\n                    color: Colors.black,\n                    borderRadius: BorderRadius.circular(14),\n                    border: Border.all(\n                      color: const Color(0x88FFC107),\n                      width: 1.5,\n                    ),\n                  ),\n                  clipBehavior: Clip.antiAlias,\n                  child: imageUrl.isEmpty\n"""
          if old_detail in text:
              text = text.replace(old_detail, new_detail, 1)
          else:
              raise SystemExit('Post detail image block not found')

          detail.write_text(text, encoding='utf-8')

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/profile_page_v2.dart lib/screens/post_detail_screen.dart
          git commit -m "Move zoom to post detail and restore photo frames"
          git push

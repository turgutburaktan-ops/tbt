name: Inspect venue quality endpoint
on:
  push:
    branches: [codex/inspect-mobile-business-20260915]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public endpoint without credentials
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          url='https://europe-west1-en-iyi-cekim-noktasi.cloudfunctions.net/venueQuality'
          req=urllib.request.Request(url,data=json.dumps({'data':{'action':'status','venueKey':'cafe:diagnostic'}}).encode(),headers={'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r: print(r.status,r.read().decode()[:1000])
          except urllib.error.HTTPError as e: print('ENDPOINT_STATUS',e.code,e.read().decode()[:1000])
          PY

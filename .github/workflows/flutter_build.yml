name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # =====================================================
      # 1. REPOSITORY
      # =====================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =====================================================
      # 2. JAVA
      # Flutter Android build için sabit JDK
      # =====================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =====================================================
      # 3. FLUTTER
      # =====================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # =====================================================
      # 4. GRADLE CACHE
      # Wrapper ve Gradle cache'lerini build'ler arasında korur
      # =====================================================
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # =====================================================
      # 5. ANDROID PROJECT
      # Android klasörü varsa SİLME.
      # Sadece repo'da yoksa oluştur.
      # =====================================================
      - name: Ensure Android project exists
        run: |
          echo "Android proje yapisi kontrol ediliyor..."

          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android klasoru eksik veya bozuk."
            echo "Android proje dosyalari yeniden olusturuluyor..."

            rm -rf android
            flutter create --platforms=android .
          else
            echo "Android app Gradle dosyasi mevcut."
            echo "Android proje yeniden olusturulmayacak."
          fi

          echo "Android app dosyalari:"
          find android/app -maxdepth 2 -type f | sort | head -n 50

      # =====================================================
      # 6. ANDROID SDK VERSIONS
      # Firebase / Firestore için minSdk 23
      # =====================================================
      - name: Configure Android SDK versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          gradle_kts = Path("android/app/build.gradle.kts")

          if gradle.exists():
              p = gradle
              text = p.read_text()

              text = text.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 35"
              )
              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 35"
              )

              text = text.replace(
                  "minSdkVersion flutter.minSdkVersion",
                  "minSdkVersion 23"
              )
              text = text.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 23"
              )

              p.write_text(text)

          elif gradle_kts.exists():
              p = gradle_kts
              text = p.read_text()

              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 35"
              )

              text = text.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 23"
              )

              p.write_text(text)

          else:
              raise Exception("Android app Gradle file bulunamadi")

          print("Android SDK ayarlari tamamlandi.")
          PY

      # =====================================================
      # 7. FIREBASE JSON
      # =====================================================
      - name: Add Firebase config
        run: |
          echo "===== FIREBASE CONFIG SEARCH ====="

          FIREBASE_FILE=$(find . -maxdepth 5 -type f -iname "*google*services*.json" \
            ! -path "./android/app/google-services.json" | head -n 1)

          if [ -z "$FIREBASE_FILE" ] && [ -f "android/app/google-services.json" ]; then
            FIREBASE_FILE="android/app/google-services.json"
          fi

          echo "Found Firebase file: $FIREBASE_FILE"

          if [ -z "$FIREBASE_FILE" ]; then
            echo "ERROR: google-services.json bulunamadi."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          mkdir -p android/app

          if [ "$FIREBASE_FILE" != "android/app/google-services.json" ]; then
            cp "$FIREBASE_FILE" android/app/google-services.json
          fi

          echo "Firebase config ready:"
          ls -la android/app/google-services.json

      # =====================================================
      # 8. GOOGLE SERVICES GRADLE PLUGIN
      # =====================================================
      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          settings_kts = Path("android/settings.gradle.kts")

          app_gradle = Path("android/app/build.gradle")
          app_gradle_kts = Path("android/app/build.gradle.kts")

          if settings.exists():
              text = settings.read_text()

              if 'com.google.gms.google-services' not in text:
                  marker = 'plugins {'

                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + '\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                          1
                      )
                  else:
                      raise Exception("settings.gradle plugins blogu bulunamadi")

                  settings.write_text(text)

          elif settings_kts.exists():
              text = settings_kts.read_text()

              if 'com.google.gms.google-services' not in text:
                  marker = 'plugins {'

                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + '\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                          1
                      )
                  else:
                      raise Exception("settings.gradle.kts plugins blogu bulunamadi")

                  settings_kts.write_text(text)

          else:
              raise Exception("Android settings Gradle dosyasi bulunamadi")

          if app_gradle.exists():
              text = app_gradle.read_text()

              if 'id "com.google.gms.google-services"' not in text:
                  marker = 'plugins {'
                  text = text.replace(
                      marker,
                      marker + '\n    id "com.google.gms.google-services"',
                      1
                  )
                  app_gradle.write_text(text)

          elif app_gradle_kts.exists():
              text = app_gradle_kts.read_text()

              if 'id("com.google.gms.google-services")' not in text:
                  marker = 'plugins {'
                  text = text.replace(
                      marker,
                      marker + '\n    id("com.google.gms.google-services")',
                      1
                  )
                  app_gradle_kts.write_text(text)

          else:
              raise Exception("Android app Gradle dosyasi bulunamadi")

          print("Firebase Google Services Gradle plugin hazir.")
          PY

      # =====================================================
      # 9. CAMERA + LOCATION + GOOGLE MAPS
      # =====================================================
      - name: Configure Android permissions and Google Maps
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise Exception("AndroidManifest.xml bulunamadi.")

          text = p.read_text()

          wanted = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
          ]

          permissions = [
              permission
              for permission in wanted
              if permission not in text
          ]

          if permissions:
              permission_text = "\n".join(permissions)
              text = text.replace(
                  "<application",
                  permission_text + "\n\n    <application",
                  1
              )

          maps_key = os.environ.get("MAPS_API_KEY", "").strip()

          if not maps_key:
              raise Exception("GitHub Secret MAPS_API_KEY bulunamadi.")

          if "com.google.android.geo.API_KEY" not in text:
              maps_config = f'''
              <meta-data
                  android:name="com.google.android.geo.API_KEY"
                  android:value="{maps_key}" />
              '''

              application_start = text.find("<application")

              if application_start == -1:
                  raise Exception("AndroidManifest application etiketi bulunamadi.")

              application_end = text.find(">", application_start)

              text = (
                  text[:application_end + 1]
                  + maps_config
                  + text[application_end + 1:]
              )

          p.write_text(text)

          print("Android permissions ve Google Maps ayarlari tamamlandi.")
          PY

      # =====================================================
      # 10. FLUTTER DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: flutter pub get

      # =====================================================
      # 11. PACKAGE NAME
      # =====================================================
      - name: Show Android Package Name
        run: |
          echo "===================================="
          echo "ANDROID PACKAGE NAME"
          echo "===================================="

          if [ -f android/app/build.gradle ]; then
            grep -E "applicationId|namespace" android/app/build.gradle || true
          fi

          if [ -f android/app/build.gradle.kts ]; then
            grep -E "applicationId|namespace" android/app/build.gradle.kts || true
          fi

          echo "===================================="

      # =====================================================
      # 12. DEBUG KEYSTORE
      # =====================================================
      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android

          if [ ! -f ~/.android/debug.keystore ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # =====================================================
      # 13. SHOW SHA-1
      # =====================================================
      - name: Show SHA1 Fingerprint
        run: |
          echo "===================================="
          echo "SHA-1 CERTIFICATE FINGERPRINT"
          echo "===================================="

          keytool \
            -list \
            -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

          echo "===================================="

      # =====================================================
      # 14. FLUTTER ANALYZE
      # =====================================================
      - name: Flutter Analyze
        run: |
          rm -rf test
          flutter analyze --no-fatal-infos --no-fatal-warnings

      # =====================================================
      # 15. BUILD APK WITH RETRY
      # Gradle sunucu bağlantısı koparsa otomatik yeniden dener.
      # =====================================================
      - name: Build APK
        shell: bash
        run: |
          set +e

          BUILD_OK=0

          for ATTEMPT in 1 2 3; do
            echo "===================================="
            echo "APK BUILD ATTEMPT: $ATTEMPT / 3"
            echo "===================================="

            flutter build apk --release
            RESULT=$?

            if [ $RESULT -eq 0 ]; then
              BUILD_OK=1
              break
            fi

            echo ""
            echo "Build failed. Gradle indirme/cache temizligi yapiliyor..."
            echo ""

            # Yarım kalan Gradle wrapper indirmelerini temizle.
            find ~/.gradle/wrapper/dists \
              -type f \( -name "*.part" -o -name "*.lck" \) \
              -delete 2>/dev/null || true

            # Gradle daemon varsa kapat.
            if [ -f android/gradlew ]; then
              (cd android && ./gradlew --stop) || true
            fi

            if [ $ATTEMPT -lt 3 ]; then
              WAIT=$((ATTEMPT * 15))
              echo "$WAIT saniye bekleniyor..."
              sleep "$WAIT"
            fi
          done

          if [ $BUILD_OK -ne 1 ]; then
            echo "ERROR: APK build 3 denemede de basarisiz oldu."
            exit 1
          fi

          echo "APK build basarili."

      # =====================================================
      # 16. VERIFY APK
      # =====================================================
      - name: Verify APK
        run: |
          echo "===================================="
          echo "APK OUTPUT"
          echo "===================================="

          ls -lh build/app/outputs/flutter-apk/

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK successfully created."
          echo "===================================="

      # =====================================================
      # 17. VERIFY APK CERTIFICATE
      # =====================================================
      - name: Verify Release APK Certificate
        run: |
          echo "===================================="
          echo "REAL APK CERTIFICATE"
          echo "===================================="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          echo "Using apksigner: $APKSIGNER"

          "$APKSIGNER" verify \
            --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

          echo "===================================="

      # =====================================================
      # 18. UPLOAD APK
      # =====================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: en-iyi-cekim-noktasi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --platforms=android .
          - name: Set Android min SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")

          text = p.read_text()

          text = text.replace(
              "minSdkVersion flutter.minSdkVersion",
              "minSdkVersion 23"
          )

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          p.write_text(text)

          print("Android minSdk set to 23")
          PY
      - name: Add Firebase config
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== REPOSITORY FILES ====="
          ls -la

          echo "===== FIREBASE FOLDER ====="
          ls -la firebase || true

          echo "===== SEARCH GOOGLE SERVICES ====="
          FIREBASE_FILE=$(find . -maxdepth 4 -type f -iname "*google*services*.json" | head -n 1)

          echo "Found file: $FIREBASE_FILE"

          if [ -z "$FIREBASE_FILE" ]; then
            echo "ERROR: google-services.json bulunamadi"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          mkdir -p android/app

          cp "$FIREBASE_FILE" android/app/google-services.json

          echo "===== COPIED SUCCESSFULLY ====="
          ls -la android/app/google-services.json
      - name: Configure Android permissions and Google Maps
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permissions = """    <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.INTERNET"/>
          """

          text = text.replace(
              '<application',
              permissions + '\n    <application',
              1
          )

          maps_key = os.environ["MAPS_API_KEY"]

          maps_config = f"""
              <meta-data
                  android:name="com.google.android.geo.API_KEY"
                  android:value="{maps_key}" />
          """

          activity_position = text.find("<activity")

          text = (
              text[:activity_position]
              + maps_config
              + "\n        "
              + text[activity_position:]
          )

          p.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      # PACKAGE NAME'I GOSTER
      - name: Show Android Package Name
        run: |
          echo "========================================"
          echo "ANDROID PACKAGE NAME"
          echo "========================================"
          grep -R "applicationId" android/app/build.gradle* || true
          grep -R "namespace" android/app/build.gradle* || true
          echo "========================================"

      # DEBUG KEYSTORE OLUSTUR
      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android

          keytool -genkeypair \
            -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # SHA-1 BILGISINI GOSTER
      - name: Show SHA1 Fingerprint
        run: |
          echo "========================================"
          echo "SHA-1 CERTIFICATE FINGERPRINT"
          echo "========================================"

          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

          echo "========================================"

      - name: Build APK
        run: flutter build apk --release

      - name: Verify Release APK Certificate
        run: |
          echo "========================================"
          echo "REAL APK CERTIFICATE"
          echo "========================================"

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: en-iyi-cekim-noktasi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

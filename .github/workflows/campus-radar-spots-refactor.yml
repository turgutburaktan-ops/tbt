name: Campus Radar Spots Refactor

on:
  push:
    branches: [feature/video-v1]

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-v1
      - name: Apply requested refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing target: {label}')
              return text.replace(old, new, 1)

          # 1) Campus profile: class becomes a controlled selection.
          p = Path('lib/screens/campus_profile_screen.dart')
          s = p.read_text()
          s = replace_once(s,
              "  final _classYear = TextEditingController();\n",
              "  String? _classYear;\n\n  static const _classYears = <String>[\n    'Hazırlık', '1', '2', '3', '4', '5', '6', 'Mezun',\n  ];\n",
              'campus class field')
          s = s.replace("    _classYear.dispose();\n", "")
          s = replace_once(s,
              "        classYear: _classYear.text,\n",
              "        classYear: _classYear ?? '',\n",
              'campus class save')
          old_field = "          TextField(controller: _classYear, decoration: const InputDecoration(labelText: 'Sınıf', hintText: 'Hazırlık, 1, 2, 3, 4…', prefixIcon: Icon(Icons.badge_outlined))),\n"
          new_field = "          DropdownButtonFormField<String>(\n            initialValue: _classYear,\n            decoration: const InputDecoration(\n              labelText: 'Sınıf',\n              hintText: 'Sınıfını seç',\n              prefixIcon: Icon(Icons.badge_outlined),\n            ),\n            items: _classYears\n                .map((value) => DropdownMenuItem(value: value, child: Text(value == 'Mezun' ? 'Mezun' : value == 'Hazırlık' ? 'Hazırlık' : '$value. Sınıf')))\n                .toList(),\n            onChanged: (value) => setState(() => _classYear = value),\n          ),\n"
          s = replace_once(s, old_field, new_field, 'campus class dropdown')
          s = replace_once(s,
              "    if (_interests.length < 3) {\n",
              "    if (_classYear == null || _classYear!.isEmpty) {\n      _message('Sınıfını seçmelisin.');\n      return;\n    }\n    if (_interests.length < 3) {\n",
              'campus class validation')
          p.write_text(s)

          # 2) Profile service persists explicit campus eligibility.
          p = Path('lib/services/profile_service.dart')
          s = p.read_text()
          marker = "    final cleanInterests = interests\n        .map((item) => item.trim())\n        .where((item) => item.isNotEmpty)\n        .toSet()\n        .take(12)\n        .toList();\n\n"
          inject = marker + "    final cleanClassYear = classYear.trim();\n    const activeStudentYears = <String>{'Hazırlık', '1', '2', '3', '4', '5', '6'};\n    final campusEligible = university.trim().isNotEmpty && activeStudentYears.contains(cleanClassYear);\n\n"
          s = replace_once(s, marker, inject, 'campus eligibility calc')
          s = s.replace("      'classYear': classYear.trim(),\n", "      'classYear': cleanClassYear,\n", 1)
          s = replace_once(s,
              "      'campusProfileCompleted': university.trim().isNotEmpty && department.trim().isNotEmpty && cleanInterests.length >= 3,\n",
              "      'campusProfileCompleted': university.trim().isNotEmpty && department.trim().isNotEmpty && cleanInterests.length >= 3,\n      'campusEligible': campusEligible,\n      'studentStatus': campusEligible ? 'student' : (cleanClassYear == 'Mezun' ? 'graduate' : 'unknown'),\n",
              'campus eligibility fields')
          p.write_text(s)

          # 3) Campus route itself is closed for graduates/non-students.
          p = Path('lib/screens/campus_home_screen.dart')
          s = p.read_text()
          needle = "        final classYear = (data['classYear'] ?? '').toString().trim();\n        final interests = (data['interests'] as List? ?? const []).map((e) => e.toString()).toList();\n"
          replacement = "        final classYear = (data['classYear'] ?? '').toString().trim();\n        const activeStudentYears = <String>{'Hazırlık', '1', '2', '3', '4', '5', '6'};\n        final campusEligible = university.isNotEmpty && activeStudentYears.contains(classYear);\n        final interests = (data['interests'] as List? ?? const []).map((e) => e.toString()).toList();\n"
          s = replace_once(s, needle, replacement, 'campus home eligibility')
          gate_anchor = "        if (university.isEmpty) {\n"
          gate = "        if (!campusEligible && university.isNotEmpty) {\n          return Scaffold(\n            backgroundColor: bg,\n            appBar: AppBar(title: const Text('Kampüs'), backgroundColor: bg),\n            body: const Center(\n              child: Padding(\n                padding: EdgeInsets.all(28),\n                child: Column(mainAxisSize: MainAxisSize.min, children: [\n                  Icon(Icons.lock_outline_rounded, size: 58, color: Colors.white38),\n                  SizedBox(height: 16),\n                  Text('Kampüs yalnız aktif üniversite öğrencilerine açık', textAlign: TextAlign.center, style: TextStyle(fontSize: 20, fontWeight: FontWeight.w900)),\n                  SizedBox(height: 8),\n                  Text('Hazırlık ile 6. sınıf arasındaki öğrenciler Kampüs alanını kullanabilir. Mezun hesaplarda Kampüs kapalıdır.', textAlign: TextAlign.center, style: TextStyle(color: Colors.white60, height: 1.4)),\n                ]),\n              ),\n            ),\n          );\n        }\n\n" + gate_anchor
          s = replace_once(s, gate_anchor, gate, 'campus direct access gate')
          p.write_text(s)

          # 4) Nearby becomes Radar / Events / Campus for eligible students only.
          p = Path('lib/screens/home_shell_screen.dart')
          s = p.read_text()
          if "import 'package:cloud_firestore/cloud_firestore.dart';" not in s:
              s = s.replace("import 'package:firebase_auth/firebase_auth.dart';\n", "import 'package:cloud_firestore/cloud_firestore.dart';\nimport 'package:firebase_auth/firebase_auth.dart';\n", 1)
          if "import 'campus_home_screen.dart';" not in s:
              s = s.replace("import 'camera_screen.dart';\n", "import 'camera_screen.dart';\nimport 'campus_home_screen.dart';\n", 1)
          pattern = re.compile(r"class _NearbyHub extends StatefulWidget \{.*?\nclass _AuthAwareFeed", re.S)
          new_block = r'''class _NearbyHub extends StatefulWidget {
  const _NearbyHub();

  @override
  State<_NearbyHub> createState() => _NearbyHubState();
}

class _NearbyHubState extends State<_NearbyHub> {
  int _section = 0;

  bool _campusEligible(Map<String, dynamic> data) {
    const activeYears = <String>{'Hazırlık', '1', '2', '3', '4', '5', '6'};
    final university = (data['university'] ?? '').toString().trim();
    final classYear = (data['classYear'] ?? '').toString().trim();
    return university.isNotEmpty && activeYears.contains(classYear);
  }

  @override
  Widget build(BuildContext context) {
    return StreamBuilder<User?>(
      stream: FirebaseAuth.instance.authStateChanges(),
      initialData: FirebaseAuth.instance.currentUser,
      builder: (context, authSnap) {
        final user = authSnap.data;
        if (user == null) return _buildHub(false);
        return StreamBuilder<DocumentSnapshot<Map<String, dynamic>>>(
          stream: FirebaseFirestore.instance.collection('users').doc(user.uid).snapshots(),
          builder: (context, profileSnap) {
            final eligible = _campusEligible(profileSnap.data?.data() ?? const <String, dynamic>{});
            return _buildHub(eligible);
          },
        );
      },
    );
  }

  Widget _buildHub(bool campusEligible) {
    final labels = campusEligible
        ? const ['Radar', 'Etkinlikler', 'Kampüs']
        : const ['Radar', 'Etkinlikler'];
    final effectiveSection = _section >= labels.length ? 0 : _section;
    final pages = <Widget>[
      const RadarScreen(embedded: true),
      const EventsHubScreen(),
      if (campusEligible) const CampusHomeScreen(),
    ];

    return ColoredBox(
      color: AppColors.background,
      child: SafeArea(
        bottom: false,
        child: Column(
          children: [
            const Padding(
              padding: EdgeInsets.fromLTRB(14, 10, 14, 7),
              child: Row(
                children: [
                  _GradientIcon(icon: Icons.near_me_rounded, size: 22),
                  SizedBox(width: 9),
                  Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('Çevrende', style: TextStyle(fontSize: 22, fontWeight: FontWeight.w900, letterSpacing: -.35)),
                        Text('Radar, etkinlikler ve öğrencilere özel kampüs.', style: TextStyle(color: Color(0x75FFFFFF), fontSize: 11.5)),
                      ],
                    ),
                  ),
                ],
              ),
            ),
            Padding(
              padding: const EdgeInsets.fromLTRB(14, 0, 14, 7),
              child: _NearbyTabStrip(
                labels: labels,
                selected: effectiveSection,
                onChanged: (value) => setState(() => _section = value),
              ),
            ),
            Expanded(child: IndexedStack(index: effectiveSection, children: pages)),
          ],
        ),
      ),
    );
  }
}

class _NearbyTabStrip extends StatelessWidget {
  final List<String> labels;
  final int selected;
  final ValueChanged<int> onChanged;

  const _NearbyTabStrip({required this.labels, required this.selected, required this.onChanged});

  @override
  Widget build(BuildContext context) => Container(
        padding: const EdgeInsets.all(3),
        decoration: BoxDecoration(
          color: AppColors.surface,
          borderRadius: BorderRadius.circular(13),
          border: Border.all(color: AppColors.border),
        ),
        child: Row(
          children: List.generate(labels.length, (index) {
            final active = selected == index;
            return Expanded(
              child: InkWell(
                onTap: () => onChanged(index),
                borderRadius: BorderRadius.circular(10),
                child: AnimatedContainer(
                  duration: const Duration(milliseconds: 180),
                  padding: const EdgeInsets.symmetric(vertical: 8),
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(10),
                    gradient: active ? AppColors.accentGradient : null,
                  ),
                  child: Text(
                    labels[index],
                    textAlign: TextAlign.center,
                    style: TextStyle(
                      color: active ? const Color(0xFF08090D) : const Color(0xB8FFFFFF),
                      fontSize: 11.5,
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                ),
              ),
            );
          }),
        ),
      );
}

class _AuthAwareFeed'''
          s2, count = pattern.subn(new_block, s, count=1)
          if count != 1:
              raise SystemExit('Could not replace NearbyHub block')
          p.write_text(s2)

          # 5) Radar: remove shooting opportunities and shooting count from UI.
          p = Path('lib/screens/radar_screen.dart')
          s = p.read_text()
          old_section = "                      const SizedBox(height: 20),\n                      Row(\n                        children: [\n                          const Expanded(\n                            child: _SectionHeading(\n                              title: 'Çekim fırsatları',\n                              subtitle: 'Doğru noktayı hızlı bul',\n                            ),\n                          ),\n                          _SpotModeButton(\n                            label: 'Yakındakiler',\n                            selected: _spotMode == 0,\n                            onTap: () => setState(() => _spotMode = 0),\n                          ),\n                          const SizedBox(width: 5),\n                          _SpotModeButton(\n                            label: 'Popüler',\n                            selected: _spotMode == 1,\n                            onTap: () => setState(() => _spotMode = 1),\n                          ),\n                        ],\n                      ),\n                      const SizedBox(height: 9),\n                      _spotSection(),\n"
          s = replace_once(s, old_section, "", 'radar shooting section')
          s = s.replace("    final spots = _visibleSpots.length;\n", "", 1)
          metric = "          const SizedBox(width: 10),\n          _compactMetric(Icons.photo_camera_outlined, '$spots çekim'),\n"
          s = replace_once(s, metric, "", 'radar shooting metric')
          p.write_text(s)

          # 6) Move the shooting guidance emphasis into place detail.
          p = Path('lib/screens/spot_detail_screen.dart')
          s = p.read_text()
          anchor = "                  _InfoCard(\n                    text: spot.description.trim().isEmpty\n                        ? 'Bu yer gezi kataloğunda öne çıkan duraklardan biri. Detaylar doğrulandıkça gezi bilgileri genişletilecek.'\n                        : spot.description.trim(),\n                  ),\n                  const SizedBox(height: 18),\n"
          insert = anchor + "                  InkWell(\n                    borderRadius: BorderRadius.circular(17),\n                    onTap: () => _openActionSheet(\n                      context,\n                      title: 'Burada fotoğrafı nasıl çekersin?',\n                      child: ShootingGuideSection(spot: spot),\n                    ),\n                    child: Container(\n                      width: double.infinity,\n                      padding: const EdgeInsets.all(16),\n                      decoration: BoxDecoration(\n                        color: const Color(0xFF121416),\n                        borderRadius: BorderRadius.circular(17),\n                        border: Border.all(color: Colors.white10),\n                      ),\n                      child: Row(\n                        children: [\n                          const CircleAvatar(\n                            backgroundColor: Color(0xFF1B1E22),\n                            child: Icon(Icons.photo_camera_outlined, color: Color(0xFFB7BCC2)),\n                          ),\n                          const SizedBox(width: 12),\n                          Expanded(\n                            child: Column(\n                              crossAxisAlignment: CrossAxisAlignment.start,\n                              children: [\n                                Text('Burada fotoğrafı nasıl çekersin?', style: TextStyle(fontSize: 15, fontWeight: FontWeight.w900)),\n                                SizedBox(height: 4),\n                                Text('En iyi açı, ışık, saat ve lens önerisini gör.', style: TextStyle(color: Colors.white60, fontSize: 12)),\n                              ],\n                            ),\n                          ),\n                          Icon(Icons.chevron_right_rounded, color: Colors.white54),\n                        ],\n                      ),\n                    ),\n                  ),\n                  const SizedBox(height: 18),\n"
          s = replace_once(s, anchor, insert, 'spot shooting guide card')
          p.write_text(s)
          PY
      - name: Format touched Dart files
        run: dart format lib/screens/campus_profile_screen.dart lib/services/profile_service.dart lib/screens/campus_home_screen.dart lib/screens/home_shell_screen.dart lib/screens/radar_screen.dart lib/screens/spot_detail_screen.dart
      - name: Commit requested changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/campus_profile_screen.dart lib/services/profile_service.dart lib/screens/campus_home_screen.dart lib/screens/home_shell_screen.dart lib/screens/radar_screen.dart lib/screens/spot_detail_screen.dart
          git commit -m 'feat: student-only campus and move shooting guidance to places'
          git push origin HEAD:feature/video-v1

name: Apply Purple UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_purple_ui.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply purple palette outside Camera and Iris
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('lib/screens'), Path('lib/widgets')]
          replacements = {
              '0xFFFFC107': '0xFF8B5CF6',
              '0x22FFC107': '0x228B5CF6',
              '0x33FFC107': '0x338B5CF6',
              '0x44FFC107': '0x448B5CF6',
              '0x66FFC107': '0x668B5CF6',
              '0x88FFC107': '0x888B5CF6',
              '0xFFFFD54F': '0xFFA78BFA',
              '0xFF0D1117': '0xFF090812',
              '0xFF080B10': '0xFF090812',
              '0xFF151A22': '0xFF141126',
              '0xFF171C24': '0xFF141126',
              '0xFF202833': '0xFF1C1733',
              '0xFF222831': '0xFF1C1733',
              '0xFF252B34': '0xFF241D3D',
          }

          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.dart'):
                  low = path.name.lower()
                  if 'camera' in low or 'iris' in low:
                      continue
                  text = path.read_text(encoding='utf-8')
                  original = text
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))

          print('Purple UI updated files:')
          print('\n'.join(changed) if changed else 'No replacements needed')
          PY

      - name: Commit purple UI migration
        run: |
          if git diff --quiet; then
            echo "No UI color changes"
            exit 0
          fi
          git config user.name "turgutburaktan-ops"
          git config user.email "turgutburaktan@gmail.com"
          git add lib/screens lib/widgets
          git commit -m "Apply purple palette across app UI"
          git push

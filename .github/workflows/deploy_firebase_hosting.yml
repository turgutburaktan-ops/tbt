name: Deploy Firebase Invite Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hosting/**'
      - 'firebase.json'
      - '.github/workflows/deploy_firebase_hosting.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT', '')
          if not raw:
              raise SystemExit('FIREBASE_SERVICE_ACCOUNT secret is missing.')
          service_account = json.loads(raw)
          target = Path(os.environ['RUNNER_TEMP']) / 'firebase-service-account.json'
          target.write_text(json.dumps(service_account), encoding='utf-8')
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'GOOGLE_APPLICATION_CREDENTIALS={target}\n')
          PY

      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Hosting
        run: firebase deploy --only hosting --project en-iyi-cekim-noktasi --non-interactive

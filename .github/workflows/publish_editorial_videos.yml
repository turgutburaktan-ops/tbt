name: Publish TBT Editorial Videos
on:
  workflow_dispatch:
  push:
    branches: [codex/publish-editorial-videos]
permissions:
  contents: read
concurrency:
  group: tbt-editorial-videos
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - run: node tool/publish_editorial_videos.cjs --publish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

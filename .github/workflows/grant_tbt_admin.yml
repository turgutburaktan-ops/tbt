name: Grant TBT Admin

on:
  push:
    branches:
      - feature/video-v1
    paths:
      - '.github/workflows/grant_tbt_admin.yml'
  workflow_dispatch:
    inputs:
      admin_email:
        description: 'Firebase Auth email to grant admin access'
        required: false
        type: string

permissions:
  contents: read

jobs:
  grant-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@13

      - name: Grant owner access and verify profile
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_EMAIL: ${{ inputs.admin_email || 'turgutburaktan@gmail.com' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin = require('firebase-admin');

          const raw = process.env.FIREBASE_SERVICE_ACCOUNT || '';
          const email = (process.env.ADMIN_EMAIL || '').trim().toLowerCase();
          if (!raw) throw new Error('FIREBASE_SERVICE_ACCOUNT secret is missing.');
          if (!email || !email.includes('@')) throw new Error('A valid admin email is required.');

          const serviceAccount = JSON.parse(raw);
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
          });

          (async () => {
            const user = await admin.auth().getUserByEmail(email);
            const current = user.customClaims || {};
            await admin.auth().setCustomUserClaims(user.uid, {
              ...current,
              admin: true,
              verified: true,
            });

            const db = admin.firestore();
            const username = 't.buraktan';
            const usernameRef = db.collection('usernames').doc(username);
            const userRef = db.collection('users').doc(user.uid);

            await db.runTransaction(async (transaction) => {
              const reservation = await transaction.get(usernameRef);
              if (reservation.exists && reservation.data()?.uid !== user.uid) {
                throw new Error(`@${username} is reserved by another Firebase user.`);
              }

              const now = admin.firestore.FieldValue.serverTimestamp();
              transaction.set(usernameRef, {
                uid: user.uid,
                username,
                normalized: username,
                verified: true,
                verificationStatus: 'verified',
                updatedAt: now,
                ...(!reservation.exists ? {createdAt: now} : {}),
              }, {merge: true});
              transaction.set(userRef, {
                uid: user.uid,
                email,
                username,
                usernameNormalized: username,
                verified: true,
                verificationStatus: 'verified',
                verifiedAt: now,
                phoneVerified: true,
                phoneVerificationBypass: 'owner-admin-recovery',
                phoneVerifiedAt: now,
                updatedAt: now,
              }, {merge: true});
            });

            console.log(`Owner access and @${username} verification granted to Firebase user ${user.uid.slice(0, 6)}…`);
          })().catch((error) => {
            console.error(error?.message || error);
            process.exit(1);
          });
          NODE

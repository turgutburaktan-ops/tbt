name: Chat menu and camera flash checks
on:
  push:
    branches: [codex/chat-flash-fix-20260925]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/main_camera_screen.dart lib/screens/chat_screen.dart
      - run: flutter test test/camera_share_controls_test.dart test/chat_layout_test.dart test/chat_access_test.dart
      - run: flutter build bundle --debug

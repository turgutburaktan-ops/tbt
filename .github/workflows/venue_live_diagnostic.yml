name: Venue live source diagnostic
on:
  push:
    branches: [codex/venue-live-diagnostic]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify GET for dining and cafes
        shell: python
        run: |
          import urllib.request, urllib.parse, json, time, concurrent.futures
          def check(category):
            filters = ['["amenity"~"^(cafe|ice_cream|juice_bar)$"]','["shop"~"^(coffee|pastry|confectionery|tea|chocolate)$"]'] if category=='cafe' else ['["amenity"~"^(restaurant|fast_food|food_court|bar|pub|biergarten|bbq)$"]','["shop"~"^(bakery|deli|butcher|seafood|cheese|pasta|convenience)$"]']
            q='[out:json][timeout:45];area["ISO3166-2"="TR-23"]["admin_level"="4"]->.province;.province out ids;('+''.join('nwr(area.province)'+f+'["name"];' for f in filters)+');out center tags;'
            start=time.monotonic()
            try:
              request=urllib.request.Request('https://overpass.kumi.systems/api/interpreter?'+urllib.parse.urlencode({'data':q}),headers={'User-Agent':'TBT-mobile/0.1 (city places)','Accept':'application/json'})
              with urllib.request.urlopen(request, timeout=60) as r: d=json.load(r)
              e=d.get('elements',[])
              print(json.dumps({'category':category,'seconds':round(time.monotonic()-start,1),'remark':d.get('remark'),'boundary':any(x.get('type')=='area' for x in e),'count':sum(bool(x.get('tags',{}).get('name')) for x in e)},ensure_ascii=False),flush=True)
              assert not d.get('remark') and any(x.get('type')=='area' for x in e)
            except Exception as e:
              print(json.dumps({'category':category,'error':str(e)}),flush=True)
              raise
          for category in ['cafe','dining']: check(category)

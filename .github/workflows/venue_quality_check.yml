name: Venue quality checks
on:
  push:
    branches: [codex/reputation-role-system]
    paths:
      - 'functions/venue_quality*'
      - 'functions/test/venue_quality*'
      - 'lib/**'
      - 'test/day_plan_engine_test.dart'
      - 'test/nearby_venue_loading_test.dart'
      - '.github/workflows/venue_quality_check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test functions/test/venue_quality.test.js
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze venue quality screens
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/venue_quality_service.dart lib/widgets/venue_quality_section.dart lib/widgets/venue_quality_badge.dart lib/screens/venue_quality_admin_screen.dart lib/widgets/venue_reviews_section.dart lib/screens/business_profile_screen.dart lib/widgets/nearby_places_view.dart lib/screens/admin_portal_screen.dart
      - name: Analyze daily planning
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/day_plan_engine.dart lib/services/day_plan_service.dart lib/screens/today_plan_screen.dart lib/models/travel_plan.dart lib/services/travel_plan_service.dart lib/services/travel_plan_collaboration_service.dart lib/services/nearby_venue_service.dart lib/screens/travel_plan_detail_screen.dart lib/screens/travel_plans_screen.dart lib/screens/route_planner_screen.dart lib/screens/home_shell_v3.dart lib/screens/offline_travel_plans_screen.dart lib/screens/public_travel_plans_screen.dart
      - name: Test route feasibility and city isolation
        run: flutter test test/day_plan_engine_test.dart test/nearby_venue_loading_test.dart
      - name: Analyze avatar and popup surfaces with comment previews
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/chat_inbox_screen.dart lib/screens/chat_screen.dart lib/screens/create_group_screen.dart lib/screens/event_memories_screen.dart lib/screens/feed_screen.dart lib/screens/follow_list_screen.dart lib/screens/guest_home_screen.dart lib/screens/home_discover_screen.dart lib/screens/managed_venues_screen.dart lib/screens/map_screen.dart lib/screens/notifications_screen.dart lib/screens/post_detail_screen.dart lib/screens/profile_page.dart lib/screens/profile_page_v2.dart lib/screens/settings_screen.dart lib/screens/social_connections_screen.dart lib/screens/social_events_screen.dart lib/screens/story_photo_editor_screen.dart lib/screens/travel_plan_invite_screen.dart lib/screens/user_profile_screen.dart lib/theme/app_theme.dart lib/widgets/chat_collaboration_controls.dart lib/widgets/content_engagement_bar.dart lib/widgets/share_recipient_picker.dart lib/widgets/spot_presence_section.dart lib/widgets/story_strip.dart

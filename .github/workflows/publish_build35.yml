name: Publish TBT 1.0.18 build 35
on:
  push:
    branches: [codex/publish-1.0.18-build35]
permissions:
  contents: read
concurrency:
  group: tbt-store-release-35
  cancel-in-progress: false
jobs:
  android:
    uses: ./.github/workflows/android_play_release.yml
    secrets: inherit
  ios:
    uses: ./.github/workflows/ios_testflight_release.yml
    secrets: inherit
  submit-ios:
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit verified iOS replacement for review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: node tool/submit_ios_build35.cjs

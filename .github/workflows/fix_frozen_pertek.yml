name: Correct frozen Pertek catalog record
on:
  push:
    branches: [feature/turkey-10000-verified-spots]
    paths:
      - '.github/workflows/fix_frozen_pertek.yml'
      - 'tool/fix_frozen_pertek.py'
permissions:
  contents: write
concurrency:
  group: frozen-pertek-correction
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/turkey-10000-verified-spots
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only reviewed Pertek correction
        run: |
          python tool/fix_frozen_pertek.py
          python tool/fix_frozen_pertek.py --check
          git diff --check
      - name: Commit only three catalog metadata files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/data/verified_travel_places_generated.dart lib/data/spot_coordinate_verification_registry_generated.dart lib/data/verified_travel_image_quality_generated.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: correct frozen Pertek Castle to Tunceli Pertek'
          git push origin HEAD:feature/turkey-10000-verified-spots

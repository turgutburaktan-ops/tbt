name: Apply social UI cleanup

on:
  push:
    branches: [feature/video-v1]
    paths:
      - '.github/workflows/apply_social_ui_cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # HOME: merge Radar + Events, add Reels to home
          p = Path('lib/screens/home_shell_screen.dart')
          s = p.read_text()
          s = s.replace("import 'events_hub_screen.dart';\n", '')
          if "import 'reels_screen.dart';" not in s:
              s = s.replace("import 'profile_page_v2.dart';\n", "import 'profile_page_v2.dart';\nimport 'reels_screen.dart';\n")
          old = """    final labels = campusEligible
        ? const ['Radar', 'Etkinlikler', 'Kampüs']
        : const ['Radar', 'Etkinlikler'];
    final effectiveSection = _section >= labels.length ? 0 : _section;
    final pages = <Widget>[
      const RadarScreen(embedded: true),
      const EventsHubScreen(),
      if (campusEligible) const CampusHomeScreen(),
    ];
"""
          new = """    final labels = campusEligible
        ? const ['Çevrende', 'Kampüs']
        : const ['Çevrende'];
    final effectiveSection = _section >= labels.length ? 0 : _section;
    final pages = <Widget>[
      const RadarScreen(embedded: true),
      if (campusEligible) const CampusHomeScreen(),
    ];
"""
          if old not in s:
              raise SystemExit('home nearby target not found')
          s = s.replace(old, new)
          s = s.replace("'Radar, etkinlikler ve öğrencilere özel kampüs.'", "'Yakınındaki etkinlikler, buluşmalar ve öğrencilere özel kampüs.'")
          old_feed = """            Padding(
              padding: const EdgeInsets.fromLTRB(14, 2, 14, 8),
              child: _CompactTabs(
                firstLabel: 'Sana Özel',
                secondLabel: 'Takip',
                selected: _section,
                onChanged: (value) => setState(() => _section = value),
              ),
            ),
            Expanded(
              child: IndexedStack(
                index: _section,
                children: const [
                  _AuthAwareFeed(mode: FeedMode.forYou),
                  _AuthAwareFeed(mode: FeedMode.following),
                ],
              ),
            ),
"""
          new_feed = """            Padding(
              padding: const EdgeInsets.fromLTRB(14, 2, 14, 8),
              child: _NearbyTabs(
                labels: const ['Sana Özel', 'Takip', 'Reels'],
                selected: _section,
                onChanged: (value) => setState(() => _section = value),
              ),
            ),
            Expanded(
              child: IndexedStack(
                index: _section,
                children: const [
                  _AuthAwareFeed(mode: FeedMode.forYou),
                  _AuthAwareFeed(mode: FeedMode.following),
                  ReelsScreen(embedded: true),
                ],
              ),
            ),
"""
          if old_feed not in s:
              raise SystemExit('home feed target not found')
          s = s.replace(old_feed, new_feed)
          p.write_text(s)

          # REELS: support embedded home tab without its own app bar/scaffold
          p = Path('lib/screens/reels_screen.dart')
          s = p.read_text()
          s = s.replace("class ReelsScreen extends StatefulWidget {\n  const ReelsScreen({super.key});", "class ReelsScreen extends StatefulWidget {\n  final bool embedded;\n\n  const ReelsScreen({super.key, this.embedded = false});")
          old = """  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: Colors.black,
      appBar: AppBar(
        backgroundColor: Colors.black,
        foregroundColor: Colors.white,
        elevation: 0,
        title: const Text('Reels', style: TextStyle(fontWeight: FontWeight.w900)),
      ),
      body: StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
"""
          new = """  @override
  Widget build(BuildContext context) {
    final body = StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
"""
          if old not in s:
              raise SystemExit('reels build start target not found')
          s = s.replace(old, new)
          old_end = """        },
      ),
    );
  }
}

class _ReelPage"""
          new_end = """        },
      );
    if (widget.embedded) return ColoredBox(color: Colors.black, child: body);
    return Scaffold(
      backgroundColor: Colors.black,
      appBar: AppBar(
        backgroundColor: Colors.black,
        foregroundColor: Colors.white,
        elevation: 0,
        title: const Text('Reels', style: TextStyle(fontWeight: FontWeight.w900)),
      ),
      body: body,
    );
  }
}

class _ReelPage"""
          if old_end not in s:
              raise SystemExit('reels build end target not found')
          s = s.replace(old_end, new_end)
          p.write_text(s)

          # EVENT CREATE: add cover photo selection
          p = Path('lib/screens/social_events_screen.dart')
          s = p.read_text()
          if not s.startswith("import 'dart:io';"):
              s = "import 'dart:io';\n\n" + s
          if "package:image_picker/image_picker.dart" not in s:
              s = s.replace("import 'package:flutter/services.dart';\n", "import 'package:flutter/services.dart';\nimport 'package:image_picker/image_picker.dart';\n")
          s = s.replace("    bool saving = false;\n    String? formError;", "    File? coverImage;\n    bool saving = false;\n    String? formError;")
          anchor = """          Future<void> chooseLocation() async {
"""
          chooser = """          Future<void> chooseCover(ImageSource source) async {
            final picked = await ImagePicker().pickImage(
              source: source,
              imageQuality: 88,
              maxWidth: 1800,
              requestFullMetadata: false,
            );
            if (picked == null || !context.mounted) return;
            final file = File(picked.path);
            if (await file.length() > 15 * 1024 * 1024) {
              setSheetState(() => formError = 'Etkinlik fotoğrafı 15 MB sınırını aşıyor.');
              return;
            }
            setSheetState(() {
              coverImage = file;
              formError = null;
            });
          }

"""
          if chooser.strip() not in s:
              s = s.replace(anchor, chooser + anchor)
          intro = """                  const Text('Fotoğraf yürüyüşü, kahve buluşması, gezi, kamp veya kendi fikrini oluştur.', style: TextStyle(color: Colors.white60, height: 1.35)),
                  const SizedBox(height: 16),
                  TextField(controller: titleController, decoration: const InputDecoration(labelText: 'Etkinlik başlığı', prefixIcon: Icon(Icons.title))),
"""
          photo_ui = """                  const Text('Fotoğraf yürüyüşü, kahve buluşması, gezi, kamp veya kendi fikrini oluştur.', style: TextStyle(color: Colors.white60, height: 1.35)),
                  const SizedBox(height: 16),
                  Container(
                    width: double.infinity,
                    height: 180,
                    decoration: BoxDecoration(
                      color: const Color(0xFF151923),
                      borderRadius: BorderRadius.circular(18),
                      border: Border.all(color: Colors.white12),
                    ),
                    clipBehavior: Clip.antiAlias,
                    child: coverImage == null
                        ? const Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              Icon(Icons.add_photo_alternate_outlined, size: 42, color: Colors.white54),
                              SizedBox(height: 8),
                              Text('Etkinlik kapak fotoğrafı ekle', style: TextStyle(fontWeight: FontWeight.w800)),
                              SizedBox(height: 3),
                              Text('Etkinlik kartında ve detayında görünecek.', style: TextStyle(color: Colors.white54, fontSize: 12)),
                            ],
                          )
                        : Image.file(coverImage!, fit: BoxFit.cover),
                  ),
                  const SizedBox(height: 8),
                  Row(
                    children: [
                      Expanded(
                        child: OutlinedButton.icon(
                          onPressed: () => chooseCover(ImageSource.gallery),
                          icon: const Icon(Icons.photo_library_outlined),
                          label: const Text('Galeriden Seç'),
                        ),
                      ),
                      const SizedBox(width: 8),
                      Expanded(
                        child: OutlinedButton.icon(
                          onPressed: () => chooseCover(ImageSource.camera),
                          icon: const Icon(Icons.photo_camera_outlined),
                          label: const Text('Fotoğraf Çek'),
                        ),
                      ),
                    ],
                  ),
                  const SizedBox(height: 16),
                  TextField(controller: titleController, decoration: const InputDecoration(labelText: 'Etkinlik başlığı', prefixIcon: Icon(Icons.title))),
"""
          if intro not in s:
              raise SystemExit('event photo UI target not found')
          s = s.replace(intro, photo_ui)
          old_create = """                                  visibility: visibility,
                                  allowedUserIds: allowed,
                                );
"""
          new_create = """                                  visibility: visibility,
                                  allowedUserIds: allowed,
                                  coverImage: coverImage,
                                );
"""
          if old_create not in s:
              raise SystemExit('event create call target not found')
          s = s.replace(old_create, new_create)
          p.write_text(s)

          # EVENT SERVICE: upload cover image to Firebase Storage
          p = Path('lib/services/social_event_service.dart')
          s = p.read_text()
          if not s.startswith("import 'dart:io';"):
              s = "import 'dart:io';\n\n" + s
          if "firebase_storage" not in s:
              s = s.replace("import 'package:firebase_auth/firebase_auth.dart';\n", "import 'package:firebase_auth/firebase_auth.dart';\nimport 'package:firebase_storage/firebase_storage.dart';\n")
          s = s.replace("  final FirebaseAuth _auth = FirebaseAuth.instance;\n", "  final FirebaseAuth _auth = FirebaseAuth.instance;\n  final FirebaseStorage _storage = FirebaseStorage.instance;\n")
          s = s.replace("    String? communityName,\n  }) async {", "    String? communityName,\n    File? coverImage,\n  }) async {")
          old_ref = """    final ref = _firestore.collection(collection).doc();
    final personalName"""
          new_ref = """    final ref = _firestore.collection(collection).doc();
    String coverImageUrl = '';
    String coverStoragePath = '';
    if (coverImage != null) {
      if (!await coverImage.exists() || await coverImage.length() <= 0) {
        throw Exception('Etkinlik kapak fotoğrafı okunamadı.');
      }
      if (await coverImage.length() > 15 * 1024 * 1024) {
        throw Exception('Etkinlik kapak fotoğrafı 15 MB sınırını aşıyor.');
      }
      final coverRef = _storage.ref().child('users/${user.uid}/events/${ref.id}/cover.jpg');
      await coverRef.putFile(coverImage, SettableMetadata(contentType: 'image/jpeg'));
      coverImageUrl = await coverRef.getDownloadURL();
      coverStoragePath = coverRef.fullPath;
    }
    final personalName"""
          if old_ref not in s:
              raise SystemExit('event service ref target not found')
          s = s.replace(old_ref, new_ref)
          old_fields = """      'description': description.trim(),
      'city': city.trim().isNotEmpty ? city.trim() : (spot?.city ?? ''),
"""
          new_fields = """      'description': description.trim(),
      'coverImageUrl': coverImageUrl,
      'coverStoragePath': coverStoragePath,
      'city': city.trim().isNotEmpty ? city.trim() : (spot?.city ?? ''),
"""
          if old_fields not in s:
              raise SystemExit('event service fields target not found')
          s = s.replace(old_fields, new_fields)
          p.write_text(s)

          # VIDEO: enforce/declare 60 second cap in camera picker and sharing copy
          p = Path('lib/screens/camera_screen.dart')
          s = p.read_text()
          s = s.replace('maxDuration: const Duration(seconds: 30)', 'maxDuration: const Duration(seconds: 60)')
          s = s.replace('En fazla 30 saniye', 'En fazla 60 saniye')
          s = s.replace('30 saniyeye kadar', '60 saniyeye kadar')
          p.write_text(s)

          p = Path('lib/screens/camera_video_post_screen.dart')
          s = p.read_text().replace('En fazla 30 saniye.', 'En fazla 60 saniye.')
          p.write_text(s)
          PY

          dart format lib/screens/home_shell_screen.dart lib/screens/reels_screen.dart lib/screens/social_events_screen.dart lib/services/social_event_service.dart lib/screens/camera_screen.dart lib/screens/camera_video_post_screen.dart || true

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/home_shell_screen.dart lib/screens/reels_screen.dart lib/screens/social_events_screen.dart lib/services/social_event_service.dart lib/screens/camera_screen.dart lib/screens/camera_video_post_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m 'fix: merge nearby events and restore social media placement'
          git push

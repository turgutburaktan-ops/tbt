name: Run Feature 1000+ Verified Spot Catalog

on:
  push:
    branches: [main]
    paths:
      - 'docs/spot-catalog-main-trigger.txt'
  pull_request:
    branches: [main]
    paths:
      - 'docs/spot-catalog-main-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feature-verified-spot-catalog
  cancel-in-progress: true

jobs:
  build-feature-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: feature/verified-travel-batch-11
      TARGET_TOTAL: '1100'
    steps:
      - name: Checkout feature catalog branch
        uses: actions/checkout@v4
        with:
          ref: feature/verified-travel-batch-11
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate direct-source catalog
        id: generate
        run: |
          mkdir -p build/spot_import
          set +e
          python3 tool/generate_verified_spot_catalog_v2.py --target-total "$TARGET_TOTAL" 2>&1 | tee build/spot_import/generator.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upgrade hand-verified local photos
        id: upgrade
        if: steps.generate.outputs.exit_code == '0'
        run: |
          set +e
          python3 tool/upgrade_verified_spot_images_v2.py --long-edge 1600 --short-edge 900 --request-width 1920 2>&1 | tee build/spot_import/image_upgrade.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Coordinate audit
        id: coordinate_audit
        if: steps.generate.outputs.exit_code == '0'
        run: |
          mkdir -p build/spot_quality
          cp lib/data/spot_coordinate_verification_registry_generated.dart \
            lib/data/spot_coordinate_verification_registry_batch_generated.dart
          set +e
          python3 tool/audit_spot_coordinates.py 2>&1 | tee build/spot_quality/coordinate_audit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 1000+ catalog and image audit
        id: catalog_audit
        if: steps.generate.outputs.exit_code == '0'
        env:
          MIN_VERIFIED_SPOTS: '1100'
          MIN_IMAGE_LONG_EDGE: '1600'
          MIN_IMAGE_SHORT_EDGE: '900'
        run: |
          mkdir -p build/spot_quality
          set +e
          python3 tool/audit_verified_spot_catalog_v2.py 2>&1 | tee build/spot_quality/verified_catalog_audit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write durable pipeline status
        if: always()
        env:
          GENERATOR_EXIT: ${{ steps.generate.outputs.exit_code || 'not-run' }}
          UPGRADE_EXIT: ${{ steps.upgrade.outputs.exit_code || 'not-run' }}
          COORDINATE_EXIT: ${{ steps.coordinate_audit.outputs.exit_code || 'not-run' }}
          AUDIT_EXIT: ${{ steps.catalog_audit.outputs.exit_code || 'not-run' }}
        run: |
          mkdir -p docs
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def load(path):
              p = Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          def tail(path, n=100):
              p = Path(path)
              if not p.exists(): return ''
              return '\n'.join(p.read_text(encoding='utf-8', errors='replace').splitlines()[-n:])
          status = {
              'target_total': int(os.environ.get('TARGET_TOTAL', '1100')),
              'generator_exit': os.environ.get('GENERATOR_EXIT', 'not-run'),
              'upgrade_exit': os.environ.get('UPGRADE_EXIT', 'not-run'),
              'coordinate_audit_exit': os.environ.get('COORDINATE_EXIT', 'not-run'),
              'catalog_audit_exit': os.environ.get('AUDIT_EXIT', 'not-run'),
              'generation_report': load('build/spot_import/wikidata_verified_catalog_report.json'),
              'coordinate_summary': load('build/spot_quality/coordinate_audit.json').get('summary', {}),
              'catalog_audit_summary': load('build/spot_quality/verified_catalog_audit.json').get('summary', {}),
              'generator_log_tail': tail('build/spot_import/generator.log'),
              'image_upgrade_log_tail': tail('build/spot_import/image_upgrade.log', 80),
              'catalog_audit_log_tail': tail('build/spot_quality/verified_catalog_audit.log', 80),
          }
          Path('docs/verified_spot_pipeline_status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit result or diagnostics to feature branch
        if: always()
        env:
          GENERATOR_EXIT: ${{ steps.generate.outputs.exit_code || 'not-run' }}
          UPGRADE_EXIT: ${{ steps.upgrade.outputs.exit_code || 'not-run' }}
          COORDINATE_EXIT: ${{ steps.coordinate_audit.outputs.exit_code || 'not-run' }}
          AUDIT_EXIT: ${{ steps.catalog_audit.outputs.exit_code || 'not-run' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verified_spot_pipeline_status.json
          if [ "$GENERATOR_EXIT" = '0' ] && [ "$UPGRADE_EXIT" = '0' ] && [ "$COORDINATE_EXIT" = '0' ] && [ "$AUDIT_EXIT" = '0' ]; then
            git add \
              lib/data/verified_travel_places_generated.dart \
              lib/data/spot_coordinate_verification_registry_generated.dart \
              lib/data/verified_travel_image_registry_generated.dart \
              lib/data/verified_travel_image_quality_generated.json \
              assets/spots
            message='data: build 1100 source-verified photo spots'
          else
            message='chore: record 1000+ spot pipeline diagnostics'
          fi
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m "$message"
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-verified-spot-catalog
          path: |
            build/spot_import/*.json
            build/spot_import/*.log
            build/spot_quality/*.json
            build/spot_quality/*.log
            docs/verified_spot_pipeline_status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce success
        if: always()
        env:
          GENERATOR_EXIT: ${{ steps.generate.outputs.exit_code || 'not-run' }}
          UPGRADE_EXIT: ${{ steps.upgrade.outputs.exit_code || 'not-run' }}
          COORDINATE_EXIT: ${{ steps.coordinate_audit.outputs.exit_code || 'not-run' }}
          AUDIT_EXIT: ${{ steps.catalog_audit.outputs.exit_code || 'not-run' }}
        run: |
          test "$GENERATOR_EXIT" = '0'
          test "$UPGRADE_EXIT" = '0'
          test "$COORDINATE_EXIT" = '0'
          test "$AUDIT_EXIT" = '0'

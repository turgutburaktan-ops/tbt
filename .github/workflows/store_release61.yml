name: Publish TBT 1.0.33 (61) to both stores
on:
  push:
    branches: [codex/store-release61-20260925]
    paths: ['.github/workflows/store_release61.yml']
permissions:
  contents: read
concurrency:
  group: tbt-release61
  cancel-in-progress: false
jobs:
  android:
    uses: ./.github/workflows/android_play_release61.yml
    secrets: inherit
  ios:
    uses: ./.github/workflows/ios_testflight_release61.yml
    secrets: inherit
  submit-ios:
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit verified build 61 to App Review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: node tool/submit_ios_build61.cjs

name: Account lifecycle security verification and deployment
on:
  push:
    branches: [codex/store-release62-security-20260927]
    paths:
      - .github/workflows/security_lifecycle.yml
      - functions/account_lifecycle.js
      - functions/account_lifecycle_guard.js
      - functions/test/account_lifecycle*.test.js
      - functions/test/strict_rule_patches.test.js
      - firestore.rules
      - test/content_lifecycle_rules.cjs
      - tool/security_rules_patch.json
      - tool/strict_rule_patches.cjs
      - tool/deploy_security_hardening.cjs
permissions:
  contents: read
concurrency:
  group: tbt-security-hardening
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix functions
      - run: npm install --prefix /tmp/security-tests @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.12.0
      - name: Verify content state and access rules
        env:
          NODE_PATH: /tmp/security-tests/node_modules
        run: /tmp/security-tests/node_modules/.bin/firebase emulators:exec --only firestore,storage --project demo-tbt-general-audit "node --test --test-concurrency=1 test/general_security_audit.cjs test/content_lifecycle_rules.cjs test/route_access_rules.cjs" --non-interactive
      - run: node --test test/private_route_media_security.cjs test/trusted_notifications.cjs functions/test/*.test.js
      - run: npm audit --prefix functions --omit=dev --audit-level=moderate
      - run: node -e "require('./functions/bootstrap'); console.log('BOOTSTRAP_OK')"
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --prefix functions
          npm install --prefix /tmp/lifecycle-deploy firebase-tools@latest
      - name: Authenticate existing deployment identity
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          account=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          assert account['project_id']=='en-iyi-cekim-noktasi'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'lifecycle.json'
          path.write_text(json.dumps(account));path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'GOOGLE_APPLICATION_CREDENTIALS={path}\n')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix /tmp/security-tests @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.12.0
      - run: node tool/deploy_security_hardening.cjs prepare
      - name: Verify patched live policies
        env:
          NODE_PATH: /tmp/security-tests/node_modules
        run: /tmp/security-tests/node_modules/.bin/firebase emulators:exec --only firestore,storage --project demo-tbt-general-audit "node --test --test-concurrency=1 test/general_security_audit.cjs test/content_lifecycle_rules.cjs test/route_access_rules.cjs" --non-interactive
      - run: node tool/deploy_security_hardening.cjs check
      - name: Deploy verified account lifecycle functions
        run: /tmp/lifecycle-deploy/node_modules/.bin/firebase deploy --only functions:freezeAccount,functions:unfreezeAccount,functions:deleteAccountNow --project en-iyi-cekim-noktasi --non-interactive
      - name: Publish verified rules and verify private media isolation
        run: node tool/deploy_security_hardening.cjs deploy

name: Crash safety verification
on:
  push:
    branches: [codex/crash-safety-20260920]
  workflow_dispatch:
concurrency:
  group: crash-safety-flutter-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Record resolved dependency lock
        run: |
          echo TBT_LOCK_BEGIN
          base64 -w0 pubspec.lock
          echo
          echo TBT_LOCK_END
      - run: dart format lib/widgets/app_video_player.dart lib/services/safe_image_service.dart lib/services/video_media_service.dart lib/services/app_observability_service.dart lib/services/event_chat_service.dart lib/services/route_chat_service.dart lib/screens/ai_edit_screen.dart lib/screens/route_album_screen.dart lib/screens/places_hub_screen.dart test/video_playback_test.dart test/safe_image_service_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: python3 -m unittest discover -s tool/tests -p 'test_crash_configuration.py'
      - run: flutter test test/video_playback_test.dart test/safe_image_service_test.dart test/route_map_candidates_test.dart test/places_hub_test.dart test/route_create_test.dart test/profile_ios_interaction_test.dart test/post_photo_crop_test.dart test/post_photo_capture_test.dart test/chat_layout_test.dart
      - name: Save resolved dependencies and formatted sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-safety-verified-sources
          path: |
            pubspec.lock
            lib/
            test/video_playback_test.dart
            test/safe_image_service_test.dart

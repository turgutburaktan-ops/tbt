name: Inspect Username Signing

on:
  workflow_dispatch:
  push:
    branches: [codex/check-username-signing]
    paths: ['.github/workflows/inspect_username_signing.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate existing deployment connection
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          credential = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          if credential.get('project_id') != 'en-iyi-cekim-noktasi':
              raise SystemExit('Unexpected Firebase project')
          target = Path(os.environ['RUNNER_TEMP']) / 'firebase-inspection.json'
          target.write_text(json.dumps(credential))
          target.chmod(0o600)
          PY
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-inspection.json"
      - name: Read runtime identity and signing configuration
        run: |
          set -euo pipefail
          gcloud functions describe signInWithUsername --gen2 --region=europe-west1 --project=en-iyi-cekim-noktasi \
            --format='json(name,state,serviceConfig.serviceAccountEmail)'
          gcloud services list --enabled --project=en-iyi-cekim-noktasi \
            --filter='config.name:iamcredentials.googleapis.com' --format='value(config.name)'
          gcloud iam service-accounts get-iam-policy 330568532415-compute@developer.gserviceaccount.com \
            --project=en-iyi-cekim-noktasi --format=json > "$RUNNER_TEMP/signing-account-policy.json"
          gcloud projects get-iam-policy en-iyi-cekim-noktasi \
            --format=json > "$RUNNER_TEMP/signing-project-policy.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          member = 'serviceAccount:330568532415-compute@developer.gserviceaccount.com'
          for scope in ['account', 'project']:
              policy = json.loads((Path(os.environ['RUNNER_TEMP']) / f'signing-{scope}-policy.json').read_text())
              bindings = [dict(role=b['role'], conditional='condition' in b)
                          for b in policy.get('bindings', []) if member in b.get('members', [])]
              print(json.dumps(dict(scope=scope, runtime_identity_roles=bindings)))
          PY
      - name: Remove temporary credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-inspection.json"

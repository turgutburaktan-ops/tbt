name: UI Redesign Autofix

on:
  push:
    branches: [feature/ui-redesign-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-invalid-colors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-redesign-v2
      - name: Replace invalid Material color aliases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('lib/screens/camera_screen.dart'),
              Path('lib/screens/home_shell_screen.dart'),
              Path('lib/screens/profile_page_v2.dart'),
              Path('lib/screens/radar_screen.dart'),
              Path('lib/screens/spot_explore_screen_v2.dart'),
              Path('lib/widgets/nearby_places_view.dart'),
          ]
          for p in files:
              s = p.read_text()
              s = s.replace('Colors.white46', 'const Color(0x75FFFFFF)')
              s = s.replace('Colors.white32', 'const Color(0x52FFFFFF)')
              p.write_text(s)
          PY
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/camera_screen.dart lib/screens/home_shell_screen.dart lib/screens/profile_page_v2.dart lib/screens/radar_screen.dart lib/screens/spot_explore_screen_v2.dart lib/widgets/nearby_places_view.dart
          git commit -m 'fix(ui): replace invalid white alpha aliases'
          git push origin HEAD:feature/ui-redesign-v2

name: Profile Campus Visibility Patch

on:
  push:
    branches: [feature/video-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-v1
      - name: Hide campus menu from non-students
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/profile_page_v2.dart')
          s = p.read_text()
          anchor = "  void _openFollowList(bool followers) {\n"
          helper = "  bool _campusEligible(Map<String, dynamic> profile) {\n    const activeYears = <String>{'Hazırlık', '1', '2', '3', '4', '5', '6'};\n    final university = (profile['university'] ?? '').toString().trim();\n    final classYear = (profile['classYear'] ?? '').toString().trim();\n    return university.isNotEmpty && activeYears.contains(classYear);\n  }\n\n" + anchor
          if anchor not in s:
              raise SystemExit('profile helper anchor missing')
          s = s.replace(anchor, helper, 1)
          old = "                            itemBuilder: (_) => const [\n"
          new = "                            itemBuilder: (_) => [\n"
          if old not in s:
              raise SystemExit('menu builder anchor missing')
          s = s.replace(old, new, 1)
          campus = "                              PopupMenuItem(\n                                value: 'campus',\n                                child: ListTile(\n                                  dense: true,\n                                  leading: Icon(Icons.school_outlined),\n                                  title: Text('Kampüs'),\n                                ),\n                              ),\n"
          replacement = "                              if (_campusEligible(profile))\n                                const PopupMenuItem(\n                                  value: 'campus',\n                                  child: ListTile(\n                                    dense: true,\n                                    leading: Icon(Icons.school_outlined),\n                                    title: Text('Kampüs'),\n                                  ),\n                                ),\n"
          if campus not in s:
              raise SystemExit('campus menu block missing')
          s = s.replace(campus, replacement, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/profile_page_v2.dart
          git commit -m 'fix: hide campus entry for non-students'
          git push origin HEAD:feature/video-v1

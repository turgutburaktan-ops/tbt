name: Route stops verification
on:
  push:
    branches: [codex/route-stops-layout-20260921]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/route_create_test.dart test/restored_flows_test.dart test/route_stop_selection_test.dart test/route_map_candidates_test.dart test/route_itinerary_test.dart

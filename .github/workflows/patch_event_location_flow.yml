name: Patch Event Location Flow

on:
  push:
    paths:
      - 'tool/patch_event_location_flow.py'
      - '.github/workflows/patch_event_location_flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply event location patch
        run: python3 tool/patch_event_location_flow.py

      - name: Commit event location flow
        run: |
          if git diff --quiet; then
            echo 'No event location changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/social_events_screen.dart lib/services/social_event_service.dart lib/models/social_event.dart
          git commit -m 'Add exact map selection to social events'
          git push

name: Add Post Event Engagement
on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/services/content_engagement_service.dart'
      - 'lib/widgets/content_engagement_bar.dart'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch post and event screens
        run: |
          python3 - <<'PY'
          from pathlib import Path

          post = Path('lib/screens/post_detail_screen.dart')
          s = post.read_text()
          imp = "import '../widgets/content_engagement_bar.dart';\n"
          if imp not in s:
              s = s.replace("import 'spot_detail_screen.dart';\n", "import 'spot_detail_screen.dart';\n" + imp)
          marker = "          Padding(\n            padding: const EdgeInsets.fromLTRB(16, 14, 16, 0),"
          bar = "          Padding(\n            padding: const EdgeInsets.fromLTRB(12, 8, 12, 0),\n            child: ContentEngagementBar(\n              collection: 'posts',\n              contentId: (_post['id'] ?? '').toString(),\n              ownerId: (_post['userId'] ?? '').toString(),\n              title: caption.isEmpty ? 'Fotoğraf paylaşımı' : caption,\n              sourceType: 'post',\n            ),\n          ),\n"
          if 'ContentEngagementBar(' not in s and marker in s:
              s = s.replace(marker, bar + marker, 1)
          post.write_text(s)

          events = Path('lib/screens/social_events_screen.dart')
          s = events.read_text()
          imp = "import '../widgets/content_engagement_bar.dart';\n"
          if imp not in s:
              s = s.replace("import '../services/social_event_service.dart';\n", "import '../services/social_event_service.dart';\n" + imp)
          marker = "                          const SizedBox(height: 12),\n                          Row(children: ["
          bar = "                          const SizedBox(height: 8),\n                          ContentEngagementBar(\n                            collection: 'social_events',\n                            contentId: event.id,\n                            ownerId: event.hostId,\n                            title: event.title,\n                            sourceType: 'social_event',\n                          ),\n"
          if "collection: 'social_events'" not in s and marker in s:
              s = s.replace(marker, bar + marker, 1)
          events.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "turgutburaktan-ops"
          git config user.email "turgutburaktan@gmail.com"
          git add lib/screens/post_detail_screen.dart lib/screens/social_events_screen.dart
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add likes comments tags and sharing to posts and events"
          git push origin main

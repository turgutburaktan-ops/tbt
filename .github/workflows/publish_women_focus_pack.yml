name: Publish TBT Women Focus Pack
on:
  push:
    branches: [codex/publish-sound-videos]
    paths:
      - tool/publish_women_focus_pack.cjs
      - .github/workflows/publish_women_focus_pack.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tbt-women-focus-pack
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - run: node tool/publish_women_focus_pack.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

name: Build Nationwide Spot Images V2

on:
  push:
    paths:
      - 'tools/build_spot_image_catalog_v2.py'
      - '.github/workflows/build_spot_image_catalog_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nationwide-spot-images-v2
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build licensed image catalog
        run: python3 tools/build_spot_image_catalog_v2.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Format generated Dart
        run: dart format lib/data/spot_image_auto_registry.dart

      - name: Validate Flutter code
        run: flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit localized images and registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/data/spot_image_auto_registry.dart assets/spots tools/spot_image_catalog_report.json
          if git diff --cached --quiet; then
            echo 'No image catalog changes to commit'
            exit 0
          fi
          git commit -m 'Localize nationwide photo spot images v2'
          git pull --rebase origin main
          git push origin main

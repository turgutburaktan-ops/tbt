name: TBT unified interface
on:
  push:
    branches: [codex/unified-interface]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/profile_content_navigation_test.dart test/profile_identity_test.dart test/profile_ios_interaction_test.dart test/chat_appearance_test.dart test/chat_layout_test.dart test/swipe_to_reply_test.dart test/camera_share_controls_test.dart test/restored_flows_test.dart test/route_create_test.dart
      - run: flutter build bundle --debug

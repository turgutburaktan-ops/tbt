name: iPhone notifications and inline reply check
on:
  push:
    branches: [codex/iphone-notifications-reply]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: node --test functions/test/push_payload.test.js
      - run: python3 tool/tests/test_notification_host.py
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/push_notification_service.dart lib/services/push_registration_retry.dart lib/services/notification_reply_service.dart test/push_registration_retry_test.dart
      - run: flutter test test/push_registration_retry_test.dart test/profile_name_navigation_test.dart
      - name: Parse generated native reply host
        shell: bash
        run: |
          flutter config --no-enable-swift-package-manager
          flutter create --platforms=ios --org com.tbt --project-name best_photo_spot .
          python3 tool/configure_notifications.py ios
          xcrun swiftc -frontend -parse ios/Runner/AppDelegate.swift

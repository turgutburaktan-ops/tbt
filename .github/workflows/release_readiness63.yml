name: Verify security client and approved production protections
on:
  push:
    branches: [codex/release-readiness-20260929]
permissions:
  contents: read
concurrency:
  group: tbt-release-readiness-20260929
  cancel-in-progress: false
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/widgets/post_album_badge.dart lib/screens/user_profile_screen.dart lib/screens/admin_insights_screen.dart lib/services/admin_console_service.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/signal_engine_test.dart test/attachment_cipher_test.dart test/app_update_policy_test.dart
      - run: flutter build bundle --debug --no-pub
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: node --test functions/test/*.test.js test/private_route_media_security.cjs test/trusted_notifications.cjs
      - run: npm install --prefix /tmp/security-tests @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.12.0
      - env:
          NODE_PATH: /tmp/security-tests/node_modules
        run: /tmp/security-tests/node_modules/.bin/firebase emulators:exec --only firestore,storage --project demo-tbt-general-audit "node --test --test-concurrency=1 test/e2ee_rules.cjs test/chat_media_security.cjs test/general_security_audit.cjs test/content_lifecycle_rules.cjs test/route_access_rules.cjs test/private_contacts.cjs test/frozen_posts.cjs" --non-interactive
      - env:
          NODE_PATH: /tmp/security-tests/node_modules
        run: /tmp/security-tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-tbt-access "node --test test/private_photo_backend.cjs" --non-interactive
  production-evidence:
    if: contains(github.event.head_commit.message, '[production-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Authenticate existing deployment identity
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          account=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          assert account['project_id']=='en-iyi-cekim-noktasi'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'readiness.json'
          path.write_text(json.dumps(account));path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'GOOGLE_APPLICATION_CREDENTIALS={path}\n')
          PY
      - name: Read Play availability
        if: always()
        env:
          PLAY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tool/play_release_status.cjs
      - name: Read Apple availability
        if: always()
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: node tool/store_status60.cjs
      - name: Inspect production App Check verification
        if: always()
        run: node tool/app_check_readiness.cjs
      - name: Apply and verify requested password and recovery protections
        if: always()
        run: node tool/harden_project_configuration.cjs

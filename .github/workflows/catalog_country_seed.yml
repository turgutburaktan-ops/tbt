name: Seed country place catalog
on:
  push:
    branches: [codex/catalog-country-seed]
permissions:
  contents: read
concurrency:
  group: catalog-country-seed
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix functions
      - run: npm install --prefix functions --no-save @firebase/rules-unit-testing firebase
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --only firestore --project demo-tbt "node --test functions/catalog/seed.test.js" --non-interactive
      - run: pip install osmium==4.3.1 'shapely>=2.1,<3'
      - name: Download verified public Turkey snapshot
        run: |
          mkdir -p build/catalog-country
          curl --fail --location --retry 3 --max-time 600 https://download.geofabrik.de/europe/turkey-latest.osm.pbf -o build/catalog-country/turkey-latest.osm.pbf
          curl --fail --location --retry 3 https://download.geofabrik.de/europe/turkey-latest.osm.pbf.md5 -o build/catalog-country/turkey-latest.osm.pbf.md5
          cd build/catalog-country
          md5sum --check turkey-latest.osm.pbf.md5
      - name: Extract named venues within all 81 province boundaries
        run: python3 functions/scripts/extract_country_catalog.py build/catalog-country/turkey-latest.osm.pbf build/catalog-country/venues.jsonl
      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PYAUTH'
          import json, os
          from pathlib import Path
          value=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          target=Path(os.environ['RUNNER_TEMP'])/'catalog-service-account.json'
          target.write_text(json.dumps(value)); target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'GOOGLE_APPLICATION_CREDENTIALS={target}\n')
              f.write('GCLOUD_PROJECT=en-iyi-cekim-noktasi\n')
          PYAUTH
      - name: Seed catalog preserving existing live and approved records
        run: node functions/scripts/seed_country_catalog.js build/catalog-country/venues.jsonl
      - name: Verify catalog
        run: node functions/scripts/verify_place_catalog.js
      - name: Save source and import reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-country-report
          path: |
            build/catalog-country/*.json
            build/catalog-country/*.jsonl
          retention-days: 7

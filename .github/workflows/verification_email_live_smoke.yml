name: Diagnose Android Phone Auth
# Diagnostic revision 2

on:
  push:
    branches: [codex/verification-email-live-smoke]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Inspect Firebase phone auth, billing, certificates and API restrictions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: en-iyi-cekim-noktasi
          FIREBASE_ANDROID_APP_ID: '1:330568532415:android:bf2ffa0b4d9210ed41a10a'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee phone_auth_diagnostic.txt
          const fs = require('node:fs');
          const {GoogleAuth} = require('./functions/node_modules/google-auth-library');
          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (!credentials.project_id) throw new Error('Firebase service account is missing.');

          (async () => {
            const auth = new GoogleAuth({
              credentials,
              scopes: ['https://www.googleapis.com/auth/cloud-platform'],
            });
            const client = await auth.getClient();
            const project = process.env.FIREBASE_PROJECT_ID;
            const configResponse = await client.request({
              url: `https://identitytoolkit.googleapis.com/admin/v2/projects/${project}/config`,
            });
            const config = configResponse.data || {};
            const phone = config.signIn?.phoneNumber || {};
            console.log('PHONE_CONFIG=' + JSON.stringify({
              enabled: phone.enabled === true,
              testNumbers: Object.keys(phone.testPhoneNumbers || {}).length,
              smsRegionConfig: config.smsRegionConfig || null,
              recaptchaConfig: config.recaptchaConfig || null,
            }));

            const appId = encodeURIComponent(process.env.FIREBASE_ANDROID_APP_ID);
            const shaResponse = await client.request({
              url: `https://firebase.googleapis.com/v1beta1/projects/${project}/androidApps/${appId}/sha`,
            });
            const certificates = (shaResponse.data?.certificates || []).map((item) => ({
              certType: item.certType,
              shaHash: item.shaHash,
            }));
            console.log('ANDROID_SHA=' + JSON.stringify(certificates));

            try {
              const billingResponse = await client.request({
                url: `https://cloudbilling.googleapis.com/v1/projects/${project}/billingInfo`,
              });
              console.log('BILLING=' + JSON.stringify({
                billingEnabled: billingResponse.data?.billingEnabled === true,
              }));
            } catch (error) {
              console.log('BILLING=unavailable_' + String(error.response?.status || 'unknown'));
            }

            const serviceStates = {};
            for (const service of [
              'identitytoolkit.googleapis.com',
              'playintegrity.googleapis.com',
              'firebaseappcheck.googleapis.com',
              'recaptchaenterprise.googleapis.com',
            ]) {
              try {
                const serviceResponse = await client.request({
                  url: `https://serviceusage.googleapis.com/v1/projects/${project}/services/${service}`,
                });
                serviceStates[service] = serviceResponse.data?.state || 'UNKNOWN';
              } catch (error) {
                serviceStates[service] = 'unavailable_' + String(error.response?.status || 'unknown');
              }
            }
            console.log('SERVICES=' + JSON.stringify(serviceStates));

            try {
              const options = fs.readFileSync('lib/firebase_options.dart', 'utf8');
              const apiKey = options.match(/apiKey:\s*'([^']+)'/)?.[1];
              if (!apiKey) throw new Error('missing_key');
              const lookup = await client.request({
                url: 'https://apikeys.googleapis.com/v2/keys:lookupKey',
                params: {keyString: apiKey},
              });
              const resourceName = lookup.data?.name;
              if (!resourceName) throw new Error('missing_resource');
              const keyResponse = await client.request({
                url: `https://apikeys.googleapis.com/v2/${resourceName}`,
              });
              const restrictions = keyResponse.data?.restrictions || {};
              console.log('API_RESTRICTIONS=' + JSON.stringify({
                hasBrowserRestrictions: Boolean(restrictions.browserKeyRestrictions),
                allowedReferrers: restrictions.browserKeyRestrictions?.allowedReferrers || [],
                hasAndroidRestrictions: Boolean(restrictions.androidKeyRestrictions),
                androidApplications: restrictions.androidKeyRestrictions?.allowedApplications || [],
                apiTargets: (restrictions.apiTargets || []).map((item) => item.service),
              }));
            } catch (error) {
              console.log('API_RESTRICTIONS=unavailable_' + String(error.response?.status || error.message));
            }
          })().catch((error) => {
            console.error(error.response?.data?.error?.message || error.message);
            process.exitCode = 1;
          });
          NODE
      - name: Store sanitized diagnosis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phone_auth_diagnostic.txt
          git commit -m "[diagnostic-result] Store Android phone auth diagnosis"
          git push

name: Check Verification Email Delivery

on:
  push:
    branches: [codex/verification-email-live-smoke]

permissions:
  contents: write

jobs:
  check:
    if: ${{ !contains(github.event.head_commit.message, '[delivery-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Check latest provider delivery status
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: en-iyi-cekim-noktasi
          FIREBASE_TEST_UID: 3REINLO48adcWmRO7aC76gOI1q63
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          node <<'NODE' | tee verification_email_delivery.txt
          let stage = 'startup';
          (async () => {
            stage = 'load_modules';
            const admin = require('./functions/node_modules/firebase-admin');
            const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
            admin.initializeApp({
              credential: admin.credential.cert(credentials),
              projectId: process.env.FIREBASE_PROJECT_ID,
            });

            stage = 'read_delivery';
            const snapshot = await admin.firestore()
              .collection('verification_email_deliveries')
              .where('uid', '==', process.env.FIREBASE_TEST_UID)
              .get();
            const records = snapshot.docs.map((doc) => {
              const data = doc.data();
              return {
                status: String(data.status || ''),
                providerMessageId: String(data.providerMessageId || ''),
                createdAt: data.createdAt?.toMillis?.() || 0,
              };
            }).sort((a, b) => b.createdAt - a.createdAt);
            const latest = records[0];
            if (!latest?.providerMessageId) throw new Error('missing_provider_message');

            stage = 'query_resend';
            const response = await fetch(
              'https://api.resend.com/emails/' + encodeURIComponent(latest.providerMessageId),
              {headers: {Authorization: 'Bearer ' + process.env.RESEND_API_KEY}},
            );
            const body = await response.json().catch(() => ({}));
            console.log('PROVIDER_HTTP_STATUS=' + response.status);
            console.log('FIRESTORE_STATUS=' + latest.status);
            console.log('PROVIDER_EVENT=' + String(body.last_event || body.status || 'unknown'));
          })().catch((error) => {
            console.log('PROVIDER_HTTP_STATUS=0');
            console.log('DELIVERY_CHECK=' + JSON.stringify({
              stage,
              type: error?.name || 'Error',
              code: String(error?.code || '').slice(0, 80),
            }));
          });
          NODE
      - name: Store sanitized delivery result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification_email_delivery.txt
          git commit -m "[delivery-result] Store verification delivery status"
          git push

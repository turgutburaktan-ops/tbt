name: Diagnose Verification Email Delivery

on:
  push:
    branches: [codex/verification-email-live-smoke]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Read the latest provider status without sensitive values
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_UID: '3REINLO48adcWmRO7aC76gOI1q63'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin = require('./functions/node_modules/firebase-admin');

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (!serviceAccount.project_id) throw new Error('Firebase service account is missing.');
          admin.initializeApp({credential: admin.credential.cert(serviceAccount)});

          (async () => {
            const snapshot = await admin.firestore()
              .collection('verification_email_deliveries')
              .orderBy('createdAt', 'desc')
              .limit(100)
              .get();
            const match = snapshot.docs
              .map((doc) => doc.data())
              .find((item) => item.uid === process.env.TARGET_UID);
            if (!match) throw new Error('No verification delivery record was found.');
            console.log(JSON.stringify({
              provider: String(match.provider || ''),
              status: String(match.status || ''),
              errorCode: String(match.errorCode || ''),
              maskedEmail: String(match.maskedEmail || '***'),
            }));
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

name: Live Verification Email Smoke

on:
  push:
    branches: [codex/verification-email-live-smoke]

permissions:
  contents: write

jobs:
  send:
    if: ${{ !contains(github.event.head_commit.message, '[email-smoke-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Send one real TBT verification email
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: en-iyi-cekim-noktasi
          FIREBASE_TEST_UID: 3REINLO48adcWmRO7aC76gOI1q63
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee verification_email_result.txt
          const fs = require('node:fs');
          const {initializeApp, cert} = require('./functions/node_modules/firebase-admin/app');
          const {getAuth} = require('./functions/node_modules/firebase-admin/auth');

          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (!credentials.project_id) throw new Error('Firebase service account is missing.');
          initializeApp({
            credential: cert(credentials),
            projectId: process.env.FIREBASE_PROJECT_ID,
          });

          (async () => {
            const source = fs.readFileSync('lib/firebase_options.dart', 'utf8');
            const apiKey = source.match(/apiKey:\s*'([^']+)'/)?.[1];
            if (!apiKey) throw new Error('Android Firebase API key is missing.');

            const customToken = await getAuth().createCustomToken(process.env.FIREBASE_TEST_UID);
            const exchange = await fetch(
              'https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=' +
                encodeURIComponent(apiKey),
              {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: customToken, returnSecureToken: true}),
              },
            );
            const session = await exchange.json();
            if (!exchange.ok || !session.idToken) {
              console.log('HTTP_STATUS=' + exchange.status);
              console.log('CALLABLE_RESULT=' + JSON.stringify({stage: 'token_exchange_failed'}));
              return;
            }

            const response = await fetch(
              'https://europe-west1-en-iyi-cekim-noktasi.cloudfunctions.net/sendVerificationEmail',
              {
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + session.idToken,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({data: {}}),
              },
            );
            const body = await response.json().catch(() => ({}));
            console.log('HTTP_STATUS=' + response.status);
            console.log('CALLABLE_RESULT=' + JSON.stringify(body));
          })().catch((error) => {
            console.log('HTTP_STATUS=0');
            console.log('CALLABLE_RESULT=' + JSON.stringify({stage: 'exception', type: error?.name || 'Error'}));
          });
          NODE
      - name: Store sanitized send result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification_email_result.txt
          git commit -m "[email-smoke-result] Store verification email result"
          git push
      - name: Verify provider accepted the email
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^HTTP_STATUS=200$' verification_email_result.txt
          grep -q '"ok":true' verification_email_result.txt
          grep -q '"status":"accepted"' verification_email_result.txt

name: iOS TestFlight Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/release-*'

permissions:
  contents: read

concurrency:
  group: ios-testflight-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    uses: ./.github/workflows/store_release_preflight.yml
    with:
      platform: ios
    secrets: inherit

  auth-check:
    needs: preflight
    uses: ./.github/workflows/store_auth_smoke.yml
    secrets: inherit

  build-and-upload:
    needs: [preflight, auth-check]
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.tbt.social
      DEVELOPMENT_TEAM: 58UGDRSLU3
      PROFILE_NAME: TBT App Store 2026

    steps:
      - name: Verify Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          case "$SDK_VERSION" in
            26.*) ;;
            *) echo "Expected iOS 26 SDK, found $SDK_VERSION"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate clean iOS host
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          flutter create --platforms=ios --org com.tbt --project-name best_photo_spot .

      - name: Configure iOS application
        shell: bash
        env:
          FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ADMOB_IOS_APP_ID: ca-app-pub-3462343788063276~3452529921
        run: |
          set -euo pipefail
          test -n "$FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64"
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          info_path = Path('ios/Runner/Info.plist')
          with info_path.open('rb') as f:
              info = plistlib.load(f)

          info['NSCameraUsageDescription'] = 'Fotoğraf ve video çekmek için kameraya erişim gerekir.'
          info['NSMicrophoneUsageDescription'] = 'Video kaydında ses kullanmak için mikrofona erişim gerekir.'
          info['NSLocationWhenInUseUsageDescription'] = 'Yakındaki mekanları, etkinlikleri ve rota mesafelerini göstermek için konum kullanılır.'
          info['NSPhotoLibraryUsageDescription'] = 'Story ve paylaşım için galerinden fotoğraf veya video seçebilmek için erişim gerekir.'
          info['NSPhotoLibraryAddUsageDescription'] = 'Düzenlediğin içerikleri fotoğraf arşivine kaydedebilmek için izin gerekir.'
          info['UIBackgroundModes'] = ['fetch', 'remote-notification']
          info['GADApplicationIdentifier'] = os.environ['ADMOB_IOS_APP_ID']

          schemes = info.get('CFBundleURLTypes', [])
          for name, scheme in (
              ('com.tbt.social', 'tbt'),
              ('Google Sign-In', 'com.googleusercontent.apps.330568532415-vq9ighb74m02f36pfdf6mq369t6utjj0'),
          ):
              if not any(scheme in item.get('CFBundleURLSchemes', []) for item in schemes):
                  schemes.append({
                      'CFBundleTypeRole': 'Editor',
                      'CFBundleURLName': name,
                      'CFBundleURLSchemes': [scheme],
                  })
          info['CFBundleURLTypes'] = schemes

          with info_path.open('wb') as f:
              plistlib.dump(info, f, sort_keys=False)

          entitlements = {
              'aps-environment': 'production',
              'com.apple.developer.applesignin': ['Default'],
              'com.apple.developer.associated-domains': [
                  'applinks:trtbt.com',
                  'applinks:www.trtbt.com',
              ],
          }
          with Path('ios/Runner/Runner.entitlements').open('wb') as f:
              plistlib.dump(entitlements, f, sort_keys=False)
          PY

          printf '%s' "$FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" \
            | base64 --decode > ios/Runner/GoogleService-Info.plist

          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path('ios/Podfile')
          text = podfile.read_text()
          if re.search(r"^\s*#?\s*platform :ios,\s*'[^']+'", text, flags=re.M):
              text = re.sub(
                  r"^\s*#?\s*platform :ios,\s*'[^']+'",
                  "platform :ios, '15.0'",
                  text,
                  count=1,
                  flags=re.M,
              )
          else:
              text = "platform :ios, '15.0'\n" + text
          podfile.write_text(text)
          PY

          sudo gem install xcodeproj -N
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |item| item.name == 'Runner' }
          abort('Runner target missing') unless target

          runner_group = project.main_group.find_subpath('Runner', false)
          abort('Runner group missing') unless runner_group
          config_file = runner_group.files.find do |file|
            file.path == 'GoogleService-Info.plist'
          end
          config_file ||= runner_group.new_file('GoogleService-Info.plist')
          unless target.resources_build_phase.files_references.include?(config_file)
            target.resources_build_phase.add_file_reference(config_file)
          end

          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('DEVELOPMENT_TEAM')
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE_ID')
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
          end
          project.save
          RUBY

      - name: Install signing certificate and profile
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/tbt-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/tbt-app-store.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/tbt-signing.keychain-db"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          test "$PROFILE_DISPLAY_NAME" = "$PROFILE_NAME"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Create export configuration
        shell: bash
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Build signed IPA
        shell: bash
        env:
          ADMOB_NATIVE_IOS: ca-app-pub-3462343788063276/9247782088
        run: |
          set -euo pipefail
          FIREBASE_IOS_API_KEY=$(/usr/libexec/PlistBuddy -c 'Print :API_KEY' ios/Runner/GoogleService-Info.plist)
          FIREBASE_IOS_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' ios/Runner/GoogleService-Info.plist)
          flutter build ipa \
            --release \
            --build-name=1.0.11 \
            --build-number=18 \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define="FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY" \
            --dart-define="FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID" \
            --dart-define=IOS_BUNDLE_ID=com.tbt.social \
            --dart-define="ADMOB_NATIVE_IOS=$ADMOB_NATIVE_IOS"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbt-ios-ipa-1.0.11-build18
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          API_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEYS_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$API_KEYS_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$API_KEYS_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

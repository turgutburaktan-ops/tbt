name: Publish TBT Entertainment Videos
on:
  push:
    branches: [codex/publish-sound-videos]
    paths:
      - tool/publish_entertainment_videos.cjs
      - tool/publish_entertainment_turkish_videos.cjs
      - tool/cleanup_entertainment_sensitive.cjs
      - tool/editorial/entertainment-videos.json
      - .github/workflows/publish_entertainment_videos.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tbt-entertainment-videos
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - run: node tool/publish_entertainment_turkish_videos.cjs --publish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node tool/cleanup_entertainment_sensitive.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

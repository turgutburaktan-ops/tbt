name: TBT visual consistency review
on:
  push:
    branches: [codex/visual-consistency]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/profile_page_v2.dart lib/screens/user_profile_screen.dart lib/screens/chat_inbox_screen.dart lib/screens/chat_screen.dart lib/screens/event_photo_create_screen.dart lib/screens/event_create_screen_v2.dart lib/screens/social_events_screen.dart lib/screens/events_hub_screen.dart lib/screens/create_post_screen.dart lib/screens/share_post_story_screen.dart lib/screens/travel_plan_detail_screen.dart lib/screens/route_create_screen.dart lib/screens/route_album_screen.dart lib/screens/settings_screen.dart lib/widgets/profile_content_navigation.dart lib/widgets/profile_favorite_places_section.dart lib/widgets/chat_request_banner.dart lib/widgets/tbt_dialog.dart lib/theme/app_theme.dart lib/widgets/chat_surface.dart lib/services/chat_appearance_service.dart test/chat_appearance_test.dart
      - run: flutter test test/profile_content_navigation_test.dart test/profile_identity_test.dart test/profile_ios_interaction_test.dart test/chat_appearance_test.dart test/chat_layout_test.dart test/swipe_to_reply_test.dart test/camera_share_controls_test.dart test/restored_flows_test.dart test/route_create_test.dart
      - run: flutter build bundle --debug

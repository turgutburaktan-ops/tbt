name: Apply requested UI fixes to feature

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_requested_ui_fixes_main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-v1
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Home: Çevrende = unified Radar/events, Campus optional; Reels moves to Home.
          p = Path('lib/screens/home_shell_screen.dart')
          s = p.read_text()
          s = s.replace("import 'events_hub_screen.dart';\n", '')
          if "import 'reels_screen.dart';" not in s:
              s = s.replace("import 'radar_screen.dart';\n", "import 'radar_screen.dart';\nimport 'reels_screen.dart';\n")
          old = """    final labels = campusEligible
        ? const ['Radar', 'Etkinlikler', 'Kampüs']
        : const ['Radar', 'Etkinlikler'];
    final effectiveSection = _section >= labels.length ? 0 : _section;
    final pages = <Widget>[
      const RadarScreen(embedded: true),
      const EventsHubScreen(),
      if (campusEligible) const CampusHomeScreen(),
    ];"""
          new = """    final labels = campusEligible
        ? const ['Çevrende', 'Kampüs']
        : const ['Çevrende'];
    final effectiveSection = _section >= labels.length ? 0 : _section;
    final pages = <Widget>[
      const RadarScreen(embedded: true),
      if (campusEligible) const CampusHomeScreen(),
    ];"""
          if old not in s: raise SystemExit('home nearby target missing')
          s = s.replace(old, new, 1)
          s = s.replace("'Radar, etkinlikler ve öğrencilere özel kampüs.'", "'Yakındaki planlar, etkinlikler ve öğrencilere özel kampüs.'", 1)
          old = """              child: _CompactTabs(
                firstLabel: 'Sana Özel',
                secondLabel: 'Takip',
                selected: _section,
                onChanged: (value) => setState(() => _section = value),
              ),"""
          new = """              child: _NearbyTabs(
                labels: const ['Sana Özel', 'Takip', 'Reels'],
                selected: _section,
                onChanged: (value) => setState(() => _section = value),
              ),"""
          if old not in s: raise SystemExit('home tab target missing')
          s = s.replace(old, new, 1)
          old = """                children: const [
                  _AuthAwareFeed(mode: FeedMode.forYou),
                  _AuthAwareFeed(mode: FeedMode.following),
                ],"""
          new = """                children: const [
                  _AuthAwareFeed(mode: FeedMode.forYou),
                  _AuthAwareFeed(mode: FeedMode.following),
                  ReelsScreen(),
                ],"""
          if old not in s: raise SystemExit('home reels target missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Radar: event creation stays on the unified page and opens photo-capable creator.
          p = Path('lib/screens/radar_screen.dart')
          s = p.read_text()
          if "import 'event_photo_create_screen.dart';" not in s:
              s = s.replace("import 'event_deep_link_screen.dart';\n", "import 'event_deep_link_screen.dart';\nimport 'event_photo_create_screen.dart';\n")
          marker = """        SearchableSelectionField(
          controller: _cityController,"""
          insert = """        SizedBox(
          width: double.infinity,
          child: FilledButton.icon(
            onPressed: () async {
              if (FirebaseAuth.instance.currentUser == null) {
                _message('Etkinlik oluşturmak için giriş yapmalısın.');
                return;
              }
              await Navigator.push<bool>(
                context,
                MaterialPageRoute(builder: (_) => const EventPhotoCreateScreen()),
              );
            },
            icon: const Icon(Icons.add_a_photo_outlined),
            label: const Text('Etkinlik Oluştur'),
          ),
        ),
        const SizedBox(height: 10),
        SearchableSelectionField(
          controller: _cityController,"""
          if marker not in s: raise SystemExit('radar target missing')
          s = s.replace(marker, insert, 1)
          p.write_text(s)

          # Video/Reels main capture 60 sec; Story remains 15 sec.
          p = Path('lib/screens/camera_screen.dart')
          s = p.read_text()
          old = "int get _videoLimitSeconds => widget.storyMode ? 15 : 30;"
          if old not in s: raise SystemExit('video target missing')
          p.write_text(s.replace(old, "int get _videoLimitSeconds => widget.storyMode ? 15 : 60;", 1))

          # Event creation bottom sheet gets required cover photo.
          p = Path('lib/screens/social_events_screen.dart')
          s = p.read_text()
          if "import 'dart:io';" not in s: s = "import 'dart:io';\n\n" + s
          if "package:firebase_storage/firebase_storage.dart" not in s:
              s = s.replace("import 'package:firebase_auth/firebase_auth.dart';\n", "import 'package:firebase_auth/firebase_auth.dart';\nimport 'package:firebase_storage/firebase_storage.dart';\n")
          if "package:image_picker/image_picker.dart" not in s:
              s = s.replace("import 'package:flutter/services.dart';\n", "import 'package:flutter/services.dart';\nimport 'package:image_picker/image_picker.dart';\n")
          old = """    EventLocationSelection? selectedLocation;
    bool saving = false;
    String? formError;"""
          new = """    EventLocationSelection? selectedLocation;
    final coverPicker = ImagePicker();
    File? coverImage;
    bool saving = false;
    String? formError;"""
          if old not in s: raise SystemExit('event state target missing')
          s = s.replace(old, new, 1)
          old = "          Future<void> chooseDateTime() async {"
          new = """          Future<void> chooseCoverImage() async {
            final source = await showModalBottomSheet<ImageSource>(
              context: context,
              useSafeArea: true,
              backgroundColor: const Color(0xFF121416),
              builder: (sheet) => Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  ListTile(leading: const Icon(Icons.camera_alt_outlined), title: const Text('Fotoğraf çek'), onTap: () => Navigator.pop(sheet, ImageSource.camera)),
                  ListTile(leading: const Icon(Icons.photo_library_outlined), title: const Text('Galeriden seç'), onTap: () => Navigator.pop(sheet, ImageSource.gallery)),
                ],
              ),
            );
            if (source == null) return;
            final picked = await coverPicker.pickImage(source: source, imageQuality: 88, maxWidth: 1800, requestFullMetadata: false);
            if (picked == null || !context.mounted) return;
            setSheetState(() { coverImage = File(picked.path); formError = null; });
          }

          Future<void> chooseDateTime() async {"""
          if old not in s: raise SystemExit('event picker target missing')
          s = s.replace(old, new, 1)
          marker = """                  const SizedBox(height: 16),
                  TextField(controller: titleController,"""
          block = """                  const SizedBox(height: 16),
                  GestureDetector(
                    onTap: saving ? null : chooseCoverImage,
                    child: Container(
                      height: 180,
                      width: double.infinity,
                      clipBehavior: Clip.antiAlias,
                      decoration: BoxDecoration(color: const Color(0xFF121416), borderRadius: BorderRadius.circular(18), border: Border.all(color: Colors.white12)),
                      child: coverImage == null
                          ? const Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                              Icon(Icons.add_a_photo_outlined, size: 42, color: Colors.white54),
                              SizedBox(height: 9),
                              Text('Etkinlik kapak fotoğrafı ekle', style: TextStyle(fontWeight: FontWeight.w900)),
                              SizedBox(height: 4),
                              Text('Kameradan çek veya galeriden seç', style: TextStyle(color: Colors.white54)),
                            ])
                          : Stack(fit: StackFit.expand, children: [
                              Image.file(coverImage!, fit: BoxFit.cover),
                              Positioned(right: 8, bottom: 8, child: FilledButton.tonalIcon(onPressed: saving ? null : chooseCoverImage, icon: const Icon(Icons.edit_outlined), label: const Text('Değiştir'))),
                            ]),
                    ),
                  ),
                  const SizedBox(height: 16),
                  TextField(controller: titleController,"""
          if marker not in s: raise SystemExit('event cover UI target missing')
          s = s.replace(marker, block, 1)
          old = """                              if (typedCapacity < 1) {
                                setSheetState(() => formError = 'Katılımcı sayısı en az 1 olmalı.');
                                return;
                              }
                              if (selectedLocation == null) {"""
          new = """                              if (typedCapacity < 1) {
                                setSheetState(() => formError = 'Katılımcı sayısı en az 1 olmalı.');
                                return;
                              }
                              if (coverImage == null) {
                                setSheetState(() => formError = 'Etkinlik için bir kapak fotoğrafı ekle.');
                                return;
                              }
                              if (selectedLocation == null) {"""
          if old not in s: raise SystemExit('event cover validation target missing')
          s = s.replace(old, new, 1)
          old = """                                final allowed = await EventPrivacyService.instance.resolveAudience(
                                  visibility,
                                  selectedUserIds: selectedPeople.keys.toList(),
                                );
                                await SocialEventService.instance.create(
                                  title: titleController.text,"""
          new = """                                final allowed = await EventPrivacyService.instance.resolveAudience(
                                  visibility,
                                  selectedUserIds: selectedPeople.keys.toList(),
                                );
                                final user = FirebaseAuth.instance.currentUser!;
                                final eventId = FirebaseFirestore.instance.collection(SocialEventService.collection).doc().id;
                                final coverRef = FirebaseStorage.instance.ref().child('users/${user.uid}/events/$eventId/cover.jpg');
                                await coverRef.putFile(coverImage!, SettableMetadata(contentType: 'image/jpeg'));
                                final coverUrl = await coverRef.getDownloadURL();
                                await SocialEventService.instance.create(
                                  eventId: eventId,
                                  coverImageUrl: coverUrl,
                                  coverStoragePath: coverRef.fullPath,
                                  title: titleController.text,"""
          if old not in s: raise SystemExit('event create upload target missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Service supports atomically storing cover fields on event creation.
          p = Path('lib/services/social_event_service.dart')
          s = p.read_text()
          old = """    List<String> allowedUserIds = const [],
    String? communityId,
    String? communityName,
  }) async {"""
          new = """    List<String> allowedUserIds = const [],
    String? communityId,
    String? communityName,
    String? eventId,
    String coverImageUrl = '',
    String coverStoragePath = '',
  }) async {"""
          if old not in s: raise SystemExit('service params target missing')
          s = s.replace(old, new, 1)
          old = "final ref = _firestore.collection(collection).doc();"
          if old not in s: raise SystemExit('service id target missing')
          s = s.replace(old, "final safeEventId = (eventId ?? '').trim();\n    final ref = safeEventId.isEmpty ? _firestore.collection(collection).doc() : _firestore.collection(collection).doc(safeEventId);", 1)
          old = """      'hostName': hostName,
      'communityId': safeCommunityId,"""
          new = """      'hostName': hostName,
      'coverImageUrl': coverImageUrl.trim(),
      'coverStoragePath': coverStoragePath.trim(),
      'communityId': safeCommunityId,"""
          if old not in s: raise SystemExit('service cover target missing')
          p.write_text(s.replace(old, new, 1))

          # Dedicated photo event creator uses same atomic path; remove forbidden post-create event update.
          p = Path('lib/screens/event_photo_create_screen.dart')
          s = p.read_text()
          old = """      final eventId = await SocialEventService.instance.create(
        title: _title.text,"""
          new = """      final eventId = FirebaseFirestore.instance.collection(SocialEventService.collection).doc().id;
      final ref = FirebaseStorage.instance.ref().child('users/${user.uid}/events/$eventId/cover.jpg');
      await ref.putFile(_image!, SettableMetadata(contentType: 'image/jpeg'));
      final url = await ref.getDownloadURL();
      await SocialEventService.instance.create(
        eventId: eventId,
        coverImageUrl: url,
        coverStoragePath: ref.fullPath,
        title: _title.text,"""
          if old not in s: raise SystemExit('photo event target missing')
          s = s.replace(old, new, 1)
          old = """
      final ref = FirebaseStorage.instance
          .ref()
          .child('users/${user.uid}/events/$eventId/cover.jpg');
      await ref.putFile(
        _image!,
        SettableMetadata(contentType: 'image/jpeg'),
      );
      final url = await ref.getDownloadURL();
      await FirebaseFirestore.instance
          .collection(SocialEventService.collection)
          .doc(eventId)
          .set({
        'coverImageUrl': url,
        'coverImageUpdatedAt': FieldValue.serverTimestamp(),
      }, SetOptions(merge: true));
"""
          if old not in s: raise SystemExit('photo event old update target missing')
          p.write_text(s.replace(old, '\n', 1))

          # OpenStreetMap dependencies are no longer needed.
          p = Path('pubspec.yaml')
          s = p.read_text().replace('  flutter_map: ^8.2.2\n', '').replace('  latlong2: ^0.9.1\n', '')
          p.write_text(s)

          offenders = []
          for f in Path('lib').rglob('*.dart'):
              t = f.read_text()
              if 'flutter_map' in t or 'openstreetmap.org' in t or 'package:latlong2' in t:
                  offenders.append(str(f))
          if offenders: raise SystemExit('OSM refs remain: ' + ', '.join(offenders))
          PY
          dart format lib/screens/home_shell_screen.dart lib/screens/radar_screen.dart lib/screens/camera_screen.dart lib/screens/social_events_screen.dart lib/screens/event_photo_create_screen.dart lib/services/social_event_service.dart lib/screens/selected_route_map_screen.dart || true
      - name: Commit and push
        run: |
          git config user.name 'tbt-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib pubspec.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: apply requested nearby reels event photo and maps changes'
          git push origin HEAD:feature/video-v1

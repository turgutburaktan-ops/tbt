name: best_photo_spot
description: Smart photography assistant MVP.
publish_to: "none"
version: 1.0.4+6

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  firebase_core: 4.13.0
  firebase_messaging: 16.5.0
  firebase_app_check: 0.4.6
  shared_preferences: ^2.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_auth: 6.5.7
  google_sign_in: ^6.2.2
  cloud_firestore: 6.8.0
  cloud_functions: 6.3.6
  firebase_storage: 13.4.6
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  camerawesome: ^2.5.0
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  image_picker: ^1.1.2
  image: ^4.3.0
  google_fonts: ^6.3.0
  # v7 adds Gradle 9 support required by the current Flutter Android host.
  google_mobile_ads: ^7.0.0
  flutter_image_filters: ^0.0.32
  http: ^1.2.2
  sensors_plus: ^6.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  url_launcher: 6.3.1
  app_links: ^6.4.0
  share_plus: ^12.0.2
  video_player: ^2.10.0
  video_compress: ^3.1.4
  record: ^6.2.1
  just_audio: ^0.10.6
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/spot_thumbnails/tbt_app_icon.jpg
  remove_alpha_ios: true
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/spot_thumbnails/

dependency_overrides:
  geolocator_android: 4.6.1


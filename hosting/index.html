<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090A0C" />
  <title>Davet • En İyi Çekim Noktası</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090A0C;
      color: #F3F4F6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    .card {
      width: min(460px, 100%);
      background: #121416;
      border: 1px solid #2A2E33;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #1A1D20;
      font-size: 34px;
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0; color: #A8ADB4; line-height: 1.5; }
    .button {
      margin-top: 24px;
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px 18px;
      background: #D7DBE0;
      color: #090A0C;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .hint { margin-top: 14px; font-size: 13px; color: #747B83; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" id="icon">↗</div>
    <h1 id="title">Davet açılıyor…</h1>
    <p id="description">Uygulama yüklüyse ilgili sayfaya yönlendirileceksin.</p>
    <button class="button" id="openButton" type="button">Uygulamada Aç</button>
    <div class="hint" id="hint">Açılmazsa uygulamanın güncel sürümünün yüklü olduğundan emin ol.</div>
  </main>

  <script>
    (() => {
      const parts = location.pathname.split('/').filter(Boolean);
      const type = parts[0] || '';
      const id = parts[1] || '';
      const valid = (type === 'event' || type === 'community') && id.length > 0;
      const title = document.getElementById('title');
      const description = document.getElementById('description');
      const icon = document.getElementById('icon');
      const button = document.getElementById('openButton');
      const hint = document.getElementById('hint');

      if (!valid) {
        title.textContent = 'Davet bulunamadı';
        description.textContent = 'Bu bağlantı eksik veya geçersiz.';
        icon.textContent = '!';
        button.hidden = true;
        hint.hidden = true;
        return;
      }

      const cleanId = encodeURIComponent(id);
      const appUrl = `tbt://${type}/${cleanId}`;
      title.textContent = type === 'event' ? 'Etkinlik daveti' : 'Topluluk daveti';
      description.textContent = 'En İyi Çekim Noktası uygulamasında bu daveti aç.';
      icon.textContent = type === 'event' ? '◉' : '◎';

      const openApp = () => {
        window.location.href = appUrl;
      };

      button.addEventListener('click', openApp);

      // Some mobile browsers allow a custom-scheme handoff directly after QR navigation.
      // If they block it, the explicit button above always remains available.
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        setTimeout(openApp, 500);
      }
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TBT bağlantısı</title><style>body{background:#07090f;color:#fff;font:18px system-ui;padding:32px}a{color:#8fb0ff}</style></head>
<body><h1>TBT bağlantısı açılıyor…</h1><p>Uygulama yüklüyse uygulamada, yüklü değilse cihazına uygun mağazada devam edebilirsin.</p><a id="continue" href="https://www.trtbt.com/download">TBT’yi aç / indir</a>
<script>
(function(){
 var path=location.pathname;
 if((path==='/'||path==='/invite.html'||path==='/open.html')&&location.hash.indexOf('#/')===0)path=location.hash.slice(1);
 else if((path==='/invite.html'||path==='/open.html')&&location.hash){try{path=decodeURIComponent(location.hash.slice(1));}catch(_){path='';}}
 var simple=/^\/(route|event|etkinlikler|post|spot|mekanlar|profile|community|creator-profile|group|creator)\/([A-Za-z0-9_-]{1,128})\/?$/.exec(path);
 var role=/^\/davet\/(creator|explorer|social|gourmet)\/([A-Za-z0-9_-]{1,128})\/?$/.exec(path);
 var destination='/download';
 if(simple){var type=simple[1]==='etkinlikler'?'event':simple[1]==='mekanlar'?'spot':simple[1];destination='/'+type+'/'+simple[2];}
 else if(role)destination='/davet/'+role[1]+'/'+role[2];
 var url='https://www.trtbt.com'+destination;
 document.getElementById('continue').href=url;
 location.replace(url);
})();
</script></body></html>
